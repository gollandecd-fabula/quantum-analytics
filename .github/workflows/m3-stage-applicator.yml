name: M3 Stage Applicator

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'tmp/quantum-m3-stage'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: tmp/quantum-m3-stage
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.13.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.14'

      - name: Apply bounded M3 patches and verify
        shell: bash
        env:
          M2_HEAD: 3aad43573b205a98e2f2f718e208c8ba763d535e
        run: |
          set -euo pipefail
          test -f tools/M3_CI_CONSOLIDATION_TRIGGER.txt
          test "$(git merge-base HEAD "$M2_HEAD")" = "$M2_HEAD"
          python - <<'PYCODE'
          from __future__ import annotations
          import hashlib
          import json
          from pathlib import Path

          root = Path.cwd()

          def replace_once(path: str, old: str, new: str) -> None:
              target = root / path
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'M3_REPLACE_COUNT:{path}:{count}')
              target.write_text(text.replace(old, new), encoding='utf-8', newline='\n')

          replace_once(
              'scripts/ci/l4_installed_runtime.ps1',
              '[CmdletBinding()]\nparam()\n',
              '[CmdletBinding()]\nparam(\n    [string]$PackageArchive = "",\n    [ValidatePattern("^[A-Za-z0-9_-]+$")]\n    [string]$EvidenceSlot = "default"\n)\n',
          )
          replace_once(
              'scripts/ci/l4_installed_runtime.ps1',
              '$EvidenceRoot = Join-Path $RepoRoot "artifacts\\l4-installed-runtime"\n$BuildRoot = Join-Path $RepoRoot "dist\\l4-installed-runtime-build"\n$ExtractRoot = Join-Path $env:RUNNER_TEMP "quantum-l4-package"\n$InstallRoot = Join-Path $env:RUNNER_TEMP "quantum-l4-installed"\n$TamperRoot = Join-Path $env:RUNNER_TEMP "quantum-l4-tampered"\n',
              '$EvidenceRoot = Join-Path $RepoRoot ("artifacts\\l4-installed-runtime-" + $EvidenceSlot)\n$BuildRoot = Join-Path $RepoRoot ("dist\\l4-installed-runtime-build-" + $EvidenceSlot)\n$ExtractRoot = Join-Path $env:RUNNER_TEMP ("quantum-l4-package-" + $EvidenceSlot)\n$InstallRoot = Join-Path $env:RUNNER_TEMP ("quantum-l4-installed-" + $EvidenceSlot)\n$TamperRoot = Join-Path $env:RUNNER_TEMP ("quantum-l4-tampered-" + $EvidenceSlot)\n',
          )
          replace_once(
              'scripts/ci/l4_installed_runtime.ps1',
              '$Step = "PACKAGE_BUILD"\npowershell.exe `\n    -NoProfile `\n    -ExecutionPolicy Bypass `\n    -File .\\scripts\\windows\\build_local_production.ps1 `\n    -OutputDirectory $BuildRoot\nif ($LASTEXITCODE -ne 0) {\n    throw ("L4_PACKAGE_BUILD_FAILED:{0}" -f $LASTEXITCODE)\n}\n$archive = Join-Path $BuildRoot "QuantumLocalProduction_HOME_LOCAL.zip"\nif (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {\n    throw "L4_PACKAGE_NOT_FOUND"\n}\n$packageHash = Get-Sha256 -Path $archive\n',
              '$Step = "PACKAGE_SOURCE"\n$packageOrigin = "BUILT_IN_JOB"\nif ([string]::IsNullOrWhiteSpace($PackageArchive)) {\n    powershell.exe `\n        -NoProfile `\n        -ExecutionPolicy Bypass `\n        -File .\\scripts\\windows\\build_local_production.ps1 `\n        -OutputDirectory $BuildRoot\n    if ($LASTEXITCODE -ne 0) {\n        throw ("L4_PACKAGE_BUILD_FAILED:{0}" -f $LASTEXITCODE)\n    }\n    $archive = Join-Path $BuildRoot "QuantumLocalProduction_HOME_LOCAL.zip"\n}\nelse {\n    $archive = (Resolve-Path -LiteralPath $PackageArchive).Path\n    $packageOrigin = "PREBUILT_SAME_ARTIFACT"\n}\nif (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {\n    throw "L4_PACKAGE_NOT_FOUND"\n}\n$packageHash = Get-Sha256 -Path $archive\n',
          )
          replace_once(
              'scripts/ci/l4_installed_runtime.ps1',
              '    status = "L4_INSTALLED_RUNTIME_PASS"\n    evidence_level = "L4_INSTALLED_RUNTIME"\n    exact_head = $ExactHead\n',
              '    status = "L4_INSTALLED_RUNTIME_PASS"\n    evidence_level = "L4_INSTALLED_RUNTIME"\n    exact_head = $ExactHead\n    validation_slot = $EvidenceSlot\n',
          )
          replace_once(
              'scripts/ci/l4_installed_runtime.ps1',
              '    source_package = [ordered]@{\n        path = $archive\n',
              '    source_package = [ordered]@{\n        path = $archive\n        origin = $packageOrigin\n',
          )
          replace_once(
              'scripts/ci/l4_installed_runtime_postcheck.ps1',
              '[CmdletBinding()]\nparam()\n',
              '[CmdletBinding()]\nparam(\n    [ValidatePattern("^[A-Za-z0-9_-]+$")]\n    [string]$EvidenceSlot = "default"\n)\n',
          )
          replace_once(
              'scripts/ci/l4_installed_runtime_postcheck.ps1',
              '$EvidenceRoot = Join-Path $RepoRoot "artifacts\\l4-installed-runtime"\n',
              '$EvidenceRoot = Join-Path $RepoRoot ("artifacts\\l4-installed-runtime-" + $EvidenceSlot)\n',
          )

          integration = root / 'tests/integration_manifest_support_m8.py'
          text = integration.read_text(encoding='utf-8')
          if text.count('for number in range(1, 97)') != 1:
              raise SystemExit('M3_MANIFEST_RANGE_NOT_FOUND')
          integration.write_text(
              text.replace('for number in range(1, 97)', 'for number in range(1, 98)'),
              encoding='utf-8',
              newline='\n',
          )

          (root / 'tools/M3_CI_CONSOLIDATION_TRIGGER.txt').unlink()

          entries = []
          for relative in (
              '.github/workflows/m3-consolidated-ci.yml',
              'scripts/ci/l4_installed_runtime.ps1',
              'scripts/ci/l4_installed_runtime_postcheck.ps1',
              'tools/m3_same_artifact_compare.py',
              'tests/test_m3_ci_consolidation.py',
              'tests/integration_manifest_support_m8.py',
              'docs/evidence/M3_CI_CONSOLIDATION_RTM.json',
          ):
              data = (root / relative).read_bytes()
              entries.append([relative, hashlib.sha256(data).hexdigest(), len(data)])
          manifest = {
              'base_pilot_integration_r96_overlay_git_blob_sha': '6e84f14ba0fa9f52aebe5d9a5288a3fe820ef44b',
              'entries': entries,
              'hash_encoding': 'sha256-hex',
              'overlay_version': 97,
              'reason': 'M3 CI consolidation: source gates precede one HOME_LOCAL package build; two independent Windows L4 validators consume the same hash-bound artifact. Approved UI, Gatekeeper disconnection, WB_ONLY scope and marketplace-write-disabled state are unchanged.',
              'remove_paths': ['tools/M3_CI_CONSOLIDATION_TRIGGER.txt'],
          }
          path = root / 'docs/evidence/ARTIFACT_MANIFEST_OVERLAY_PILOT_INTEGRATION_R97.json'
          path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PYCODE

          git add -A
          export PYTHONPATH="$PWD/src"
          export PYTHONDONTWRITEBYTECODE=1
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/m3-stage-pycache"
          python -m compileall -q src tools tests/test_m3_ci_consolidation.py
          python -m unittest tests.test_m3_ci_consolidation -v
          python -m unittest tests.test_l4_installed_runtime_contract tests.test_l4_installed_runtime_postcheck_contract -v
          python -m quantum.scripts.ci
          git config user.name quantum-m3-stage-bot
          git config user.email quantum-m3-stage-bot@users.noreply.github.com
          git commit -m 'ci(quantum): apply M3 same-artifact support and evidence'
          git push origin HEAD:tmp/quantum-m3-stage
