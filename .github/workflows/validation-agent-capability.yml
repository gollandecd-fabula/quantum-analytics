name: Validation Agent Capability

on:
  push:
    branches:
      - "validation/quantum/agent-capability-*"

permissions:
  contents: read

concurrency:
  group: validation-agent-capability-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capability:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Fetch exact validation head and base
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
          BASE_SHA: "144978c1bcf1de777fef3d161280a9016ea03998"
        run: |
          set -euo pipefail
          test -n "${TARGET_SHA}"
          test "${GITHUB_REF_NAME}" != "main"
          case "${GITHUB_REF_NAME}" in validation/quantum/agent-capability-*) ;; *) exit 91 ;; esac
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=4 origin "${TARGET_SHA}" "${BASE_SHA}"
          git checkout --detach "${TARGET_SHA}"
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Enforce capability-only scope
        env:
          BASE_SHA: "144978c1bcf1de777fef3d161280a9016ea03998"
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "${BASE_SHA}..${TARGET_SHA}" | tee /tmp/changed-paths.txt
          if grep -E '^(ImageLab|imagelab)/' /tmp/changed-paths.txt; then exit 92; fi
          if grep -Ev '^(\.github/workflows/validation-agent-capability\.yml|\.validation-agent/FAIL_ON_PURPOSE)$' /tmp/changed-paths.txt | grep -q .; then
            echo "BLOCKED_SCOPE: unexpected path"
            exit 93
          fi

      - name: Controlled failure probe
        run: |
          set -euo pipefail
          if test -f .validation-agent/FAIL_ON_PURPOSE; then
            echo "INTENTIONAL_VALIDATION_FAILURE: expected first-run probe"
            exit 42
          fi
          echo "CONTROLLED_FAILURE_REMOVED"

      - name: Run Quantum source checks
        run: |
          set -euo pipefail
          python3 --version
          python3 -m compileall -q src tests tools
          PYTHONPATH=src python3 -m quantum.scripts.ci
