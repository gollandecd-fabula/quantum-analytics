name: Temporary QUR2 Final Source Export

on:
  push:
    branches:
      - fix/quantum-universal-relaunch-r2
    paths:
      - .github/workflows/tmp-qur2-final-source-export.yml

permissions:
  contents: read

env:
  TARGET_SHA: 8b90cbb1e23704005d3ad732b21108bf0c5c609e

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
      - name: Export exact target tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git archive --format=tar.gz --output="$RUNNER_TEMP/qur2-final-source.tar.gz" HEAD
          sha256sum "$RUNNER_TEMP/qur2-final-source.tar.gz" > "$RUNNER_TEMP/qur2-final-source.sha256"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/qur2-final-source.tree-sha"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: QUR2-Final-Source-8b90cbb
          path: |
            ${{ runner.temp }}/qur2-final-source.tar.gz
            ${{ runner.temp }}/qur2-final-source.sha256
            ${{ runner.temp }}/qur2-final-source.tree-sha
          if-no-files-found: error
          retention-days: 3
