name: Apply Quantum M2 R96 Correction

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply-r96:
    if: github.event.pull_request.head.ref == 'tmp/quantum-m2-r96-stage'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact R96 stage
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.13.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.14'

      - name: Verify and apply exact R96 delta
        shell: bash
        env:
          M1_HEAD: ad5229bbaca3cf8ae692ecb09f54220cde1db16b
          STAGE_BRANCH: tmp/quantum-m2-r96-stage
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$M1_HEAD")" = "$M1_HEAD"
          python - <<'PYCODE'
          from __future__ import annotations
          import base64, hashlib, io, json, subprocess, tarfile
          from pathlib import Path, PurePosixPath

          root = Path.cwd()
          parts = [root / 'tools' / f'm2_r96_part_{i:02d}.txt' for i in range(2)]
          actual = sorted((root / 'tools').glob('m2_r96_part_*.txt'))
          if actual != parts:
              raise SystemExit(f'R96_PART_SET_MISMATCH:{[p.name for p in actual]}')
          encoded = b''.join(p.read_bytes() for p in parts)
          if len(encoded) != 11488:
              raise SystemExit(f'R96_BASE64_SIZE_MISMATCH:{len(encoded)}')
          if hashlib.sha256(encoded).hexdigest() != '20af535c7499b0759c3694373306de9b034876a8a3a4ca44b4d05c504421b48f':
              raise SystemExit('R96_BASE64_SHA256_MISMATCH')
          payload = base64.b64decode(encoded, validate=True)
          if len(payload) != 8616:
              raise SystemExit(f'R96_TAR_SIZE_MISMATCH:{len(payload)}')
          if hashlib.sha256(payload).hexdigest() != '53cbe3e07588eead651fb24a04da8c58cd3582f664c879a090ca8aae14651b66':
              raise SystemExit('R96_TAR_SHA256_MISMATCH')
          expected = {
              '.github/workflows/foundation-ci.yml': (1442, 'fa7d823675144037b13a4bde378a0937dc0c799cb1f939e3815f17c3169950f1'),
              '.github/workflows/oss-admission-ci.yml': (1633, 'd057a43633817c4da51d5ff22890eb026088732600cead791a5f8b8facf62a9b'),
              'pyproject.toml': (849, '743a4a9d2984ded4ddcf3eeaf06506c62af0bd45f7b42df2f96b092c208bae9a'),
              'src/quantum/application/_finance_profile_groups.py': (12219, '558a7f7290e77cad0888f6ad9a3b1c049603be073bf0aa86c82439c915c3f1ca'),
              'tests/test_m2_runtime_dependency_modernization.py': (4650, 'ccb238aa62d4c6a4ff941a5e78b98c12dce7426d0110b4e4d88569839c6fb7dd'),
              'tests/integration_manifest_support_m8.py': (1090, '9c3b491182f25271a4dce5478e55147f1d2182f1c2745022c9ca9e96467b8556'),
              'docs/evidence/M2_RUNTIME_DEPENDENCY_MODERNIZATION_RTM.json': (2266, '5d5038eefc53f252235c07f2724d12290f15dc8b8c35ccd31acd7f7ca9263e25'),
              'docs/evidence/M2_RUNTIME_DEPENDENCY_MODERNIZATION_CORRECTION_R96.json': (1228, '95025cbe5fce2205c8cb7a79e91aaeaa1f49c97b2751e016f0a9002d9fa95ad1'),
              'docs/evidence/ARTIFACT_MANIFEST_OVERLAY_PILOT_INTEGRATION_R96.json': (1727, '8ad846e1a86893548be79d1a7d7e8485cf4cd365fe6f970f3a01b48859620dde'),
          }
          with tarfile.open(fileobj=io.BytesIO(payload), mode='r:gz') as archive:
              names=[]
              for member in archive.getmembers():
                  pure=PurePosixPath(member.name)
                  if pure.is_absolute() or '..' in pure.parts or member.issym() or member.islnk() or member.isdev():
                      raise SystemExit(f'R96_UNSAFE_MEMBER:{member.name}')
                  if member.isfile(): names.append(member.name)
              if set(names) != set(expected):
                  raise SystemExit(f'R96_MEMBER_SET_MISMATCH:{sorted(names)}')
              archive.extractall(root, filter='data')
          for relative,(size,digest) in expected.items():
              data=(root/relative).read_bytes()
              if len(data)!=size or hashlib.sha256(data).hexdigest()!=digest:
                  raise SystemExit(f'R96_FILE_MISMATCH:{relative}')
          for part in parts:
              subprocess.run(['git','rm','-f','--',str(part.relative_to(root))],check=True)
          PYCODE
          git add -A
          export PYTHONPATH="$PWD/src"
          export PYTHONDONTWRITEBYTECODE=1
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/m2-r96-pycache"
          python -m compileall -q src
          python -m unittest tests.test_m2_runtime_dependency_modernization -v
          python -m unittest \
            tests.test_quantum_reaudit_plateau_r1.QuantumReauditPlateauR1Tests.test_output_bundle_is_transactional_unique_and_governed \
            tests.test_quantum_reaudit_plateau_r1.QuantumReauditPlateauR1Tests.test_recommendations_are_human_readable_and_keep_code \
            tests.test_quantum_reaudit_plateau_r1.QuantumReauditPlateauR1Tests.test_concurrent_output_names_do_not_collide -v
          python -m quantum.scripts.ci
          git config user.name quantum-m2-r96-bot
          git config user.email quantum-m2-r96-bot@users.noreply.github.com
          git reset --soft "$M1_HEAD"
          git add -A
          test "$(git diff --cached --name-only | wc -l)" -eq 31
          git commit -m 'chore(quantum): complete corrected M2 runtime modernization R96'
          test "$(git rev-list --count "$M1_HEAD"..HEAD)" -eq 1
          test "$(git rev-parse HEAD^)" = "$M1_HEAD"
          {
            echo "M1_HEAD=$M1_HEAD"
            echo "CORRECTED_COMMIT=$(git rev-parse HEAD)"
            echo "CORRECTED_TREE=$(git rev-parse 'HEAD^{tree}')"
            echo "PARENT=$(git rev-parse 'HEAD^')"
            echo "CHANGED_COUNT=$(git diff --name-only "$M1_HEAD" HEAD | wc -l)"
          } | tee m2-r96-commit-metadata.txt
          git push --force origin "HEAD:$STAGE_BRANCH" || true

      - name: Upload R96 exact commit metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m2-r96-commit-metadata
          path: m2-r96-commit-metadata.txt
          if-no-files-found: error
          retention-days: 2
