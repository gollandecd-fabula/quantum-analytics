name: Temporary SLR1 Windows Diagnostic V3

on:
  pull_request:
    paths:
      - ".github/workflows/temp-slr1-windows-diagnostic-v3.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      EXACT_SHA: 4928b7a8c25eeffd2cafe9814878d1ea57f7e515
    steps:
      - shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.EXACT_SHA }}
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.14"
      - name: Execute exact combined path with transcript
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $log = Join-Path $env:RUNNER_TEMP "slr1-windows-v3.txt"
          Start-Transcript -Path $log -Force
          try {
            function Mark([string]$Name) { Write-Host "========== $Name ==========" }
            $dist = Join-Path $env:RUNNER_TEMP "SLR1 package build"
            $packageRoot = Join-Path $env:RUNNER_TEMP "SLR1 package extracted"
            $target = Join-Path $env:RUNNER_TEMP "Quantum тест с пробелом"
            $partial = Join-Path $env:RUNNER_TEMP "Quantum incomplete"
            Remove-Item $dist,$packageRoot,$target,$partial -Recurse -Force -ErrorAction SilentlyContinue

            Mark "BUILD"
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\windows\build_local_production.ps1 -OutputDirectory $dist
            Write-Host "BUILD_EXIT=$LASTEXITCODE"
            if ($LASTEXITCODE -ne 0) { throw "HOME_LOCAL package build failed." }
            Expand-Archive -LiteralPath (Join-Path $dist "QuantumLocalProduction_HOME_LOCAL.zip") -DestinationPath $packageRoot -Force

            Mark "SEED_STALE"
            $desktop = [Environment]::GetFolderPath([Environment+SpecialFolder]::DesktopDirectory)
            $shortcutPath = Join-Path $desktop "Центр решений Quantum.lnk"
            $shell = New-Object -ComObject WScript.Shell
            $stale = $shell.CreateShortcut($shortcutPath)
            $stale.TargetPath = Join-Path $target "scripts\one_click_home_local.ps1"
            $stale.WorkingDirectory = $target
            $stale.Save()

            Mark "INSTALL"
            & (Join-Path $packageRoot "scripts\install_home_local.ps1") -SourceRoot $packageRoot -TargetRoot $target
            Write-Host "INSTALL_EXIT=$LASTEXITCODE"
            if ($LASTEXITCODE -ne 0) { throw "Clean installation failed." }

            Mark "REQUIRED_COMPONENTS"
            foreach ($required in @("START_QUANTUM.cmd","scripts\one_click_home_local.ps1","scripts\import_source.ps1","scripts\configure_home_local.ps1","src\quantum\pilot\windows_runner.py","src\quantum\application\desktop_center.py")) {
              $candidate = Join-Path $target $required
              Write-Host "REQUIRED:$required=$(Test-Path $candidate -PathType Leaf)"
              if (-not (Test-Path $candidate -PathType Leaf)) { throw "Installed component missing: $required" }
            }

            Mark "SHORTCUT_1"
            $verified = $shell.CreateShortcut($shortcutPath)
            $expectedTarget = [IO.Path]::GetFullPath((Join-Path $target "START_QUANTUM.cmd"))
            Write-Host "TARGET=$($verified.TargetPath)"
            Write-Host "EXPECTED=$expectedTarget"
            Write-Host "ARGS=<$($verified.Arguments)>"
            Write-Host "WORKDIR=<$($verified.WorkingDirectory)>"
            if (-not ([IO.Path]::GetFullPath([string]$verified.TargetPath)).Equals($expectedTarget,[StringComparison]::OrdinalIgnoreCase)) { throw "Shortcut target was not repaired." }
            if (-not [string]::IsNullOrWhiteSpace([string]$verified.Arguments)) { throw "Shortcut contains stale arguments." }

            Mark "DIRECT"
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $target "scripts\one_click_home_local.ps1") -InstallOnly -NoOpenResult
            Write-Host "DIRECT_EXIT=$LASTEXITCODE"
            if ($LASTEXITCODE -ne 0) { throw "Direct installed-script launch failed." }

            Mark "CMD"
            cmd.exe /d /c "`"$(Join-Path $target 'START_QUANTUM.cmd')`" -InstallOnly -NoOpenResult"
            Write-Host "CMD_EXIT=$LASTEXITCODE"
            if ($LASTEXITCODE -ne 0) { throw "START_QUANTUM.cmd launch failed." }

            Mark "SENTINELS"
            foreach ($folder in @("config", "data", "output")) {
              $path = Join-Path $target "$folder\slr1-sentinel.txt"
              [IO.File]::WriteAllText($path, "preserve-$folder", [Text.Encoding]::UTF8)
            }
            $before = @{}
            foreach ($folder in @("config", "data", "output")) {
              $path = Join-Path $target "$folder\slr1-sentinel.txt"
              $before[$folder] = (Get-FileHash $path -Algorithm SHA256).Hash
              Write-Host "BEFORE:$folder=$($before[$folder])"
            }

            Mark "REPAIR"
            $stale = $shell.CreateShortcut($shortcutPath)
            $stale.TargetPath = Join-Path $target "scripts\one_click_home_local.ps1"
            $stale.WorkingDirectory = $target
            $stale.Save()
            & (Join-Path $packageRoot "scripts\install_home_local.ps1") -SourceRoot $packageRoot -TargetRoot $target
            Write-Host "REPAIR_EXIT=$LASTEXITCODE"
            if ($LASTEXITCODE -ne 0) { throw "Repair installation failed." }

            Mark "PRESERVATION"
            foreach ($folder in @("config", "data", "output")) {
              $path = Join-Path $target "$folder\slr1-sentinel.txt"
              $after = (Get-FileHash $path -Algorithm SHA256).Hash
              Write-Host "AFTER:$folder=$after"
              if ($after -ne $before[$folder]) { throw "User data changed during repair: $folder" }
            }
            $verified = $shell.CreateShortcut($shortcutPath)
            Write-Host "REPAIRED_TARGET=$($verified.TargetPath)"
            if (-not ([IO.Path]::GetFullPath([string]$verified.TargetPath)).Equals($expectedTarget,[StringComparison]::OrdinalIgnoreCase)) { throw "Stale shortcut survived repair." }

            Mark "PARTIAL"
            New-Item (Join-Path $partial "scripts") -ItemType Directory -Force | Out-Null
            Copy-Item (Join-Path $target "scripts\one_click_home_local.ps1") (Join-Path $partial "scripts\one_click_home_local.ps1") -Force
            $partialLog = Join-Path $env:RUNNER_TEMP "slr1-partial-v3.log"
            $previousErrorActionPreference = $ErrorActionPreference
            $ErrorActionPreference = "Continue"
            try {
              powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $partial "scripts\one_click_home_local.ps1") -InstallOnly -NoOpenResult *> $partialLog
              $partialExitCode = $LASTEXITCODE
              Write-Host "PARTIAL_EXIT_CAPTURED=$partialExitCode"
            }
            finally { $ErrorActionPreference = $previousErrorActionPreference }
            Write-Host "PARTIAL_EXIT_AFTER_RESTORE=$partialExitCode"
            $partialText = Get-Content $partialLog -Raw
            Write-Host "PARTIAL_TEXT_BEGIN"
            Write-Host $partialText
            Write-Host "PARTIAL_TEXT_END"
            if ($partialExitCode -eq 0) { throw "Incomplete installation was accepted." }
            if ($partialText -notmatch "HOME_LOCAL_INSTALLATION_INCOMPLETE") { throw "Incomplete installation did not emit the repair code." }
            Mark "V3_PASS"
          }
          catch {
            Write-Host "V3_EXCEPTION_TYPE=$($_.Exception.GetType().FullName)"
            Write-Host "V3_EXCEPTION_MESSAGE=$($_.Exception.Message)"
            Write-Host "V3_STACK=$($_.ScriptStackTrace)"
            Write-Host ($_ | Format-List * -Force | Out-String)
            $global:failed = $true
          }
          finally { Stop-Transcript }
          if ($global:failed) { exit 1 }
      - name: Upload transcript
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: SLR1-Windows-Diagnostic-V3
          path: |
            ${{ runner.temp }}/slr1-windows-v3.txt
            ${{ runner.temp }}/slr1-partial-v3.log
          if-no-files-found: warn
          retention-days: 3
