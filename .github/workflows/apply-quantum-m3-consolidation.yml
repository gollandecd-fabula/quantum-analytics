name: Apply Quantum M3 CI Consolidation

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'tmp/quantum-m3-stage'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact staging head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.13.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.14'

      - name: Apply bounded M3 source changes
        shell: bash
        env:
          M2_HEAD: 3aad43573b205a98e2f2f718e208c8ba763d535e
          STAGE_BRANCH: tmp/quantum-m3-stage
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$M2_HEAD")" = "$M2_HEAD"
          python - <<'PYCODE'
          from __future__ import annotations
          import hashlib
          import json
          from pathlib import Path

          root = Path.cwd()

          def replace_once(path: str, old: str, new: str) -> None:
              target = root / path
              text = target.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'M3_REPLACE_COUNT:{path}:{text.count(old)}')
              target.write_text(text.replace(old, new), encoding='utf-8', newline='\n')

          replace_once(
              'scripts/ci/l4_installed_runtime.ps1',
              '[CmdletBinding()]\nparam()\n',
              '[CmdletBinding()]\nparam(\n    [string]$PackageArchive = "",\n    [ValidatePattern("^[A-Za-z0-9_-]+$")]\n    [string]$EvidenceSlot = "default"\n)\n',
          )
          replace_once(
              'scripts/ci/l4_installed_runtime.ps1',
              '$EvidenceRoot = Join-Path $RepoRoot "artifacts\\l4-installed-runtime"\n$BuildRoot = Join-Path $RepoRoot "dist\\l4-installed-runtime-build"\n$ExtractRoot = Join-Path $env:RUNNER_TEMP "quantum-l4-package"\n$InstallRoot = Join-Path $env:RUNNER_TEMP "quantum-l4-installed"\n$TamperRoot = Join-Path $env:RUNNER_TEMP "quantum-l4-tampered"\n',
              '$EvidenceRoot = Join-Path $RepoRoot ("artifacts\\l4-installed-runtime-" + $EvidenceSlot)\n$BuildRoot = Join-Path $RepoRoot ("dist\\l4-installed-runtime-build-" + $EvidenceSlot)\n$ExtractRoot = Join-Path $env:RUNNER_TEMP ("quantum-l4-package-" + $EvidenceSlot)\n$InstallRoot = Join-Path $env:RUNNER_TEMP ("quantum-l4-installed-" + $EvidenceSlot)\n$TamperRoot = Join-Path $env:RUNNER_TEMP ("quantum-l4-tampered-" + $EvidenceSlot)\n',
          )
          replace_once(
              'scripts/ci/l4_installed_runtime.ps1',
              '''$Step = "PACKAGE_BUILD"\npowershell.exe `\n    -NoProfile `\n    -ExecutionPolicy Bypass `\n    -File .\\scripts\\windows\\build_local_production.ps1 `\n    -OutputDirectory $BuildRoot\nif ($LASTEXITCODE -ne 0) {\n    throw ("L4_PACKAGE_BUILD_FAILED:{0}" -f $LASTEXITCODE)\n}\n$archive = Join-Path $BuildRoot "QuantumLocalProduction_HOME_LOCAL.zip"\nif (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {\n    throw "L4_PACKAGE_NOT_FOUND"\n}\n$packageHash = Get-Sha256 -Path $archive\n''',
              '''$Step = "PACKAGE_SOURCE"\n$packageOrigin = "BUILT_IN_JOB"\nif ([string]::IsNullOrWhiteSpace($PackageArchive)) {\n    powershell.exe `\n        -NoProfile `\n        -ExecutionPolicy Bypass `\n        -File .\\scripts\\windows\\build_local_production.ps1 `\n        -OutputDirectory $BuildRoot\n    if ($LASTEXITCODE -ne 0) {\n        throw ("L4_PACKAGE_BUILD_FAILED:{0}" -f $LASTEXITCODE)\n    }\n    $archive = Join-Path $BuildRoot "QuantumLocalProduction_HOME_LOCAL.zip"\n}\nelse {\n    $archive = (Resolve-Path -LiteralPath $PackageArchive).Path\n    $packageOrigin = "PREBUILT_SAME_ARTIFACT"\n}\nif (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {\n    throw "L4_PACKAGE_NOT_FOUND"\n}\n$packageHash = Get-Sha256 -Path $archive\n''',
          )
          replace_once(
              'scripts/ci/l4_installed_runtime.ps1',
              '    status = "L4_INSTALLED_RUNTIME_PASS"\n    evidence_level = "L4_INSTALLED_RUNTIME"\n    exact_head = $ExactHead\n',
              '    status = "L4_INSTALLED_RUNTIME_PASS"\n    evidence_level = "L4_INSTALLED_RUNTIME"\n    exact_head = $ExactHead\n    validation_slot = $EvidenceSlot\n',
          )
          replace_once(
              'scripts/ci/l4_installed_runtime.ps1',
              '    source_package = [ordered]@{\n        path = $archive\n',
              '    source_package = [ordered]@{\n        path = $archive\n        origin = $packageOrigin\n',
          )

          replace_once(
              'scripts/ci/l4_installed_runtime_postcheck.ps1',
              '[CmdletBinding()]\nparam()\n',
              '[CmdletBinding()]\nparam(\n    [ValidatePattern("^[A-Za-z0-9_-]+$")]\n    [string]$EvidenceSlot = "default"\n)\n',
          )
          replace_once(
              'scripts/ci/l4_installed_runtime_postcheck.ps1',
              '$EvidenceRoot = Join-Path $RepoRoot "artifacts\\l4-installed-runtime"\n',
              '$EvidenceRoot = Join-Path $RepoRoot ("artifacts\\l4-installed-runtime-" + $EvidenceSlot)\n',
          )

          compare_tool = r'''from __future__ import annotations

import argparse
import hashlib
import json
from pathlib import Path
from typing import Any


def _load(path: Path) -> dict[str, Any]:
    value = json.loads(path.read_text(encoding="utf-8-sig"))
    if not isinstance(value, dict):
        raise SystemExit(f"M3_JSON_OBJECT_REQUIRED:{path}")
    return value


def _sha256(path: Path) -> str:
    return hashlib.sha256(path.read_bytes()).hexdigest()


def main() -> int:
    parser = argparse.ArgumentParser()
    parser.add_argument("--slot-a", type=Path, required=True)
    parser.add_argument("--slot-b", type=Path, required=True)
    parser.add_argument("--expected-head", required=True)
    parser.add_argument("--expected-package-sha256", required=True)
    parser.add_argument("--output", type=Path, required=True)
    args = parser.parse_args()

    slots: dict[str, dict[str, Any]] = {}
    installed_hashes: list[str] = []
    for label, root in (("A", args.slot_a), ("B", args.slot_b)):
        evidence_path = root / "L4_INSTALLED_RUNTIME_EVIDENCE.json"
        postcheck_path = root / "L4_INDEPENDENT_POSTCHECK_EVIDENCE.json"
        installed_path = root / "INSTALLED_MANIFEST.json"
        evidence = _load(evidence_path)
        postcheck = _load(postcheck_path)
        installed = _load(installed_path)
        if evidence.get("status") != "L4_INSTALLED_RUNTIME_PASS":
            raise SystemExit(f"M3_L4_STATUS:{label}")
        if postcheck.get("status") != "L4_INDEPENDENT_POSTCHECK_PASS":
            raise SystemExit(f"M3_POSTCHECK_STATUS:{label}")
        if evidence.get("exact_head") != args.expected_head:
            raise SystemExit(f"M3_HEAD_MISMATCH:{label}")
        if evidence.get("validation_slot") != label:
            raise SystemExit(f"M3_SLOT_MISMATCH:{label}")
        source = evidence.get("source_package") or {}
        if source.get("origin") != "PREBUILT_SAME_ARTIFACT":
            raise SystemExit(f"M3_NOT_PREBUILT:{label}")
        if source.get("sha256") != args.expected_package_sha256:
            raise SystemExit(f"M3_PACKAGE_HASH:{label}")
        if evidence.get("marketplace_write_enabled") is not False:
            raise SystemExit(f"M3_WRITES_ENABLED:{label}")
        if evidence.get("physical_user_path_verified") is not False:
            raise SystemExit(f"M3_FALSE_L5:{label}")
        if installed.get("exact_head") != args.expected_head:
            raise SystemExit(f"M3_INSTALLED_HEAD:{label}")
        if installed.get("source_package_sha256") != args.expected_package_sha256:
            raise SystemExit(f"M3_INSTALLED_PACKAGE_HASH:{label}")
        if installed.get("marketplace_write_enabled") is not False:
            raise SystemExit(f"M3_INSTALLED_WRITES:{label}")
        installed_sha = _sha256(installed_path)
        installed_hashes.append(installed_sha)
        slots[label] = {
            "evidence_sha256": _sha256(evidence_path),
            "postcheck_sha256": _sha256(postcheck_path),
            "installed_manifest_sha256": installed_sha,
            "managed_file_count": len(installed.get("managed_files") or []),
        }

    if installed_hashes[0] != installed_hashes[1]:
        raise SystemExit("M3_AB_INSTALLED_MANIFEST_MISMATCH")

    result = {
        "milestone": "M3_CI_CONSOLIDATION",
        "status": "PASS",
        "exact_head": args.expected_head,
        "build_count": 1,
        "validator_count": 2,
        "same_artifact_sha256": args.expected_package_sha256,
        "installed_manifest_identical": True,
        "slots": slots,
        "marketplace_write_enabled": False,
        "release_scope": "WB_ONLY",
        "release_state": "RELEASE_BLOCKED",
        "physical_user_path_verified": False,
    }
    args.output.parent.mkdir(parents=True, exist_ok=True)
    args.output.write_text(json.dumps(result, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
    print("M3_SAME_ARTIFACT_COMPARE=PASS")
    return 0


if __name__ == "__main__":
    raise SystemExit(main())
'''
          (root / 'tools/m3_same_artifact_compare.py').write_text(compare_tool, encoding='utf-8', newline='\n')

          test_text = r'''from __future__ import annotations

from pathlib import Path
import unittest


ROOT = Path(__file__).resolve().parents[1]
WORKFLOW = ROOT / ".github/workflows/m3-consolidated-ci.yml"


class M3CiConsolidationTests(unittest.TestCase):
    def test_order_is_source_then_one_build_then_same_artifact(self) -> None:
        text = WORKFLOW.read_text(encoding="utf-8")
        self.assertIn("needs: [source-foundation, source-oss]", text)
        self.assertIn("needs: build-once", text)
        self.assertIn("needs: [build-once, l4-same-artifact]", text)
        self.assertEqual(text.count("build_local_production.ps1"), 1)
        self.assertEqual(text.count("M3-Build-Once-${{ env.TARGET_SHA }}"), 2)

    def test_two_validators_consume_prebuilt_archive(self) -> None:
        text = WORKFLOW.read_text(encoding="utf-8")
        self.assertIn("slot: [A, B]", text)
        self.assertIn("-PackageArchive $archive", text)
        self.assertIn("-EvidenceSlot \"${{ matrix.slot }}\"", text)
        validator = text[text.index("l4-same-artifact:"):]
        self.assertNotIn("build_two_installer_bundles.ps1", validator)

    def test_l4_supports_prebuilt_same_artifact_fail_closed(self) -> None:
        text = (ROOT / "scripts/ci/l4_installed_runtime.ps1").read_text(encoding="utf-8")
        self.assertIn('[string]$PackageArchive = ""', text)
        self.assertIn('"PREBUILT_SAME_ARTIFACT"', text)
        self.assertIn("Resolve-Path -LiteralPath $PackageArchive", text)
        self.assertIn("validation_slot = $EvidenceSlot", text)
        self.assertIn("origin = $packageOrigin", text)

    def test_comparator_requires_identical_installed_manifest(self) -> None:
        text = (ROOT / "tools/m3_same_artifact_compare.py").read_text(encoding="utf-8")
        self.assertIn("M3_AB_INSTALLED_MANIFEST_MISMATCH", text)
        self.assertIn('"build_count": 1', text)
        self.assertIn('"validator_count": 2', text)
        self.assertIn('"marketplace_write_enabled": False', text)

    def test_boundaries_are_explicit(self) -> None:
        text = WORKFLOW.read_text(encoding="utf-8")
        self.assertNotIn("gatekeeper", text.lower())
        self.assertNotIn("ozon", text.lower())
        self.assertIn('release_scope = "WB_ONLY"', text)
        self.assertIn('marketplace_write_enabled = $false', text)


if __name__ == "__main__":
    unittest.main()
'''
          (root / 'tests/test_m3_ci_consolidation.py').write_text(test_text, encoding='utf-8', newline='\n')

          rtm = {
