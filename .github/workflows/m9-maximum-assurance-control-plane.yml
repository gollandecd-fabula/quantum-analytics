name: M9 Maximum Assurance Protocol v3.1 Control Plane

on:
  workflow_dispatch:
  push:
    branches:
      - work/m1-existing-m9-migration
      - tmp/m1-runtime-candidate
    paths:
      - ".github/workflows/m9-maximum-assurance-control-plane.yml"
      - "tools/m9_maximum_assurance_control_plane.py"
      - "tests/test_m9_maximum_assurance_control_plane.py"
      - "tests/test_m9_literal_rtm_control_plane.py"
      - "tests/integration_manifest_support_m8.py"
      - "tests/test_wbr2_m5_closure.py"
      - "tests/test_wbr2_m5_closure_corrective_r2.py"
      - "docs/evidence/ARTIFACT_MANIFEST_OVERLAY_AGENT_V3_1_M1.json"
      - "docs/evidence/agent_v3_1/**"
  pull_request:
    paths:
      - ".github/workflows/m9-maximum-assurance-control-plane.yml"
      - "tools/m9_maximum_assurance_control_plane.py"
      - "tests/test_m9_maximum_assurance_control_plane.py"
      - "tests/test_m9_literal_rtm_control_plane.py"
      - "tests/integration_manifest_support_m8.py"
      - "tests/test_wbr2_m5_closure.py"
      - "tests/test_wbr2_m5_closure_corrective_r2.py"
      - "docs/evidence/ARTIFACT_MANIFEST_OVERLAY_AGENT_V3_1_M1.json"
      - "docs/evidence/agent_v3_1/**"

permissions:
  contents: read

concurrency:
  group: m9-protocol-v3-1-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  M1_GOVERNANCE_BASE_SHA: a3fef689cf75fc69effc0fad387e89cbd6c3e76d
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONNOUSERSITE: "1"

jobs:
  linux-source-runtime:
    name: Linux L2 literal RTM, scheduler, adversarial and Gate M1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TARGET_SHA }}
          clean: true
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Verify exact head and signed M1 scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git cat-file -e "$M1_GOVERNANCE_BASE_SHA^{commit}"
          git diff --name-only "$M1_GOVERNANCE_BASE_SHA" "$TARGET_SHA" | LC_ALL=C sort > "$RUNNER_TEMP/m1-changed-paths.txt"
          if grep -E '^(src/|scripts/windows/|requirements/|installer/)' "$RUNNER_TEMP/m1-changed-paths.txt"; then
            echo M1_PRODUCT_SCOPE_VIOLATION >&2
            exit 1
          fi

      - name: Run targeted positive, negative, mutation and independent controls
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/m1-linux-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$evidence"
          python -m unittest -v \
            tests.test_m9_maximum_assurance_control_plane \
            tests.test_m9_literal_rtm_control_plane \
            2>&1 | tee "$evidence/targeted-tests.log"
          python tools/m9_maximum_assurance_control_plane.py m1-run \
            --repo-root "$GITHUB_WORKSPACE" \
            --output-dir "$evidence/runtime" \
            --exact-head "$TARGET_SHA" \
            --changed-paths-file "$RUNNER_TEMP/m1-changed-paths.txt" \
            2>&1 | tee "$evidence/m1-run.log"
          python - "$evidence/runtime" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          implementation = json.loads((root / "M1_IMPLEMENTATION_REPORT.json").read_text(encoding="utf-8"))
          ingestion = json.loads((root / "M1_LITERAL_RTM_INGESTION_REPORT.json").read_text(encoding="utf-8"))
          negative = json.loads((root / "M1_NEGATIVE_CONTROL_REPORT.json").read_text(encoding="utf-8"))
          work_order = json.loads((root / "M1_SIGNED_WORK_ORDER.json").read_text(encoding="utf-8"))
          assert implementation["status"] == "PASS"
          assert implementation["gate"] == "GATE-M1"
          assert implementation["literal_rtm_coverage"] == 1.0
          assert implementation["product_code_unchanged"] is True
          assert implementation["release_authorized"] is False
          assert ingestion["requirement_count"] == 712
          assert ingestion["shards_validated"] == 12
          assert negative["controls_passed"] == negative["controls_total"] == 10
          assert work_order["requirement_id"] == "REQ-MP2-0142"
          assert work_order["release_authorized"] is False
          PY

      - name: Run complete source regression
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/m1-linux-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python -m quantum.scripts.ci 2>&1 | tee "$evidence/full-source-ci.log"

      - name: Upload Linux Gate M1 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: M1-Linux-Gate-${{ env.TARGET_SHA }}
          path: |
            ${{ runner.temp }}/m1-changed-paths.txt
            ${{ runner.temp }}/m1-linux-${{ github.run_id }}-${{ github.run_attempt }}/**
          if-no-files-found: error
          retention-days: 30

  windows-source-runtime:
    name: Windows L2 literal RTM, scheduler, adversarial and Gate M1
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Disable Git CRLF conversion
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Checkout exact head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TARGET_SHA }}
          clean: true
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Run exact-head Windows Gate M1
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}\src
        run: |
          $actual = (& git rev-parse HEAD).Trim()
          if ($actual -ne $env:TARGET_SHA) { throw "Exact-head mismatch: $actual" }
          & git cat-file -e "$env:M1_GOVERNANCE_BASE_SHA`^{commit}"
          if ($LASTEXITCODE -ne 0) { throw "M1 governance base missing." }
          $evidence = Join-Path $env:RUNNER_TEMP "m1-windows-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          $changed = Join-Path $evidence "m1-changed-paths.txt"
          (& git diff --name-only $env:M1_GOVERNANCE_BASE_SHA $env:TARGET_SHA | Sort-Object) | Set-Content $changed -Encoding UTF8
          $forbidden = Get-Content $changed | Where-Object { $_ -match '^(src/|scripts/windows/|requirements/|installer/)' }
          if ($forbidden) { throw "M1 product scope violation: $forbidden" }
          python -m unittest -v tests.test_m9_maximum_assurance_control_plane tests.test_m9_literal_rtm_control_plane 2>&1 |
            Tee-Object (Join-Path $evidence "targeted-tests.log")
          if ($LASTEXITCODE -ne 0) { throw "Targeted M1 tests failed." }
          python tools/m9_maximum_assurance_control_plane.py m1-run `
            --repo-root $env:GITHUB_WORKSPACE `
            --output-dir (Join-Path $evidence "runtime") `
            --exact-head $env:TARGET_SHA `
            --changed-paths-file $changed 2>&1 |
            Tee-Object (Join-Path $evidence "m1-run.log")
          if ($LASTEXITCODE -ne 0) { throw "Gate M1 runtime failed." }
          $implementation = Get-Content (Join-Path $evidence "runtime\M1_IMPLEMENTATION_REPORT.json") -Raw -Encoding UTF8 | ConvertFrom-Json
          $ingestion = Get-Content (Join-Path $evidence "runtime\M1_LITERAL_RTM_INGESTION_REPORT.json") -Raw -Encoding UTF8 | ConvertFrom-Json
          $negative = Get-Content (Join-Path $evidence "runtime\M1_NEGATIVE_CONTROL_REPORT.json") -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($implementation.status -ne "PASS" -or $implementation.release_authorized -ne $false) { throw "Gate M1 report invalid." }
          if ($ingestion.requirement_count -ne 712 -or $ingestion.shards_validated -ne 12) { throw "Literal RTM ingestion invalid." }
          if ($negative.controls_passed -ne 10 -or $negative.controls_total -ne 10) { throw "Negative controls invalid." }
          python -m quantum.scripts.ci 2>&1 | Tee-Object (Join-Path $evidence "full-source-ci.log")
          if ($LASTEXITCODE -ne 0) { throw "Full source CI failed." }

      - name: Upload Windows Gate M1 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: M1-Windows-Gate-${{ env.TARGET_SHA }}
          path: ${{ runner.temp }}/m1-windows-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
