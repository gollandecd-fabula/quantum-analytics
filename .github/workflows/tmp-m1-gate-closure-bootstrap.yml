name: Temporary M1 Gate Closure Materializer
on:
  pull_request:
    paths:
      - .github/workflows/tmp-m1-gate-closure-bootstrap.yml
      - .m1-closure-payload/**
      - .m1-closure-driver.sh
permissions:
  contents: write
concurrency:
  group: m1-gate-closure-materializer
  cancel-in-progress: false
jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Run exact M1 closure materializer
        shell: bash
        run: |
          set -euo pipefail
          cp .m1-closure-driver.sh "$RUNNER_TEMP/materialize.sh"
          echo "0740abd55a019fdfd33f1be19307be8bdc2e9b861b329452a28da01ae57f9112  $RUNNER_TEMP/materialize.sh" | sha256sum --check
          bash "$RUNNER_TEMP/materialize.sh"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: M1-Gate-Closure-Evidence
          path: ${{ runner.temp }}/m1-gate-closure
          if-no-files-found: warn
          retention-days: 30
