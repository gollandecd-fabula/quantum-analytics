name: Pilot P1 Atomic M1 Failing Regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tests/test_pilot_m1_atomic_work_order_chain.py"
      - "tools/m9_work_order_chain.py"
      - ".github/workflows/pilot-p1-atomic-m1-regression.yml"
      - "docs/evidence/pilot_v3_0/**"
      - "docs/evidence/ARTIFACT_MANIFEST_OVERLAY_PILOT_V3_0_P1_REGRESSION.json"

permissions:
  contents: read

concurrency:
  group: pilot-p1-atomic-m1-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  failing-regression:
    name: P1 ordered work-order chain regression
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          clean: true
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Run P1 failing regression
        shell: bash
        run: |
          set -o pipefail
          python -m unittest -v tests.test_pilot_m1_atomic_work_order_chain 2>&1 | tee "$RUNNER_TEMP/p1-regression.log"

      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Pilot-P1-Failing-Regression-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/p1-regression.log
          if-no-files-found: error
          retention-days: 30
