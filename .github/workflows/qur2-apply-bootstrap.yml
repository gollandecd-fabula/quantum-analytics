name: QUR2 Apply Verified Implementation

on:
  push:
    branches:
      - fix/quantum-universal-relaunch-r2
    paths:
      - .qur2-bootstrap/APPLY
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - fix/quantum-shortcut-launch-repair-r1
    paths:
      - .qur2-bootstrap/**
      - .github/workflows/qur2-apply-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: qur2-bootstrap-apply
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: fix/quantum-universal-relaunch-r2
          fetch-depth: 1

      - name: Verify transport payload and apply atomically
        shell: bash
        env:
          EXPECTED_SHA256: 4b629eede663f1d57520e07125fbc55b1bd8ce5f0c052677e94109b4f44bed6b
          EXPECTED_PART04_SHA256: 96b0c255016b2362e64dcd159de539c74a10cc6ea9c1ccc77f648333490471ee
        run: |
          set -euo pipefail
          diagnostics="$RUNNER_TEMP/qur2-transport-diagnostics.txt"
          python - <<'PY' | tee "$diagnostics"
          from hashlib import sha256
          from pathlib import Path
          import os

          path = Path('.qur2-bootstrap/payload.04')
          target = os.environ['EXPECTED_PART04_SHA256']
          data = path.read_bytes()
          current = sha256(data).hexdigest()
          print(f'PART04_BEFORE_BYTES={len(data)}')
          print(f'PART04_BEFORE_SHA256={current}')
          if current != target:
              matches = []
              for index in range(len(data)):
                  candidate = data[:index] + data[index + 1:]
                  if sha256(candidate).hexdigest() == target:
                      matches.append((index, data[index], candidate))
              if len(matches) != 1:
                  raise SystemExit(f'PART04_REPAIR_AMBIGUOUS matches={len(matches)}')
              index, removed, candidate = matches[0]
              path.write_bytes(candidate)
              print(f'PART04_REMOVED_INDEX={index}')
              print(f'PART04_REMOVED_BYTE={removed}')
          repaired = path.read_bytes()
          repaired_sha = sha256(repaired).hexdigest()
          print(f'PART04_AFTER_BYTES={len(repaired)}')
          print(f'PART04_AFTER_SHA256={repaired_sha}')
          if repaired_sha != target:
              raise SystemExit('PART04_REPAIR_FAILED')
          PY
          mapfile -t parts < <(find .qur2-bootstrap -maxdepth 1 -type f -name 'payload.[0-9][0-9]' -print | sort)
          {
            printf 'PAYLOAD_PART_COUNT=%s\n' "${#parts[@]}"
            printf '%s\n' "${parts[@]}"
            wc -c "${parts[@]}"
            sha256sum "${parts[@]}"
          } | tee -a "$diagnostics"
          test "${#parts[@]}" -eq 7
          cat "${parts[@]}" > "$RUNNER_TEMP/qur2-payload.b64"
          printf 'PAYLOAD_B64_BYTES=%s\n' "$(wc -c < "$RUNNER_TEMP/qur2-payload.b64")" | tee -a "$diagnostics"
          base64 --decode "$RUNNER_TEMP/qur2-payload.b64" > "$RUNNER_TEMP/qur2-implementation.tar.gz"
          actual_sha="$(sha256sum "$RUNNER_TEMP/qur2-implementation.tar.gz" | awk '{print $1}')"
          printf 'ACTUAL_SHA256=%s\nEXPECTED_SHA256=%s\n' "$actual_sha" "$EXPECTED_SHA256" | tee -a "$diagnostics"
          test "$actual_sha" = "$EXPECTED_SHA256"
          tar -tzf "$RUNNER_TEMP/qur2-implementation.tar.gz" > "$RUNNER_TEMP/qur2-members.txt"
          printf '%s\n' 'ARCHIVE_MEMBERS_BEGIN' | tee -a "$diagnostics"
          cat "$RUNNER_TEMP/qur2-members.txt" | tee -a "$diagnostics"
          printf '%s\n' 'ARCHIVE_MEMBERS_END' | tee -a "$diagnostics"
          if grep -Eq '(^|/)\.\.?(/|$)' "$RUNNER_TEMP/qur2-members.txt"; then
            echo 'Unsafe archive member path' | tee -a "$diagnostics" >&2
            exit 1
          fi
          echo 'ARCHIVE_PATH_CHECK=PASS' | tee -a "$diagnostics"
          tar -xzf "$RUNNER_TEMP/qur2-implementation.tar.gz" -C .
          echo 'ARCHIVE_EXTRACTION=PASS' | tee -a "$diagnostics"
          rm -rf .qur2-bootstrap
          echo 'BOOTSTRAP_REMOVAL=PASS' | tee -a "$diagnostics"
          git diff --check 2>&1 | tee -a "$diagnostics"
          echo 'GIT_DIFF_CHECK=PASS' | tee -a "$diagnostics"
          git status --short | tee -a "$diagnostics"
          git config user.name quantum-ci
          git config user.email quantum-ci@users.noreply.github.com
          git add -A
          git diff --cached --quiet && { echo 'No implementation changes staged' | tee -a "$diagnostics" >&2; exit 1; }
          git commit -m 'Implement universal XLS intake and repeatable Windows launch' 2>&1 | tee -a "$diagnostics"
          echo 'GIT_COMMIT=PASS' | tee -a "$diagnostics"
          git push origin HEAD:fix/quantum-universal-relaunch-r2 2>&1 | tee -a "$diagnostics"
          echo 'GIT_PUSH=PASS' | tee -a "$diagnostics"

      - name: Upload transport diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: QUR2-Transport-Diagnostics
          path: ${{ runner.temp }}/qur2-transport-diagnostics.txt
          if-no-files-found: error
          retention-days: 3
