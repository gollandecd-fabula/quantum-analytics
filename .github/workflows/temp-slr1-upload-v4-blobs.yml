name: Temporary SLR1 Upload V4 Blobs

on:
  pull_request:
    paths:
      - ".github/workflows/temp-slr1-upload-v4-blobs.yml"

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXACT_SHA: 4928b7a8c25eeffd2cafe9814878d1ea57f7e515
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.EXACT_SHA }}
          fetch-depth: 1
      - name: Add pinned build backend and recalculate overlay
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          workflow = Path('.github/workflows/shortcut-launch-repair-r1.yml')
          text = workflow.read_text(encoding='utf-8')
          needle = '''      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065\n        with:\n          python-version: "3.13.14"\n      - name: Parse PowerShell and run static contracts\n'''
          replacement = '''      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065\n        with:\n          python-version: "3.13.14"\n      - name: Install pinned build backend\n        shell: pwsh\n        run: >-\n          python -m pip install --disable-pip-version-check --no-input\n          --no-deps --only-binary=:all: setuptools==80.9.0\n      - name: Parse PowerShell and run static contracts\n'''
          if text.count(needle) != 1:
              raise SystemExit(f'PIN_INSERTION_COUNT:{text.count(needle)}')
          workflow.write_text(text.replace(needle, replacement), encoding='utf-8')

          overlay_path = Path('docs/evidence/ARTIFACT_MANIFEST_OVERLAY_SHORTCUT_LAUNCH_REPAIR_R1.json')
          overlay = json.loads(overlay_path.read_text(encoding='utf-8'))
          for entry in overlay['entries']:
              payload = Path(entry[0]).read_bytes()
              entry[1] = hashlib.sha256(payload).hexdigest()
              entry[2] = len(payload)
          overlay_path.write_text(
              json.dumps(overlay, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
          test "$(sha256sum .github/workflows/shortcut-launch-repair-r1.yml | cut -d' ' -f1)" = "1312024939b09ec2f5aef28b29296de98879809a95b74ce6b15fb851092301c9"
          test "$(sha256sum docs/evidence/ARTIFACT_MANIFEST_OVERLAY_SHORTCUT_LAUNCH_REPAIR_R1.json | cut -d' ' -f1)" = "df7a5eeaa8e4b9682ababfd1d33e95bf85cf1e1f364e930f0aa016b369c16b4a"
      - name: Upload raw Git blobs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          for spec in \
            "workflow:.github/workflows/shortcut-launch-repair-r1.yml" \
            "overlay:docs/evidence/ARTIFACT_MANIFEST_OVERLAY_SHORTCUT_LAUNCH_REPAIR_R1.json"
          do
            name="${spec%%:*}"
            path="${spec#*:}"
            content="$(base64 -w0 "$path")"
            sha="$(gh api --method POST \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/$GITHUB_REPOSITORY/git/blobs" \
              -f content="$content" -f encoding=base64 --jq .sha)"
            printf '%s=%s\n' "$name" "$sha" | tee -a "$RUNNER_TEMP/evidence/blob-shas.txt"
          done
          grep -q '^workflow=65757b397d0fe8d4486130dcba103395e9c7b477$' "$RUNNER_TEMP/evidence/blob-shas.txt"
          grep -q '^overlay=907ce148f6cee5ce0446c32ffbba0c2957611d32$' "$RUNNER_TEMP/evidence/blob-shas.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: SLR1-V4-Blob-SHAs
          path: ${{ runner.temp }}/evidence/blob-shas.txt
          if-no-files-found: error
          retention-days: 3
