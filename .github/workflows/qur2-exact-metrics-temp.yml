name: Temporary QUR2 Exact File Metrics

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - fix/quantum-shortcut-launch-repair-r1
    paths:
      - .github/workflows/qur2-exact-metrics-temp.yml

permissions:
  contents: read

jobs:
  metrics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: fix/quantum-universal-relaunch-r2
          fetch-depth: 1
      - name: Compute exact checked-out bytes
        shell: python
        run: |
          from hashlib import sha256
          import json
          import os
          from pathlib import Path

          paths = [
              ".github/workflows/l4-installed-runtime.yml",
              "scripts/ci/l4_installed_runtime.ps1",
              "tests/test_l4_installed_runtime_contract.py",
          ]
          result = {
              "head": os.popen("git rev-parse HEAD").read().strip(),
              "files": [],
          }
          for raw in paths:
              payload = Path(raw).read_bytes()
              result["files"].append(
                  {
                      "path": raw,
                      "sha256": sha256(payload).hexdigest(),
                      "size": len(payload),
                  }
              )
          output = Path(os.environ["RUNNER_TEMP"]) / "qur2-exact-metrics.json"
          output.write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: QUR2-Exact-L4-Metrics
          path: ${{ runner.temp }}/qur2-exact-metrics.json
          if-no-files-found: error
          retention-days: 3
