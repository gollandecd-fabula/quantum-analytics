name: Diagnose Quantum M5 Payload

on:
  pull_request:
    paths:
      - "tools/M5_PAYLOAD_PART_*.txt"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Capture exact payload identities
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/m5-diagnostic
          {
            echo 'PARTS'
            find tools -maxdepth 1 -type f -name 'M5_PAYLOAD_PART_*.txt' -printf '%f\n' | sort
            echo 'PART_HASHES'
            sha256sum tools/M5_PAYLOAD_PART_*.txt
            echo 'PART_SIZES'
            wc -c tools/M5_PAYLOAD_PART_*.txt
            echo 'DECODE'
            cat tools/M5_PAYLOAD_PART_*.txt | base64 --decode > /tmp/m5-payload.zip
            echo "decode_status=${PIPESTATUS[1]}"
            wc -c /tmp/m5-payload.zip
            sha256sum /tmp/m5-payload.zip
            python3 - <<'PY'
          import zipfile
          try:
              archive = zipfile.ZipFile('/tmp/m5-payload.zip')
              print('ZIP_TEST=', archive.testzip())
              print('ZIP_MEMBERS=', len(archive.namelist()))
              for name in archive.namelist():
                  print(name)
          except Exception as exc:
              print('ZIP_ERROR=', type(exc).__name__, str(exc))
          PY
          } 2>&1 | tee /tmp/m5-diagnostic/diagnostic.txt
          exit 0
      - name: Upload diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: M5-Payload-Diagnostic
          path: /tmp/m5-diagnostic/diagnostic.txt
          if-no-files-found: error
          retention-days: 3
