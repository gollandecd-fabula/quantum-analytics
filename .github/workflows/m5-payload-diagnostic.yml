name: Diagnose Quantum M5 Payload

on:
  pull_request:
    paths:
      - "tools/M5_PAYLOAD_PART_*.txt"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Print exact payload identities
        shell: bash
        run: |
          set -u
          find tools -maxdepth 1 -type f -name 'M5_PAYLOAD_PART_*.txt' -printf '%f\n' | sort
          sha256sum tools/M5_PAYLOAD_PART_*.txt
          cat tools/M5_PAYLOAD_PART_*.txt | base64 --decode > /tmp/m5-payload.zip
          wc -c /tmp/m5-payload.zip
          sha256sum /tmp/m5-payload.zip
          python3 - <<'PY'
          import zipfile
          archive = zipfile.ZipFile('/tmp/m5-payload.zip')
          print('ZIP_TEST=', archive.testzip())
          print('ZIP_MEMBERS=', len(archive.namelist()))
          for name in archive.namelist():
              print(name)
          PY
