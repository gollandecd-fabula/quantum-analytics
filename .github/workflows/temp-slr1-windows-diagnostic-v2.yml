name: Temporary SLR1 Windows Diagnostic V2

on:
  pull_request:
    paths:
      - ".github/workflows/temp-slr1-windows-diagnostic-v2.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      EXACT_SHA: 09884d7e2176c100bfd5a101e3865b294d479ce6
    steps:
      - shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.EXACT_SHA }}
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.14"
      - name: Run exact postchecks
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $log = Join-Path $env:RUNNER_TEMP "slr1-windows-diagnostic-v2.txt"
          Start-Transcript -Path $log -Force
          try {
            $dist = Join-Path $env:RUNNER_TEMP "SLR1 v2 build"
            $packageRoot = Join-Path $env:RUNNER_TEMP "SLR1 v2 package"
            $target = Join-Path $env:RUNNER_TEMP "Quantum тест v2"
            $partial = Join-Path $env:RUNNER_TEMP "Quantum incomplete v2"
            Remove-Item $dist,$packageRoot,$target,$partial -Recurse -Force -ErrorAction SilentlyContinue
            & .\scripts\windows\build_local_production.ps1 -OutputDirectory $dist
            Expand-Archive -LiteralPath (Join-Path $dist "QuantumLocalProduction_HOME_LOCAL.zip") -DestinationPath $packageRoot -Force
            $desktop = [Environment]::GetFolderPath([Environment+SpecialFolder]::DesktopDirectory)
            $shortcutPath = Join-Path $desktop "Центр решений Quantum.lnk"
            $shell = New-Object -ComObject WScript.Shell
            & (Join-Path $packageRoot "scripts\install_home_local.ps1") -SourceRoot $packageRoot -TargetRoot $target
            $expectedTarget = [IO.Path]::GetFullPath((Join-Path $target "START_QUANTUM.cmd"))

            Write-Host "POSTCHECK:SENTINEL_CREATE"
            $before = @{}
            foreach ($folder in @("config", "data", "output")) {
              $path = Join-Path $target "$folder\slr1-sentinel.txt"
              [IO.File]::WriteAllText($path, "preserve-$folder", [Text.Encoding]::UTF8)
              $before[$folder] = (Get-FileHash $path -Algorithm SHA256).Hash
              Write-Host "BEFORE:$folder=$($before[$folder])"
            }

            Write-Host "POSTCHECK:STALE_AND_REPAIR"
            $stale = $shell.CreateShortcut($shortcutPath)
            $stale.TargetPath = Join-Path $target "scripts\one_click_home_local.ps1"
            $stale.WorkingDirectory = $target
            $stale.Save()
            & (Join-Path $packageRoot "scripts\install_home_local.ps1") -SourceRoot $packageRoot -TargetRoot $target
            foreach ($folder in @("config", "data", "output")) {
              $path = Join-Path $target "$folder\slr1-sentinel.txt"
              $exists = Test-Path $path -PathType Leaf
              $after = if ($exists) { (Get-FileHash $path -Algorithm SHA256).Hash } else { "MISSING" }
              Write-Host "AFTER:$folder=$after EXISTS=$exists"
              if ($after -ne $before[$folder]) { throw "USER_DATA_CHANGED:$folder" }
            }
            $verified = $shell.CreateShortcut($shortcutPath)
            Write-Host "SHORTCUT_TARGET=$($verified.TargetPath)"
            Write-Host "EXPECTED_TARGET=$expectedTarget"
            if (-not ([IO.Path]::GetFullPath([string]$verified.TargetPath)).Equals($expectedTarget,[StringComparison]::OrdinalIgnoreCase)) { throw "STALE_SHORTCUT_SURVIVED" }

            Write-Host "POSTCHECK:PARTIAL"
            New-Item (Join-Path $partial "scripts") -ItemType Directory -Force | Out-Null
            Copy-Item (Join-Path $target "scripts\one_click_home_local.ps1") (Join-Path $partial "scripts\one_click_home_local.ps1") -Force
            $partialLog = Join-Path $env:RUNNER_TEMP "slr1-partial-v2.log"
            $oldPreference = $ErrorActionPreference
            $ErrorActionPreference = "Continue"
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $partial "scripts\one_click_home_local.ps1") -InstallOnly -NoOpenResult *> $partialLog
            $partialExit = $LASTEXITCODE
            $ErrorActionPreference = $oldPreference
            $partialText = Get-Content $partialLog -Raw
            Write-Host "PARTIAL_EXIT=$partialExit"
            Write-Host "PARTIAL_TEXT_BEGIN"
            Write-Host $partialText
            Write-Host "PARTIAL_TEXT_END"
            if ($partialExit -eq 0) { throw "PARTIAL_ACCEPTED" }
            if ($partialText -notmatch "HOME_LOCAL_INSTALLATION_INCOMPLETE") { throw "PARTIAL_CODE_MISSING" }
            Write-Host "DIAGNOSTIC_V2_PASS"
          }
          catch {
            Write-Host "V2_EXCEPTION=$($_.Exception.Message)"
            Write-Host "V2_STACK=$($_.ScriptStackTrace)"
            Write-Host ($_ | Format-List * -Force | Out-String)
            $global:failed = $true
          }
          finally { Stop-Transcript }
          if ($global:failed) { exit 1 }
      - name: Upload V2 transcript
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: SLR1-Windows-Diagnostic-V2
          path: |
            ${{ runner.temp }}/slr1-windows-diagnostic-v2.txt
            ${{ runner.temp }}/slr1-partial-v2.log
          if-no-files-found: warn
          retention-days: 3
