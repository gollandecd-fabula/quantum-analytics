name: SINDEL CP034 deps supplement
on:
  push:
    branches: [sindel-cp034-buildfactory]
    paths: ['.github/workflows/sindel-cp034-deps-supplement.yml']
permissions:
  contents: read
jobs:
  supplement:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build exact supplement
        shell: bash
        run: |
          set -euo pipefail
          mkdir cp034_supplement
          python -m pip install --upgrade pip
          python -m pip install --target cp034_supplement onnx
          python -m pip install --target cp034_supplement --no-deps \
            'git+https://github.com/resemble-ai/chatterbox.git@5de7a54aa4e5e2baadb0182dde554908b48b85c2'
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('cp034_supplement')
          rows=[]
          for p in sorted(root.rglob('*')):
            if p.is_file():
              h=hashlib.sha256()
              with p.open('rb') as f:
                for b in iter(lambda:f.read(1024*1024),b''): h.update(b)
              rows.append({'path':p.as_posix(),'size':p.stat().st_size,'sha256':h.hexdigest()})
          Path('CP034_SUPPLEMENT_MANIFEST.json').write_text(json.dumps({'files':rows},indent=2))
          print('SUPPLEMENT_FILES',len(rows))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sindel-cp034-deps-supplement
          path: |
            cp034_supplement
            CP034_SUPPLEMENT_MANIFEST.json
          compression-level: 6
          retention-days: 2
