name: Temporary QUR2 Launch Quoting Materializer

on:
  pull_request:
    paths:
      - .github/workflows/tmp-qur2-verifier-r2-materialize.yml
      - .qur2-shellapp-materializer/apply.py

permissions:
  contents: write

concurrency:
  group: qur2-launchquote-materialize
  cancel-in-progress: false

env:
  BASE_SHA: 0785371a4555809aa9898ab44e756831d2db2a5c
  EXPECTED_TREE_SHA: 7c7ab03f3f40018d79442ffaaf63048be2ea29be
  EXPECTED_WORKFLOW_SHA256: bc912355590ec613803d1d5ec53093b2535d5579e16177f0a52a39d76102f407
  EXPECTED_OVERLAY_SHA256: 8bbaa9275769862dfab5fe87b0bcc5beab3477fff2fd376a078f5adaf07632f6
  CANDIDATE_BRANCH: tmp/qur2-launchquote-tested-candidate

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Preserve exact patch script
        shell: bash
        run: cp .qur2-shellapp-materializer/apply.py "$RUNNER_TEMP/qur2-launchquote-apply.py"

      - name: Apply marker patch to immutable base
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$BASE_SHA"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          python3 "$RUNNER_TEMP/qur2-launchquote-apply.py"
          test "$(sha256sum .github/workflows/quantum-universal-relaunch-r2.yml | awk '{print $1}')" = "$EXPECTED_WORKFLOW_SHA256"
          test "$(sha256sum docs/evidence/ARTIFACT_MANIFEST_OVERLAY_QUANTUM_UNIVERSAL_RELAUNCH_R2.json | awk '{print $1}')" = "$EXPECTED_OVERLAY_SHA256"
          git diff --check
          test "$(git diff --name-only | sort | paste -sd, -)" = ".github/workflows/quantum-universal-relaunch-r2.yml,docs/evidence/ARTIFACT_MANIFEST_OVERLAY_QUANTUM_UNIVERSAL_RELAUNCH_R2.json"
          git add -A

      - name: Run complete source CI
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/src"
          python3 -m quantum.scripts.ci

      - name: Commit tested tree and publish candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name quantum-ci
          git config user.email quantum-ci@users.noreply.github.com
          git commit -m 'Fix cmd quoting in QUR2 repeat-launch verification'
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE_SHA"
          git rev-parse HEAD | tee "$RUNNER_TEMP/qur2-launchquote-candidate-commit.txt"
          git rev-parse 'HEAD^{tree}' | tee "$RUNNER_TEMP/qur2-launchquote-candidate-tree.txt"
          git push origin "HEAD:refs/heads/$CANDIDATE_BRANCH"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: QUR2-LaunchQuote-Materialization
          path: |
            ${{ runner.temp }}/qur2-launchquote-candidate-commit.txt
            ${{ runner.temp }}/qur2-launchquote-candidate-tree.txt
          if-no-files-found: warn
          retention-days: 3
