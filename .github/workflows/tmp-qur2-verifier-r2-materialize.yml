name: Temporary QUR2 Rapid Output Evidence Materializer

on:
  pull_request:
    paths:
      - .github/workflows/tmp-qur2-verifier-r2-materialize.yml
      - .qur2-shellapp-materializer/apply.py

permissions:
  contents: write

concurrency:
  group: qur2-rapidoutput-materialize
  cancel-in-progress: false

env:
  BASE_SHA: 8e626519e6a2145d723283c586be0f86e372436b
  EXPECTED_TREE_SHA: 908ba8beeca14eabf828b91a3eb3c64e0cd226a2
  EXPECTED_WORKFLOW_SHA256: a6be6f5f66ee973365c30e2248783a478395e3a1e7a94663571f655a1f043d04
  EXPECTED_OVERLAY_SHA256: b0ade3d7ad8945f395e268d243dc49b0101f9b2d49fd3c01ddb9691c552ffff4
  CANDIDATE_BRANCH: tmp/qur2-rapidoutput-tested-candidate

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Preserve exact patch script
        shell: bash
        run: cp .qur2-shellapp-materializer/apply.py "$RUNNER_TEMP/qur2-rapidoutput-apply.py"

      - name: Apply marker patch to immutable base
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$BASE_SHA"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          python3 "$RUNNER_TEMP/qur2-rapidoutput-apply.py"
          test "$(sha256sum .github/workflows/quantum-universal-relaunch-r2.yml | awk '{print $1}')" = "$EXPECTED_WORKFLOW_SHA256"
          test "$(sha256sum docs/evidence/ARTIFACT_MANIFEST_OVERLAY_QUANTUM_UNIVERSAL_RELAUNCH_R2.json | awk '{print $1}')" = "$EXPECTED_OVERLAY_SHA256"
          git diff --check
          test "$(git diff --name-only | sort | paste -sd, -)" = ".github/workflows/quantum-universal-relaunch-r2.yml,docs/evidence/ARTIFACT_MANIFEST_OVERLAY_QUANTUM_UNIVERSAL_RELAUNCH_R2.json"
          git add -A

      - name: Run complete source CI
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/src"
          python3 -m quantum.scripts.ci

      - name: Commit tested tree and publish candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name quantum-ci
          git config user.email quantum-ci@users.noreply.github.com
          git commit -m 'Verify rapid-import report paths in QUR2 Windows gate'
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE_SHA"
          git rev-parse HEAD | tee "$RUNNER_TEMP/qur2-rapidoutput-candidate-commit.txt"
          git rev-parse 'HEAD^{tree}' | tee "$RUNNER_TEMP/qur2-rapidoutput-candidate-tree.txt"
          git push origin "HEAD:refs/heads/$CANDIDATE_BRANCH"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: QUR2-RapidOutput-Materialization
          path: |
            ${{ runner.temp }}/qur2-rapidoutput-candidate-commit.txt
            ${{ runner.temp }}/qur2-rapidoutput-candidate-tree.txt
          if-no-files-found: warn
          retention-days: 3
