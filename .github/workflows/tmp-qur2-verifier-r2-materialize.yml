name: Temporary QUR2 Rapid Import Materializer

on:
  pull_request:
    paths:
      - .github/workflows/tmp-qur2-verifier-r2-materialize.yml
      - .qur2-shellapp-materializer/apply.py

permissions:
  contents: write

concurrency:
  group: qur2-rapidimport-materialize
  cancel-in-progress: false

env:
  BASE_SHA: 96e0914d01db16d5b398f16144925171f760956d
  EXPECTED_TREE_SHA: a5c2be53157b4b1400f84fbf9a06b1b521ba4142
  EXPECTED_WORKFLOW_SHA256: 527b363b3293c1e0224649332f7fb7529ec868ada0b84bf0a748dca8d42000b7
  EXPECTED_OVERLAY_SHA256: 6c097b32de6564b67d1d5d0e5eef32f740b921c3ee88b08ce376207a74e6aa1e
  CANDIDATE_BRANCH: tmp/qur2-rapidimport-tested-candidate

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Preserve exact patch script
        shell: bash
        run: cp .qur2-shellapp-materializer/apply.py "$RUNNER_TEMP/qur2-rapidimport-apply.py"

      - name: Apply marker patch to immutable base
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$BASE_SHA"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          python3 "$RUNNER_TEMP/qur2-rapidimport-apply.py"
          test "$(sha256sum .github/workflows/quantum-universal-relaunch-r2.yml | awk '{print $1}')" = "$EXPECTED_WORKFLOW_SHA256"
          test "$(sha256sum docs/evidence/ARTIFACT_MANIFEST_OVERLAY_QUANTUM_UNIVERSAL_RELAUNCH_R2.json | awk '{print $1}')" = "$EXPECTED_OVERLAY_SHA256"
          git diff --check
          test "$(git diff --name-only | sort | paste -sd, -)" = ".github/workflows/quantum-universal-relaunch-r2.yml,docs/evidence/ARTIFACT_MANIFEST_OVERLAY_QUANTUM_UNIVERSAL_RELAUNCH_R2.json"
          git add -A

      - name: Run complete source CI
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/src"
          python3 -m quantum.scripts.ci

      - name: Commit tested tree and publish candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name quantum-ci
          git config user.email quantum-ci@users.noreply.github.com
          git commit -m 'Fix rapid-import invocation in QUR2 Windows gate'
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE_SHA"
          git rev-parse HEAD | tee "$RUNNER_TEMP/qur2-rapidimport-candidate-commit.txt"
          git rev-parse 'HEAD^{tree}' | tee "$RUNNER_TEMP/qur2-rapidimport-candidate-tree.txt"
          git push origin "HEAD:refs/heads/$CANDIDATE_BRANCH"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: QUR2-RapidImport-Materialization
          path: |
            ${{ runner.temp }}/qur2-rapidimport-candidate-commit.txt
            ${{ runner.temp }}/qur2-rapidimport-candidate-tree.txt
          if-no-files-found: warn
          retention-days: 3
