name: Quantum Pilot v3 Canonical Overlay Materialization Final Manifest Staging Corrective

on:
  pull_request:
    branches:
      - fix/quantum-pilot-v3-canonical-base
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/pilot-v3-canonical-recovery.yml"
      - ".pilot-v3-p0-overlay-transport/**"
      - "tools/pilot_v3_generate_overlay.py"
      - "tests/integration_manifest_support_pilot_v3.py"
      - "tests/test_pilot_v3_generate_overlay.py"
      - "tests/test_a0_manifest_diagnostic.py"
      - "tests/test_b1a_artifact_manifest.py"
      - "docs/evidence/ARTIFACT_MANIFEST_OVERLAY_PILOT_V3_0_*.json"
      - "docs/evidence/pilot_v3_0/**"

permissions:
  contents: write

concurrency:
  group: quantum-pilot-v3-canonical-overlay-pr
  cancel-in-progress: false

env:
  TARGET_SHA: ${{ github.event.pull_request.head.sha }}
  TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
  CANONICAL_BRANCH: fix/quantum-pilot-v3-canonical
  AUTHORIZATION_BASE_HEAD: 22b404e5bcacc509ca463b0c3a83e714b80b0aee
  WORK_ORDER_PATH: docs/evidence/pilot_v3_0/WORK_ORDER_P0_OVERLAY_FINAL_MANIFEST_STAGING_CORRECTIVE_011.json
  TRANSPORT_MANIFEST_PATH: docs/evidence/ARTIFACT_MANIFEST_OVERLAY_PILOT_V3_0_P0_OVERLAY_TRANSPORT.json
  BINDING_PATH: docs/evidence/pilot_v3_0/PILOT_P0_OVERLAY_TRANSPORT_BINDING.json
  COMMITTED_OVERLAY: docs/evidence/pilot_v3_0/PILOT_APPLICABILITY_OVERLAY.json
  CLOSURE_OVERLAY: docs/evidence/ARTIFACT_MANIFEST_OVERLAY_PILOT_V3_0_P0_OVERLAY_CLOSURE.json

jobs:
  p0-overlay-materialization:
    if: "${{ github.event.pull_request.head.ref == 'fix/quantum-pilot-v3-canonical' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact canonical head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.TARGET_SHA }}
          clean: true
          fetch-depth: 0
          persist-credentials: true

      - name: Verify runtime and signed final manifest staging corrective work order
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 - <<'PY'
          import sys
          if sys.version_info < (3, 12):
              raise SystemExit(f"Python 3.12+ required, got {sys.version}")
          import setuptools.build_meta  # noqa: F401
          print("SOURCE_RUNTIME_BACKEND_AVAILABLE")
          PY
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$TARGET_BRANCH" = "$CANONICAL_BRANCH"
          test "$GITHUB_EVENT_NAME" = "pull_request"
          authorization_sha="$(git rev-parse HEAD^^)"
          manifest_sha="$(git rev-parse HEAD^)"
          base_sha="$(git rev-parse HEAD^^^)"
          test "$base_sha" = "$AUTHORIZATION_BASE_HEAD"
          git diff --name-only "$base_sha" "$authorization_sha" | LC_ALL=C sort > "$RUNNER_TEMP/authorization-paths.txt"
          git diff --name-only "$authorization_sha" "$manifest_sha" | LC_ALL=C sort > "$RUNNER_TEMP/manifest-stage-paths.txt"
          git diff --name-only "$manifest_sha" HEAD | LC_ALL=C sort > "$RUNNER_TEMP/execution-stage-paths.txt"
          python3 - "$RUNNER_TEMP/authorization-paths.txt" "$RUNNER_TEMP/manifest-stage-paths.txt" "$RUNNER_TEMP/execution-stage-paths.txt" <<'PY'
          import copy, hashlib, json, pathlib, sys
          root = pathlib.Path.cwd()
          work_order_path = root / pathlib.Path("docs/evidence/pilot_v3_0/WORK_ORDER_P0_OVERLAY_FINAL_MANIFEST_STAGING_CORRECTIVE_011.json")
          work_order = json.loads(work_order_path.read_text(encoding="utf-8"))
          unsigned = copy.deepcopy(work_order)
          stored = unsigned.pop("work_order_sha256")
          canonical = json.dumps(unsigned, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode("utf-8")
          if stored != hashlib.sha256(canonical).hexdigest():
              raise SystemExit("ACTIVE_WORK_ORDER_SIGNATURE_INVALID")
          if work_order["canonical_branch"] != "fix/quantum-pilot-v3-canonical":
              raise SystemExit("ACTIVE_WORK_ORDER_BRANCH_INVALID")
          if work_order["authorization_parent_exact_head"] != "22b404e5bcacc509ca463b0c3a83e714b80b0aee":
              raise SystemExit("ACTIVE_WORK_ORDER_PARENT_INVALID")
          actual_sets = [set(pathlib.Path(arg).read_text(encoding="utf-8").splitlines()) for arg in sys.argv[1:]]
          expected_sets = [
              set(work_order["authorization_stage_files_allowed_to_change"]),
              set(work_order["manifest_stage_files_allowed_to_change"]),
              set(work_order["execution_stage_files_allowed_to_change"]),
          ]
          labels = ["AUTHORIZATION", "MANIFEST", "EXECUTION"]
          for label, actual, expected in zip(labels, actual_sets, expected_sets):
              if actual != expected:
                  raise SystemExit(label + "_STAGE_SCOPE_MISMATCH:" + json.dumps({"missing": sorted(expected-actual), "extra": sorted(actual-expected)}, sort_keys=True))
          binding_path = root / work_order["transport_binding_path"]
          binding_raw = binding_path.read_bytes()
          if hashlib.sha256(binding_raw).hexdigest() != work_order["transport_binding_sha256"]:
              raise SystemExit("TRANSPORT_BINDING_HASH_INVALID")
          workflow_raw = (root / ".github/workflows/pilot-v3-canonical-recovery.yml").read_bytes()
          if hashlib.sha256(workflow_raw).hexdigest() != work_order["corrected_workflow_sha256"]:
              raise SystemExit("CORRECTED_WORKFLOW_HASH_INVALID")
          manifest_path = root / "docs/evidence/ARTIFACT_MANIFEST_OVERLAY_PILOT_V3_0_P0_OVERLAY_TRANSPORT.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          for path_text, expected_sha, expected_size in manifest["entries"]:
              raw = (root / path_text).read_bytes()
              if len(raw) != expected_size or hashlib.sha256(raw).hexdigest() != expected_sha:
                  raise SystemExit("TRANSPORT_MANIFEST_ENTRY_MISMATCH:" + path_text)
          gate = json.loads((root / "docs/evidence/pilot_v3_0/PILOT_CAPABILITY_GATE.json").read_text(encoding="utf-8"))
          if gate["decision"] != "P0_OVERLAY_MATERIALIZATION_ALLOWED" or gate["largest_artifact_delivery_gate"]["status"] != "PASS":
              raise SystemExit("CAPABILITY_GATE_NOT_PASSED")
          print("SIGNED_FINAL_MANIFEST_STAGING_CORRECTIVE_CHAIN_VERIFIED")
          PY

      - name: Reconstruct and verify transport archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pilot-v3-p0"
          python3 - "$BINDING_PATH" "$RUNNER_TEMP/pilot-v3-p0/final-payload.tar.xz" <<'PY'
          import hashlib, json, pathlib, sys
          binding = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          output = pathlib.Path(sys.argv[2])
          with output.open("wb") as target:
              for chunk in binding["chunks"]:
                  path = pathlib.Path(chunk["path"])
                  raw = path.read_bytes()
                  if len(raw) != chunk["size_bytes"]:
                      raise SystemExit("CHUNK_SIZE_MISMATCH:" + chunk["path"])
                  if hashlib.sha256(raw).hexdigest() != chunk["sha256"]:
                      raise SystemExit("CHUNK_SHA256_MISMATCH:" + chunk["path"])
                  git_blob = hashlib.sha1(f"blob {len(raw)}\0".encode("ascii") + raw).hexdigest()
                  if git_blob != chunk["git_blob_sha"]:
                      raise SystemExit("CHUNK_GIT_BLOB_MISMATCH:" + chunk["path"])
                  target.write(raw)
          archive = output.read_bytes()
          if len(archive) != binding["archive"]["size_bytes"]:
              raise SystemExit("ARCHIVE_SIZE_MISMATCH")
          if hashlib.sha256(archive).hexdigest() != binding["archive"]["sha256"]:
              raise SystemExit("ARCHIVE_SHA256_MISMATCH")
          print("TRANSPORT_ARCHIVE_VERIFIED")
          PY
          tar -tJf "$RUNNER_TEMP/pilot-v3-p0/final-payload.tar.xz" | LC_ALL=C sort > "$RUNNER_TEMP/pilot-v3-p0/archive-members.txt"
          python3 - "$BINDING_PATH" "$RUNNER_TEMP/pilot-v3-p0/archive-members.txt" <<'PY'
          import json, pathlib, sys
          binding = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          actual = pathlib.Path(sys.argv[2]).read_text(encoding="utf-8").splitlines()
          expected = sorted(binding["archive"]["members"])
          if actual != expected:
              raise SystemExit("ARCHIVE_MEMBER_SET_MISMATCH")
          PY

      - name: Verify transport tree before materialization
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          set -euo pipefail
          python3 -m unittest -v tests.test_pilot_v3_generate_overlay 2>&1 | tee "$RUNNER_TEMP/pilot-v3-p0/transport-generator-tests.log"
          python3 -m unittest -v tests.test_a0_manifest_diagnostic tests.test_b1a_artifact_manifest 2>&1 | tee "$RUNNER_TEMP/pilot-v3-p0/transport-manifest-tests.log"
          python3 -m quantum.scripts.ci 2>&1 | tee "$RUNNER_TEMP/pilot-v3-p0/transport-full-source-ci.log"

      - name: Materialize and verify exact final tree
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          set -euo pipefail
          transport_sha="$(git rev-parse HEAD)"
          authorization_sha="$(git rev-parse HEAD^^)"
          manifest_sha="$(git rev-parse HEAD^)"
          tar -xJf "$RUNNER_TEMP/pilot-v3-p0/final-payload.tar.xz" -C "$GITHUB_WORKSPACE"
          python3 - "$BINDING_PATH" <<'PY'
          import hashlib, json, pathlib, sys
          binding_path = pathlib.Path(sys.argv[1])
          binding = json.loads(binding_path.read_text(encoding="utf-8"))
          for path in binding["phase_b_delete_paths"]:
              target = pathlib.Path(path)
              if target.exists():
                  target.unlink()
          for item in binding["final_payload_files"]:
              path = pathlib.Path(item["path"])
              raw = path.read_bytes()
              if len(raw) != item["size_bytes"] or hashlib.sha256(raw).hexdigest() != item["sha256"]:
                  raise SystemExit("FINAL_PAYLOAD_FILE_MISMATCH:" + item["path"])
          PY
          git checkout "$transport_sha" -- .github/workflows/pilot-v3-canonical-recovery.yml
          python3 - "$transport_sha" "$authorization_sha" "$manifest_sha" <<'PY'
          import json, pathlib, sys
          transport_sha, authorization_sha, manifest_sha = sys.argv[1:]
          root = pathlib.Path.cwd()
          evidence_id = "EVD-PILOT-P0-ATTEMPT-009"
          work_order_id = "WO-PILOT-P0-OVERLAY-FINAL-MANIFEST-STAGING-CORRECTIVE-011"
          base_head = "22b404e5bcacc509ca463b0c3a83e714b80b0aee"
          def load(name):
              path = root / "docs/evidence/pilot_v3_0" / name
              return path, json.loads(path.read_text(encoding="utf-8"))
          def write(path, payload):
              path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8", newline="\n")
          path, state = load("PILOT_AUTONOMOUS_EXECUTION_STATE.json")
          state["active_lock"]["governing_work_order_id"] = work_order_id
          state["active_lock"]["lock_id"] = "LOCK-PILOT-P0-OVERLAY-FINAL-MANIFEST-STAGING-CORRECTIVE-011"
          state["active_lock"]["state"] = "RELEASED_AFTER_GUARDED_FINAL_MANIFEST_STAGING_CORRECTIVE_MATERIALIZATION"
          state["evidence_ids"] = list(dict.fromkeys([*state.get("evidence_ids", []), evidence_id]))
          state["result_exact_head_binding"] = "REMOTE_CANONICAL_REF_READBACK_RECORDED_BY_" + evidence_id
          state["work_order_base_exact_head"] = base_head
          write(path, state)
          path, register = load("PILOT_P0_EXECUTION_REGISTER.json")
          for item in register["requirements"]:
              item["actual_evidence_ids"] = ["EVD-PILOT-P0-ATTEMPT-004", evidence_id]
              item["actual_status"] = "VERIFIED"
          register["overall_status"] = "VERIFIED"
          register["work_order_base_exact_head"] = base_head
          write(path, register)
          path, evidence = load("PILOT_P0_OVERLAY_BINDING_EVIDENCE.json")
          evidence["evidence_id"] = evidence_id
          evidence["governing_work_order_id"] = work_order_id
          evidence["guarded_materialization"]["transport_parent_exact_head"] = transport_sha
          evidence["corrective_provenance"] = {
              "failed_work_order_id": "WO-PILOT-P0-OVERLAY-PR-PREFLIGHT-CORRECTIVE-010",
              "failed_transport_exact_head": base_head,
              "failed_run_id": 30392936134,
              "failed_artifact_id": 8701646475,
              "failed_artifact_sha256": "f9fadbc82f497bb8511b95c0937204519185f79bd43fb8f84aebf24b12813db2",
              "failure_class": "FINAL_MANIFEST_TESTS_READ_UNSTAGED_DELETED_TRANSPORT_CHUNKS",
              "transport_tree_source_ci_tests": 1016,
              "transport_tree_source_ci_status": "PASS",
              "scope_negative_positive_control_status": "PASS",
              "final_generator_tests": 8,
              "final_generator_status": "PASS",
              "corrective_action": "stage exact signed phase-B set after scope controls and before final manifest tests",
              "test_criteria_changed": False,
              "execution_event": "same-repository pull_request synchronize",
              "authorization_commit": authorization_sha,
              "transport_manifest_commit": manifest_sha,
              "execution_transport_commit": transport_sha,
              "status": "VERIFIED_BY_DISCOVERABLE_PR_RUN_STAGED_INDEX_MANIFEST_TESTS_SOURCE_CI_AND_REMOTE_READBACK"
          }
          evidence["status"] = "VERIFIED_BY_GUARDED_FINAL_MANIFEST_STAGING_CORRECTIVE_MATERIALIZATION"
          write(path, evidence)
          path, chain = load("PILOT_WORK_ORDER_CHAIN.json")
          for item in chain["entries"]:
              if item["work_order_id"] == "WO-PILOT-P0-OVERLAY-MATERIALIZATION-007":
                  item["result_exact_head"] = "fcf8826ebd20b4ce52fdbb48ee0253344cce36c4"
                  item["status"] = "REMOTE_COMMIT_VERIFIED_RUNTIME_FAILED_PHASE_B_SCOPE_COLLECTION"
                  item["evidence_ids"] = ["EVD-PILOT-P0-ATTEMPT-005"]
          chain["entries"] = [item for item in chain["entries"] if item["work_order_id"] not in {
              "WO-PILOT-P0-OVERLAY-SCOPE-CORRECTIVE-008",
              "WO-PILOT-P0-OVERLAY-PR-EXECUTION-CORRECTIVE-009",
              "WO-PILOT-P0-OVERLAY-PR-PREFLIGHT-CORRECTIVE-010",
              work_order_id
          }]
          chain["entries"].append({
              "ordinal": 8,
              "parent_exact_head": "fcf8826ebd20b4ce52fdbb48ee0253344cce36c4",
              "authorization_commit": "7117304668f4629110bd426a2b11761820e33bcc",
              "transport_manifest_commit": "b471064a379c67153601a21c442fa31b21d0ad08",
              "execution_transport_commit": "743bf7ed38a3fd3eaf68f7364f2c38e82eb0cd96",
              "result_exact_head": "743bf7ed38a3fd3eaf68f7364f2c38e82eb0cd96",
              "status": "REMOTE_TRANSPORT_COMMIT_VERIFIED_FINAL_SELF_COMMIT_NOT_OBSERVED",
              "evidence_ids": ["EVD-PILOT-P0-ATTEMPT-006"],
              "two_phase_transport": True,
              "work_order_id": "WO-PILOT-P0-OVERLAY-SCOPE-CORRECTIVE-008"
          })
          chain["entries"].append({
              "ordinal": 9,
              "parent_exact_head": "743bf7ed38a3fd3eaf68f7364f2c38e82eb0cd96",
              "authorization_commit": "0dab5ff49e053311b44cf24e7bfc73d1635c426f",
              "transport_manifest_commit": "69e3b113f69a2e49d4c255613a3eb1b6baed2896",
              "execution_transport_commit": None,
              "result_exact_head": "69e3b113f69a2e49d4c255613a3eb1b6baed2896",
              "status": "STATIC_PREFLIGHT_FAILED_BEFORE_EXECUTION_WORKFLOW_COMMIT",
              "evidence_ids": ["EVD-PILOT-P0-ATTEMPT-007"],
              "two_phase_transport": True,
              "work_order_id": "WO-PILOT-P0-OVERLAY-PR-EXECUTION-CORRECTIVE-009"
          })
          chain["entries"].append({
              "ordinal": 10,
              "parent_exact_head": "69e3b113f69a2e49d4c255613a3eb1b6baed2896",
              "authorization_commit": "bca04bec78814ddf4d7c93a661a1aba3249f3592",
              "transport_manifest_commit": "727e16d9f22ca5b9e826c4a672cbeb1f81d178da",
              "execution_transport_commit": "22b404e5bcacc509ca463b0c3a83e714b80b0aee",
              "result_exact_head": "22b404e5bcacc509ca463b0c3a83e714b80b0aee",
              "status": "DISCOVERABLE_PR_RUNTIME_FAILED_FINAL_MANIFEST_TESTS_BEFORE_COMMIT",
              "evidence_ids": ["EVD-PILOT-P0-ATTEMPT-008"],
              "run_id": 30392936134,
              "artifact_id": 8701646475,
              "two_phase_transport": True,
              "work_order_id": "WO-PILOT-P0-OVERLAY-PR-PREFLIGHT-CORRECTIVE-010"
          })
          chain["entries"].append({
              "ordinal": 11,
              "parent_exact_head": base_head,
              "authorization_commit": authorization_sha,
              "transport_manifest_commit": manifest_sha,
              "execution_transport_commit": transport_sha,
              "result_exact_head": "CURRENT_CANONICAL_HEAD_BOUND_BY_REMOTE_READBACK",
              "status": "GUARDED_FINAL_MANIFEST_STAGING_CORRECTIVE_OVERLAY_MATERIALIZATION_VERIFIED",
              "evidence_ids": [evidence_id],
              "two_phase_transport": True,
              "work_order_id": work_order_id
          })
          write(path, chain)
          PY
          python3 - "$BINDING_PATH" <<'PY'
          import hashlib, json, pathlib, sys
          binding = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          transport_path = pathlib.Path("docs/evidence/ARTIFACT_MANIFEST_OVERLAY_PILOT_V3_0_P0_OVERLAY_TRANSPORT.json")
          transport_raw = transport_path.read_bytes()
          base_blob = hashlib.sha1(f"blob {len(transport_raw)}\0".encode("ascii") + transport_raw).hexdigest()
          entries = []
          for path_text in binding["closure_manifest_entry_paths"]:
              path = pathlib.Path(path_text)
              raw = path.read_bytes()
              entries.append([path_text, hashlib.sha256(raw).hexdigest(), len(raw)])
          payload = {
              "artifact_type": "ARTIFACT_MANIFEST_OVERLAY",
              "base_pilot_v3_0_p0_overlay_transport_overlay_git_blob_sha": base_blob,
              "entries": sorted(entries),
              "overlay_id": "PILOT-V3.0-P0-OVERLAY-CLOSURE",
              "release_authorized": False,
              "remove_paths": sorted(binding["phase_b_delete_paths"]),
              "schema_version": "1.0.0",
              "scope": "Commit and reread the deterministic 712-row pilot applicability overlay after the verified scope-collector, PR-execution, PR-preflight and final-manifest-staging correctives; synchronize P0 evidence state; remove temporary binary transport files; no product, UI, installer, dependency, canonical RTM, Protocol v3.1, M9 controller, marketplace-write or release change.",
          }
          pathlib.Path("docs/evidence/ARTIFACT_MANIFEST_OVERLAY_PILOT_V3_0_P0_OVERLAY_CLOSURE.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8", newline="\n"
          )
          PY
          python3 -m tools.pilot_v3_generate_overlay --repo-root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/pilot-v3-p0/regenerated-overlay.json" 2>&1 | tee "$RUNNER_TEMP/pilot-v3-p0/final-generation.log"
          cmp "$COMMITTED_OVERLAY" "$RUNNER_TEMP/pilot-v3-p0/regenerated-overlay.json"
          python3 - "$COMMITTED_OVERLAY" "$BINDING_PATH" <<'PY'
          import hashlib, json, pathlib, sys
          overlay_path = pathlib.Path(sys.argv[1])
          binding = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding="utf-8"))
          raw = overlay_path.read_bytes()
          expected = binding["committed_overlay"]
          assert len(raw) == expected["size_bytes"]
          assert hashlib.sha256(raw).hexdigest() == expected["sha256"]
          assert hashlib.sha1(f"blob {len(raw)}\0".encode("ascii") + raw).hexdigest() == expected["git_blob_sha"]
          payload = json.loads(raw)
          entries = payload["entries"]
          ids = [item["requirement_id"] for item in entries]
          assert len(entries) == len(set(ids)) == 712
          assert payload["release_authorized"] is False
          assert payload["pilot_decision"] == "PILOT_BLOCKED"
          assert payload["production_release_decision"] == "RELEASE_BLOCKED"
          PY
          git diff --check
          git diff --name-only | LC_ALL=C sort -u > "$RUNNER_TEMP/pilot-v3-p0/phase-b-tracked-only.txt"
          {
            git diff --name-only
            git ls-files --others --exclude-standard
          } | LC_ALL=C sort -u > "$RUNNER_TEMP/pilot-v3-p0/phase-b-paths.txt"
          python3 - "$WORK_ORDER_PATH" "$RUNNER_TEMP/pilot-v3-p0/phase-b-tracked-only.txt" "$RUNNER_TEMP/pilot-v3-p0/phase-b-paths.txt" <<'PY'
          import json, pathlib, sys
          work_order = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          old = set(pathlib.Path(sys.argv[2]).read_text(encoding="utf-8").splitlines())
          actual = set(pathlib.Path(sys.argv[3]).read_text(encoding="utf-8").splitlines())
          expected = set(work_order["phase_b_final_files_allowed_to_change"])
          scope_order = json.loads(pathlib.Path("docs/evidence/pilot_v3_0/WORK_ORDER_P0_OVERLAY_SCOPE_CORRECTIVE_008.json").read_text(encoding="utf-8"))
          expected_old_missing = set(scope_order["root_cause_regression"]["old_collector_omitted_paths"])
          if expected - old != expected_old_missing:
              raise SystemExit("OLD_COLLECTOR_NEGATIVE_CONTROL_INVALID:" + json.dumps({"expected_missing": sorted(expected_old_missing), "actual_missing": sorted(expected-old)}, sort_keys=True))
          if actual != expected:
              raise SystemExit("PHASE_B_SCOPE_MISMATCH:" + json.dumps({"missing": sorted(expected-actual), "extra": sorted(actual-expected)}, sort_keys=True))
          print("PHASE_B_SCOPE_COLLECTOR_NEGATIVE_AND_POSITIVE_CONTROLS_PASSED")
          PY
          git add -A
          git diff --cached --name-only | LC_ALL=C sort > "$RUNNER_TEMP/pilot-v3-p0/staged-final-paths.txt"
          cmp "$RUNNER_TEMP/pilot-v3-p0/phase-b-paths.txt" "$RUNNER_TEMP/pilot-v3-p0/staged-final-paths.txt"
          git diff --cached --check
          python3 -m unittest -v tests.test_pilot_v3_generate_overlay 2>&1 | tee "$RUNNER_TEMP/pilot-v3-p0/final-generator-tests.log"
          python3 -m unittest -v tests.test_a0_manifest_diagnostic tests.test_b1a_artifact_manifest 2>&1 | tee "$RUNNER_TEMP/pilot-v3-p0/final-manifest-tests.log"
          python3 -m quantum.scripts.ci 2>&1 | tee "$RUNNER_TEMP/pilot-v3-p0/final-full-source-ci.log"
          test -z "$(git diff --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
          git diff --cached --name-only | LC_ALL=C sort > "$RUNNER_TEMP/pilot-v3-p0/staged-final-paths-after-tests.txt"
          cmp "$RUNNER_TEMP/pilot-v3-p0/phase-b-paths.txt" "$RUNNER_TEMP/pilot-v3-p0/staged-final-paths-after-tests.txt"
          git diff --cached --check

          git config user.name quantum-ci
          git config user.email quantum-ci@users.noreply.github.com
          git commit -m "P0: commit and reread overlay via final manifest staging corrective"
          final_sha="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$transport_sha"
          git show "$final_sha:$COMMITTED_OVERLAY" > "$RUNNER_TEMP/pilot-v3-p0/commit-readback-overlay.json"
          cmp "$COMMITTED_OVERLAY" "$RUNNER_TEMP/pilot-v3-p0/commit-readback-overlay.json"
          test "$(git ls-tree "$final_sha" "$COMMITTED_OVERLAY" | awk '{print $3}')" = "$(python3 -c 'import json; print(json.load(open("'"$BINDING_PATH"'"))["committed_overlay"]["git_blob_sha"])')"
          remote_before="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_before" = "$transport_sha"
          git push origin "$final_sha:refs/heads/$TARGET_BRANCH"
          git fetch --no-tags origin "refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          remote_after="$(git rev-parse "refs/remotes/origin/$TARGET_BRANCH")"
          test "$remote_after" = "$final_sha"
          git show "refs/remotes/origin/$TARGET_BRANCH:$COMMITTED_OVERLAY" > "$RUNNER_TEMP/pilot-v3-p0/remote-readback-overlay.json"
          cmp "$COMMITTED_OVERLAY" "$RUNNER_TEMP/pilot-v3-p0/remote-readback-overlay.json"
          python3 - "$WORK_ORDER_PATH" > "$RUNNER_TEMP/pilot-v3-p0/final-existing-paths.txt" <<'PY'
          import json, pathlib, sys
          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          for path in payload["phase_b_final_files_allowed_to_change"]:
              if path not in payload["phase_b_delete_paths"]:
                  print(path)
          PY
          while IFS= read -r path; do
            mkdir -p "$RUNNER_TEMP/pilot-v3-p0/remote-files/$(dirname "$path")"
            git show "refs/remotes/origin/$TARGET_BRANCH:$path" > "$RUNNER_TEMP/pilot-v3-p0/remote-files/$path"
            cmp "$path" "$RUNNER_TEMP/pilot-v3-p0/remote-files/$path"
          done < "$RUNNER_TEMP/pilot-v3-p0/final-existing-paths.txt"
          python3 - "$WORK_ORDER_PATH" > "$RUNNER_TEMP/pilot-v3-p0/final-deleted-paths.txt" <<'PY'
          import json, pathlib, sys
          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          print("\n".join(payload["phase_b_delete_paths"]))
          PY
          while IFS= read -r path; do
            if git cat-file -e "refs/remotes/origin/$TARGET_BRANCH:$path" 2>/dev/null; then
              echo "REMOTE_DELETED_PATH_STILL_PRESENT:$path" >&2
              exit 1
            fi
          done < "$RUNNER_TEMP/pilot-v3-p0/final-deleted-paths.txt"
          printf '%s\n' "$transport_sha" > "$RUNNER_TEMP/pilot-v3-p0/transport-head.txt"
          printf '%s\n' "$final_sha" > "$RUNNER_TEMP/pilot-v3-p0/final-head.txt"
          sha256sum "$RUNNER_TEMP/pilot-v3-p0/remote-readback-overlay.json" > "$RUNNER_TEMP/pilot-v3-p0/remote-readback-sha256.txt"
          echo "P0_OVERLAY_REMOTE_BINDING_VERIFIED"

      - name: Upload immutable materialization evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Quantum-Pilot-v3-P0-Overlay-Final-Manifest-Staging-${{ env.TARGET_SHA }}
          path: ${{ runner.temp }}/pilot-v3-p0/**
          if-no-files-found: error
          retention-days: 30
