name: Quantum Pilot v3 Canonical Overlay Materialization

on:
  push:
    branches:
      - fix/quantum-pilot-v3-canonical
    paths:
      - ".github/workflows/pilot-v3-canonical-recovery.yml"
      - ".pilot-v3-p0-overlay-transport/**"
      - "tools/pilot_v3_generate_overlay.py"
      - "tests/integration_manifest_support_pilot_v3.py"
      - "tests/test_pilot_v3_generate_overlay.py"
      - "tests/test_a0_manifest_diagnostic.py"
      - "tests/test_b1a_artifact_manifest.py"
      - "docs/evidence/ARTIFACT_MANIFEST_OVERLAY_PILOT_V3_0_*.json"
      - "docs/evidence/pilot_v3_0/**"

permissions:
  contents: write

concurrency:
  group: quantum-pilot-v3-canonical-overlay
  cancel-in-progress: false

env:
  TARGET_SHA: ${{ github.sha }}
  TARGET_BRANCH: ${{ github.ref_name }}
  CANONICAL_BRANCH: fix/quantum-pilot-v3-canonical
  BASE_EXACT_HEAD: d65ad8e01672365a35aeff4791ee8800a5f1a27f
  WORK_ORDER_PATH: docs/evidence/pilot_v3_0/WORK_ORDER_P0_OVERLAY_MATERIALIZATION_007.json
  BINDING_PATH: docs/evidence/pilot_v3_0/PILOT_P0_OVERLAY_TRANSPORT_BINDING.json
  COMMITTED_OVERLAY: docs/evidence/pilot_v3_0/PILOT_APPLICABILITY_OVERLAY.json
  CLOSURE_OVERLAY: docs/evidence/ARTIFACT_MANIFEST_OVERLAY_PILOT_V3_0_P0_OVERLAY_CLOSURE.json

jobs:
  p0-overlay-materialization:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact canonical head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.TARGET_SHA }}
          clean: true
          fetch-depth: 0
          persist-credentials: true

      - name: Verify runtime and signed two-phase work order
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 - <<'PY'
          import sys
          if sys.version_info < (3, 12):
              raise SystemExit(f"Python 3.12+ required, got {sys.version}")
          import setuptools.build_meta  # noqa: F401
          print("SOURCE_RUNTIME_BACKEND_AVAILABLE")
          PY
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$TARGET_BRANCH" = "$CANONICAL_BRANCH"
          test "$(git rev-parse HEAD^)" = "$BASE_EXACT_HEAD"
          git diff --name-only HEAD^ HEAD | LC_ALL=C sort > "$RUNNER_TEMP/phase-a-paths.txt"
          python3 - "$RUNNER_TEMP/phase-a-paths.txt" <<'PY'
          import copy, hashlib, json, pathlib, sys
          root = pathlib.Path.cwd()
          work_order = json.loads((root / pathlib.Path("docs/evidence/pilot_v3_0/WORK_ORDER_P0_OVERLAY_MATERIALIZATION_007.json")).read_text(encoding="utf-8"))
          unsigned = copy.deepcopy(work_order)
          stored = unsigned.pop("work_order_sha256")
          canonical = json.dumps(unsigned, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode("utf-8")
          if stored != hashlib.sha256(canonical).hexdigest():
              raise SystemExit("ACTIVE_WORK_ORDER_SIGNATURE_INVALID")
          if work_order["canonical_branch"] != "fix/quantum-pilot-v3-canonical":
              raise SystemExit("ACTIVE_WORK_ORDER_BRANCH_INVALID")
          if work_order["parent_exact_head"] != "d65ad8e01672365a35aeff4791ee8800a5f1a27f":
              raise SystemExit("ACTIVE_WORK_ORDER_PARENT_INVALID")
          binding_path = root / work_order["transport_binding_path"]
          binding_raw = binding_path.read_bytes()
          if hashlib.sha256(binding_raw).hexdigest() != work_order["transport_binding_sha256"]:
              raise SystemExit("TRANSPORT_BINDING_HASH_INVALID")
          actual = set(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8").splitlines())
          expected = set(work_order["phase_a_transport_files_allowed_to_change"])
          if actual != expected:
              raise SystemExit("PHASE_A_SCOPE_MISMATCH:" + json.dumps({"missing": sorted(expected-actual), "extra": sorted(actual-expected)}, sort_keys=True))
          gate = json.loads((root / "docs/evidence/pilot_v3_0/PILOT_CAPABILITY_GATE.json").read_text(encoding="utf-8"))
          if gate["decision"] != "P0_OVERLAY_MATERIALIZATION_ALLOWED" or gate["largest_artifact_delivery_gate"]["status"] != "PASS":
              raise SystemExit("CAPABILITY_GATE_NOT_PASSED")
          print("SIGNED_TWO_PHASE_WORK_ORDER_VERIFIED")
          PY

      - name: Reconstruct and verify transport archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pilot-v3-p0"
          python3 - "$BINDING_PATH" "$RUNNER_TEMP/pilot-v3-p0/final-payload.tar.xz" <<'PY'
          import hashlib, json, pathlib, sys
          binding = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          output = pathlib.Path(sys.argv[2])
          with output.open("wb") as target:
              for chunk in binding["chunks"]:
                  path = pathlib.Path(chunk["path"])
                  raw = path.read_bytes()
                  if len(raw) != chunk["size_bytes"]:
                      raise SystemExit("CHUNK_SIZE_MISMATCH:" + chunk["path"])
                  if hashlib.sha256(raw).hexdigest() != chunk["sha256"]:
                      raise SystemExit("CHUNK_SHA256_MISMATCH:" + chunk["path"])
                  git_blob = hashlib.sha1(f"blob {len(raw)}\0".encode("ascii") + raw).hexdigest()
                  if git_blob != chunk["git_blob_sha"]:
                      raise SystemExit("CHUNK_GIT_BLOB_MISMATCH:" + chunk["path"])
                  target.write(raw)
          archive = output.read_bytes()
          if len(archive) != binding["archive"]["size_bytes"]:
              raise SystemExit("ARCHIVE_SIZE_MISMATCH")
          if hashlib.sha256(archive).hexdigest() != binding["archive"]["sha256"]:
              raise SystemExit("ARCHIVE_SHA256_MISMATCH")
          print("TRANSPORT_ARCHIVE_VERIFIED")
          PY
          tar -tJf "$RUNNER_TEMP/pilot-v3-p0/final-payload.tar.xz" | LC_ALL=C sort > "$RUNNER_TEMP/pilot-v3-p0/archive-members.txt"
          python3 - "$BINDING_PATH" "$RUNNER_TEMP/pilot-v3-p0/archive-members.txt" <<'PY'
          import json, pathlib, sys
          binding = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          actual = pathlib.Path(sys.argv[2]).read_text(encoding="utf-8").splitlines()
          expected = sorted(binding["archive"]["members"])
          if actual != expected:
              raise SystemExit("ARCHIVE_MEMBER_SET_MISMATCH")
          PY

      - name: Verify transport tree before materialization
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          set -euo pipefail
          python3 -m unittest -v tests.test_pilot_v3_generate_overlay 2>&1 | tee "$RUNNER_TEMP/pilot-v3-p0/transport-generator-tests.log"
          python3 -m unittest -v tests.test_a0_manifest_diagnostic tests.test_b1a_artifact_manifest 2>&1 | tee "$RUNNER_TEMP/pilot-v3-p0/transport-manifest-tests.log"
          python3 -m quantum.scripts.ci 2>&1 | tee "$RUNNER_TEMP/pilot-v3-p0/transport-full-source-ci.log"

      - name: Materialize and verify exact final tree
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          set -euo pipefail
          transport_sha="$(git rev-parse HEAD)"
          tar -xJf "$RUNNER_TEMP/pilot-v3-p0/final-payload.tar.xz" -C "$GITHUB_WORKSPACE"
          python3 - "$BINDING_PATH" <<'PY'
          import hashlib, json, pathlib, sys
          binding_path = pathlib.Path(sys.argv[1])
          binding = json.loads(binding_path.read_text(encoding="utf-8"))
          for path in binding["phase_b_delete_paths"]:
              target = pathlib.Path(path)
              if target.exists():
                  target.unlink()
          for item in binding["final_payload_files"]:
              path = pathlib.Path(item["path"])
              raw = path.read_bytes()
              if len(raw) != item["size_bytes"] or hashlib.sha256(raw).hexdigest() != item["sha256"]:
                  raise SystemExit("FINAL_PAYLOAD_FILE_MISMATCH:" + item["path"])
          PY
          python3 - "$BINDING_PATH" <<'PY'
          import hashlib, json, pathlib, sys
          binding = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          transport_path = pathlib.Path("docs/evidence/ARTIFACT_MANIFEST_OVERLAY_PILOT_V3_0_P0_OVERLAY_TRANSPORT.json")
          transport_raw = transport_path.read_bytes()
          base_blob = hashlib.sha1(f"blob {len(transport_raw)}\0".encode("ascii") + transport_raw).hexdigest()
          entries = []
          for path_text in binding["closure_manifest_entry_paths"]:
              path = pathlib.Path(path_text)
              raw = path.read_bytes()
              entries.append([path_text, hashlib.sha256(raw).hexdigest(), len(raw)])
          payload = {
              "artifact_type": "ARTIFACT_MANIFEST_OVERLAY",
              "base_pilot_v3_0_p0_overlay_transport_overlay_git_blob_sha": base_blob,
              "entries": sorted(entries),
              "overlay_id": "PILOT-V3.0-P0-OVERLAY-CLOSURE",
              "release_authorized": False,
              "remove_paths": sorted(binding["phase_b_delete_paths"]),
              "schema_version": "1.0.0",
              "scope": "Commit and reread the deterministic 712-row pilot applicability overlay; synchronize P0 evidence state; remove temporary binary transport files; no product, UI, installer, dependency, canonical RTM, Protocol v3.1, M9 controller, marketplace-write or release change.",
          }
          pathlib.Path("docs/evidence/ARTIFACT_MANIFEST_OVERLAY_PILOT_V3_0_P0_OVERLAY_CLOSURE.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8", newline="\n"
          )
          PY
          python3 -m tools.pilot_v3_generate_overlay --repo-root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/pilot-v3-p0/regenerated-overlay.json" 2>&1 | tee "$RUNNER_TEMP/pilot-v3-p0/final-generation.log"
          cmp "$COMMITTED_OVERLAY" "$RUNNER_TEMP/pilot-v3-p0/regenerated-overlay.json"
          python3 - "$COMMITTED_OVERLAY" "$BINDING_PATH" <<'PY'
          import hashlib, json, pathlib, sys
          overlay_path = pathlib.Path(sys.argv[1])
          binding = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding="utf-8"))
          raw = overlay_path.read_bytes()
          expected = binding["committed_overlay"]
          assert len(raw) == expected["size_bytes"]
          assert hashlib.sha256(raw).hexdigest() == expected["sha256"]
          assert hashlib.sha1(f"blob {len(raw)}\0".encode("ascii") + raw).hexdigest() == expected["git_blob_sha"]
          payload = json.loads(raw)
          entries = payload["entries"]
          ids = [item["requirement_id"] for item in entries]
          assert len(entries) == len(set(ids)) == 712
          assert payload["release_authorized"] is False
          assert payload["pilot_decision"] == "PILOT_BLOCKED"
          assert payload["production_release_decision"] == "RELEASE_BLOCKED"
          PY
          git diff --check
          git diff --name-only | LC_ALL=C sort > "$RUNNER_TEMP/pilot-v3-p0/phase-b-paths.txt"
          python3 - "$WORK_ORDER_PATH" "$RUNNER_TEMP/pilot-v3-p0/phase-b-paths.txt" <<'PY'
          import json, pathlib, sys
          work_order = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          actual = set(pathlib.Path(sys.argv[2]).read_text(encoding="utf-8").splitlines())
          expected = set(work_order["phase_b_final_files_allowed_to_change"])
          if actual != expected:
              raise SystemExit("PHASE_B_SCOPE_MISMATCH:" + json.dumps({"missing": sorted(expected-actual), "extra": sorted(actual-expected)}, sort_keys=True))
          PY
          python3 -m unittest -v tests.test_pilot_v3_generate_overlay 2>&1 | tee "$RUNNER_TEMP/pilot-v3-p0/final-generator-tests.log"
          python3 -m unittest -v tests.test_a0_manifest_diagnostic tests.test_b1a_artifact_manifest 2>&1 | tee "$RUNNER_TEMP/pilot-v3-p0/final-manifest-tests.log"
          python3 -m quantum.scripts.ci 2>&1 | tee "$RUNNER_TEMP/pilot-v3-p0/final-full-source-ci.log"

          git config user.name quantum-ci
          git config user.email quantum-ci@users.noreply.github.com
          git add -A
          git diff --cached --name-only | LC_ALL=C sort > "$RUNNER_TEMP/pilot-v3-p0/staged-final-paths.txt"
          cmp "$RUNNER_TEMP/pilot-v3-p0/phase-b-paths.txt" "$RUNNER_TEMP/pilot-v3-p0/staged-final-paths.txt"
          git commit -m "P0: commit and reread full pilot applicability overlay"
          final_sha="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$transport_sha"
          git show "$final_sha:$COMMITTED_OVERLAY" > "$RUNNER_TEMP/pilot-v3-p0/commit-readback-overlay.json"
          cmp "$COMMITTED_OVERLAY" "$RUNNER_TEMP/pilot-v3-p0/commit-readback-overlay.json"
          test "$(git ls-tree "$final_sha" "$COMMITTED_OVERLAY" | awk '{print $3}')" = "$(python3 -c 'import json; print(json.load(open("'"$BINDING_PATH"'"))["committed_overlay"]["git_blob_sha"])')"
          remote_before="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_before" = "$transport_sha"
          git push origin "$final_sha:refs/heads/$TARGET_BRANCH"
          git fetch --no-tags origin "refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          remote_after="$(git rev-parse "refs/remotes/origin/$TARGET_BRANCH")"
          test "$remote_after" = "$final_sha"
          git show "refs/remotes/origin/$TARGET_BRANCH:$COMMITTED_OVERLAY" > "$RUNNER_TEMP/pilot-v3-p0/remote-readback-overlay.json"
          cmp "$COMMITTED_OVERLAY" "$RUNNER_TEMP/pilot-v3-p0/remote-readback-overlay.json"
          printf '%s\n' "$transport_sha" > "$RUNNER_TEMP/pilot-v3-p0/transport-head.txt"
          printf '%s\n' "$final_sha" > "$RUNNER_TEMP/pilot-v3-p0/final-head.txt"
          sha256sum "$RUNNER_TEMP/pilot-v3-p0/remote-readback-overlay.json" > "$RUNNER_TEMP/pilot-v3-p0/remote-readback-sha256.txt"
          echo "P0_OVERLAY_REMOTE_BINDING_VERIFIED"

      - name: Upload immutable materialization evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Quantum-Pilot-v3-P0-Overlay-${{ env.TARGET_SHA }}
          path: ${{ runner.temp }}/pilot-v3-p0/**
          if-no-files-found: error
          retention-days: 30
