name: Quantum Pilot v3 Canonical Recovery

on:
  push:
    branches:
      - fix/quantum-pilot-v3-canonical
    paths:
      - "tools/pilot_v3_generate_overlay.py"
      - "tests/integration_manifest_support_pilot_v3.py"
      - "tests/test_pilot_v3_generate_overlay.py"
      - "tests/test_a0_manifest_diagnostic.py"
      - "tests/test_b1a_artifact_manifest.py"
      - "docs/evidence/ARTIFACT_MANIFEST_OVERLAY_PILOT_V3_0_CANONICAL_RECOVERY.json"
      - "docs/evidence/ARTIFACT_MANIFEST_OVERLAY_PILOT_V3_0_P0_EXECUTION.json"
      - "docs/evidence/ARTIFACT_MANIFEST_OVERLAY_PILOT_V3_0_P0_SIGNATURE_CORRECTIVE.json"
      - "docs/evidence/ARTIFACT_MANIFEST_OVERLAY_PILOT_V3_0_P0_GENERATOR_INVOCATION_CORRECTIVE.json"
      - "docs/evidence/ARTIFACT_MANIFEST_OVERLAY_PILOT_V3_0_P0_MANIFEST_CLOSURE.json"
      - "docs/evidence/ARTIFACT_MANIFEST_OVERLAY_PILOT_V3_0_P0_SOURCE_RUNTIME_ENV_CORRECTIVE.json"
      - "docs/evidence/pilot_v3_0/**"
      - ".github/workflows/pilot-v3-canonical-recovery.yml"
  pull_request:
    paths:
      - "tools/pilot_v3_generate_overlay.py"
      - "tests/integration_manifest_support_pilot_v3.py"
      - "tests/test_pilot_v3_generate_overlay.py"
      - "tests/test_a0_manifest_diagnostic.py"
      - "tests/test_b1a_artifact_manifest.py"
      - "docs/evidence/ARTIFACT_MANIFEST_OVERLAY_PILOT_V3_0_CANONICAL_RECOVERY.json"
      - "docs/evidence/ARTIFACT_MANIFEST_OVERLAY_PILOT_V3_0_P0_EXECUTION.json"
      - "docs/evidence/ARTIFACT_MANIFEST_OVERLAY_PILOT_V3_0_P0_SIGNATURE_CORRECTIVE.json"
      - "docs/evidence/ARTIFACT_MANIFEST_OVERLAY_PILOT_V3_0_P0_GENERATOR_INVOCATION_CORRECTIVE.json"
      - "docs/evidence/ARTIFACT_MANIFEST_OVERLAY_PILOT_V3_0_P0_MANIFEST_CLOSURE.json"
      - "docs/evidence/ARTIFACT_MANIFEST_OVERLAY_PILOT_V3_0_P0_SOURCE_RUNTIME_ENV_CORRECTIVE.json"
      - "docs/evidence/pilot_v3_0/**"
      - ".github/workflows/pilot-v3-canonical-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quantum-pilot-v3-canonical-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}

jobs:
  p0-canonical-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact canonical head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.TARGET_SHA }}
          clean: true
          fetch-depth: 0

      - name: Verify source-compatible system runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 - <<'PY'
          import sys
          if sys.version_info < (3, 12):
              raise SystemExit(f"Python 3.12+ required, got {sys.version}")
          import setuptools.build_meta  # noqa: F401
          print("SOURCE_RUNTIME_BACKEND_AVAILABLE")
          PY

      - name: Verify exact branch, head, signed work order and protected scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$TARGET_BRANCH" = "fix/quantum-pilot-v3-canonical"
          test "$(git rev-parse HEAD^)" = "825c1a4325b24fbae8ce8b616113ba087874a1ea"
          git diff --name-only HEAD^ HEAD | LC_ALL=C sort > "$RUNNER_TEMP/p0-changed-paths.txt"
          if grep -E '^(src/|scripts/|installer/|requirements/|pyproject.toml|docs/evidence/agent_v3_1/rtm/|docs/evidence/agent_v3_1/REQUIREMENTS_TRACEABILITY_MATRIX.json|tools/m9_maximum_assurance_control_plane.py|.github/workflows/m9-maximum-assurance-control-plane.yml)' "$RUNNER_TEMP/p0-changed-paths.txt"; then
            echo P0_FORBIDDEN_SCOPE_CHANGE >&2
            exit 1
          fi
          python3 - "$RUNNER_TEMP/p0-changed-paths.txt" <<'PY'
          import copy
          import hashlib
          import json
          import pathlib
          import sys

          root = pathlib.Path.cwd()
          path = root / "docs/evidence/pilot_v3_0/WORK_ORDER_P0_SOURCE_RUNTIME_ENV_CORRECTIVE_006.json"
          work_order = json.loads(path.read_text(encoding="utf-8"))
          unsigned = copy.deepcopy(work_order)
          stored = unsigned.pop("work_order_sha256")
          canonical = json.dumps(
              unsigned,
              ensure_ascii=False,
              sort_keys=True,
              separators=(",", ":"),
          ).encode("utf-8")
          actual_signature = hashlib.sha256(canonical).hexdigest()
          if stored != actual_signature:
              raise SystemExit("ACTIVE_WORK_ORDER_SIGNATURE_INVALID")
          if work_order["canonical_branch"] != "fix/quantum-pilot-v3-canonical":
              raise SystemExit("ACTIVE_WORK_ORDER_BRANCH_INVALID")
          if work_order["parent_exact_head"] != "825c1a4325b24fbae8ce8b616113ba087874a1ea":
              raise SystemExit("ACTIVE_WORK_ORDER_PARENT_INVALID")
          actual_paths = set(
              pathlib.Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
          )
          allowed_paths = set(work_order["files_allowed_to_change"])
          if actual_paths != allowed_paths:
              missing = sorted(allowed_paths - actual_paths)
              extra = sorted(actual_paths - allowed_paths)
              raise SystemExit(
                  "ACTIVE_WORK_ORDER_SCOPE_MISMATCH:"
                  + json.dumps({"missing": missing, "extra": extra}, sort_keys=True)
              )
          print("ACTIVE_WORK_ORDER_VERIFIED")
          PY

      - name: Run P0 unit controls and generate full overlay
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pilot-v3-p0"
          python3 -m unittest -v tests.test_pilot_v3_generate_overlay 2>&1 | tee "$RUNNER_TEMP/pilot-v3-p0/generator-tests.log"
          python3 -m tools.pilot_v3_generate_overlay --repo-root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/pilot-v3-p0/PILOT_APPLICABILITY_OVERLAY.json" 2>&1 | tee "$RUNNER_TEMP/pilot-v3-p0/generation.log"

      - name: Validate overlay and effective manifest
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/pilot-v3-p0/PILOT_APPLICABILITY_OVERLAY.json" <<'PY'
          import json, pathlib, sys
          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          entries = payload["entries"]
          ids = [item["requirement_id"] for item in entries]
          required = {
              "requirement_id", "pilot_applicability", "pilot_priority",
              "pilot_dependency", "pilot_action", "pilot_test",
              "pilot_target_evidence_level", "pilot_evidence_ids",
              "pilot_status", "justification", "production_status_unchanged",
          }
          assert len(entries) == 712
          assert len(set(ids)) == 712
          assert all(set(item) == required for item in entries)
          assert all(item["production_status_unchanged"] is True for item in entries)
          assert payload["release_authorized"] is False
          assert payload["pilot_decision"] == "PILOT_BLOCKED"
          assert payload["production_release_decision"] == "RELEASE_BLOCKED"
          PY
          python3 -m unittest -v tests.test_a0_manifest_diagnostic tests.test_b1a_artifact_manifest 2>&1 | tee "$RUNNER_TEMP/pilot-v3-p0/manifest-tests.log"

      - name: Run complete source regression
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          set -euo pipefail
          python3 -m quantum.scripts.ci 2>&1 | tee "$RUNNER_TEMP/pilot-v3-p0/full-source-ci.log"

      - name: Upload immutable P0 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Quantum-Pilot-v3-P0-${{ env.TARGET_SHA }}
          path: |
            ${{ runner.temp }}/p0-changed-paths.txt
            ${{ runner.temp }}/pilot-v3-p0/**
          if-no-files-found: error
          retention-days: 30
