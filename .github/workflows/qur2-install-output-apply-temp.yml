name: Temporary QUR2 Install Output Apply

on:
  push:
    branches:
      - fix/quantum-universal-relaunch-r2
    paths:
      - .github/workflows/qur2-install-output-apply-temp.yml
      - .qur2-install-output-payload/TRIGGER

permissions:
  contents: write

concurrency:
  group: qur2-install-output-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: fix/quantum-universal-relaunch-r2
          fetch-depth: 1
      - name: Apply exact diagnostic patch
        shell: bash
        env:
          OLD_WORKFLOW_SHA256: a6f57b64e40e4e8a898fb75addedd12ccc6178b79868d1496e790e1b14e37559
          OLD_OVERLAY_SHA256: 73798da9cf67b6a652845841b2b73177f61e2abb3cf0e0162539f65f2f635e0b
          NEW_WORKFLOW_SHA256: d6ca27bfdc09cfb264f6214138428a584fdd13d5467e8412326b190998ca2232
          NEW_OVERLAY_SHA256: 6a4407817973558832f7a969fbe7772ccf56ed0b972e540394696704276b5721
        run: |
          set -euo pipefail
          test "$(sha256sum .github/workflows/quantum-universal-relaunch-r2.yml | awk '{print $1}')" = "$OLD_WORKFLOW_SHA256"
          test "$(sha256sum docs/evidence/ARTIFACT_MANIFEST_OVERLAY_QUANTUM_UNIVERSAL_RELAUNCH_R2.json | awk '{print $1}')" = "$OLD_OVERLAY_SHA256"
          python - <<'PY'
          from hashlib import sha256
          import json
          from pathlib import Path

          workflow = Path('.github/workflows/quantum-universal-relaunch-r2.yml')
          text = workflow.read_text(encoding='utf-8')
          old = '''            powershell.exe -NoProfile -ExecutionPolicy Bypass `
              -File (Join-Path $packageRoot "scripts\\install_home_local.ps1") `
              -SourceRoot $packageRoot -TargetRoot $target
            if ($LASTEXITCODE -ne 0) { throw "PowerShell 5.1 install failed." }
'''
          new = '''            $installOutput = Join-Path $env:RUNNER_TEMP "qur2-install.stdout.txt"
            $installLines = @(
              powershell.exe -NoProfile -ExecutionPolicy Bypass `
                -File (Join-Path $packageRoot "scripts\\install_home_local.ps1") `
                -SourceRoot $packageRoot -TargetRoot $target 2>&1
            )
            $installExit = $LASTEXITCODE
            $installLines | Set-Content $installOutput -Encoding UTF8
            if ($installExit -ne 0) {
              "INSTALL_EXIT=$installExit" | Add-Content $trace
              throw "PowerShell 5.1 install failed."
            }
'''
          if text.count(old) != 1:
              raise SystemExit(f'INSTALL_OUTPUT_MARKER_COUNT={text.count(old)}')
          workflow.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          overlay_path = Path('docs/evidence/ARTIFACT_MANIFEST_OVERLAY_QUANTUM_UNIVERSAL_RELAUNCH_R2.json')
          overlay = json.loads(overlay_path.read_text(encoding='utf-8'))
          payload = workflow.read_bytes()
          entry = [workflow.as_posix(), sha256(payload).hexdigest(), len(payload)]
          matches = 0
          for index, current in enumerate(overlay['entries']):
              if current[0] == entry[0]:
                  overlay['entries'][index] = entry
                  matches += 1
          if matches != 1:
              raise SystemExit(f'WORKFLOW_MANIFEST_ENTRY_COUNT={matches}')
          overlay_path.write_text(
              json.dumps(overlay, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
              newline='\n',
          )
          PY
          test "$(sha256sum .github/workflows/quantum-universal-relaunch-r2.yml | awk '{print $1}')" = "$NEW_WORKFLOW_SHA256"
          test "$(sha256sum docs/evidence/ARTIFACT_MANIFEST_OVERLAY_QUANTUM_UNIVERSAL_RELAUNCH_R2.json | awk '{print $1}')" = "$NEW_OVERLAY_SHA256"
          rm -rf .qur2-install-output-payload
          rm -f .github/workflows/qur2-install-output-apply-temp.yml
          git diff --check
          git add -A
      - name: Run exact source checks
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/src"
          python -m unittest -v \
            tests.test_l4_installed_runtime_contract \
            tests.test_quantum_universal_relaunch_r2 \
            tests.test_windows_one_click_installer_r1 \
            tests.test_windows_source_package_launchers_r1
          python -m quantum.scripts.ci
      - name: Create tested commit and attempt publication
        shell: bash
        run: |
          set -uo pipefail
          git config user.name quantum-ci
          git config user.email quantum-ci@users.noreply.github.com
          git commit -m 'Capture QUR2 PowerShell 5.1 installer output' 2>&1 |
            tee "$RUNNER_TEMP/qur2-commit.log"
          commit_status=${PIPESTATUS[0]}
          git rev-parse HEAD | tee "$RUNNER_TEMP/qur2-commit-sha.txt"
          git rev-parse 'HEAD^{tree}' | tee "$RUNNER_TEMP/qur2-tree-sha.txt"
          push_status=0
          git push origin HEAD:fix/quantum-universal-relaunch-r2 2>&1 |
            tee "$RUNNER_TEMP/qur2-push.log" || push_status=${PIPESTATUS[0]}
          printf 'COMMIT_STATUS=%s\nPUSH_STATUS=%s\n' "$commit_status" "$push_status" |
            tee "$RUNNER_TEMP/qur2-publish-status.txt"
          test "$commit_status" -eq 0
          test "$push_status" -eq 0
      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: QUR2-Install-Output-Publication
          path: |
            ${{ runner.temp }}/qur2-commit.log
            ${{ runner.temp }}/qur2-commit-sha.txt
            ${{ runner.temp }}/qur2-tree-sha.txt
            ${{ runner.temp }}/qur2-push.log
            ${{ runner.temp }}/qur2-publish-status.txt
          if-no-files-found: error
          retention-days: 3
