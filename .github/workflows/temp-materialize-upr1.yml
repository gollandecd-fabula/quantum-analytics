name: Temporary Materialize UPR1

on:
  push:
    branches:
      - tmp/quantum-universal-partial-materialize
    paths:
      - ".github/workflows/temp-materialize-upr1.yml"
  pull_request:
    paths:
      - ".github/workflows/temp-materialize-upr1.yml"
      - "tools/upr1-patch/**"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_BRANCH: audit/quantum-universal-partial-r1
      TARGET_BASE: a300184c673f79f15e37eb388ef41c4a85773f2a
      EXPECTED_TREE: 47b95e2579a37e1d1332ed9d5e55a6b5033e030e
      PATCH_SHA256: fdc0a9b4312464f6b098b2523503f9b797feb87b5be9413c2f316f01a98750ab
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - name: Checkout materializer
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Rebuild and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat tools/upr1-patch/part-*.b64 | base64 --decode > "$RUNNER_TEMP/upr1.patch.xz"
          test "$(sha256sum "$RUNNER_TEMP/upr1.patch.xz" | cut -d' ' -f1)" = "$PATCH_SHA256"
          xz --decompress --stdout "$RUNNER_TEMP/upr1.patch.xz" > "$RUNNER_TEMP/upr1.patch"
          git apply --check "$RUNNER_TEMP/upr1.patch"

      - name: Checkout exact RTM-first target
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$TARGET_BASE"
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$TARGET_BASE"

      - name: Apply exact implementation
        shell: bash
        run: |
          set -euo pipefail
          git apply --index "$RUNNER_TEMP/upr1.patch"
          mapfile -t actual < <(git diff --cached --name-only | sort)
          mapfile -t expected <<'EOF'
          .github/workflows/universal-partial-r1.yml
          docs/evidence/ARTIFACT_MANIFEST_OVERLAY_UNIVERSAL_PARTIAL_R1.json
          docs/evidence/UNIVERSAL_PARTIAL_R1_DEFECT_REGISTER.json
          docs/evidence/WB_RELEASE_R2_EXECUTION_STATE.yaml
          docs/governance/CURRENT_STATE.md
          src/quantum/application/_finance_center_calculation.py
          src/quantum/application/_finance_center_dialog.py
          src/quantum/application/_finance_center_pages.py
          src/quantum/application/_finance_center_persistence.py
          src/quantum/application/_finance_center_queue_runtime.py
          src/quantum/application/_finance_center_reports.py
          src/quantum/application/_finance_center_self_test.py
          src/quantum/application/_finance_center_shared.py
          src/quantum/application/_finance_generic_tabular.py
          src/quantum/application/_finance_profile_engine.py
          src/quantum/application/_finance_profile_financial_rows.py
          src/quantum/application/_finance_profile_model.py
          src/quantum/application/_finance_profile_outputs.py
          src/quantum/application/_finance_schema_review.py
          src/quantum/application/finance_profile.py
          src/quantum/pilot/universal_intake.py
          src/quantum/pilot/universal_tables.py
          tests/integration_manifest_support_m8.py
          tests/test_finance_center_profile.py
          tests/test_finance_profile_block_reasons.py
          tests/test_m2_runtime_dependency_modernization.py
          tests/test_plateau_m1_runtime_integration.py
          tests/test_plateau_m2_financial_integration.py
          tests/test_plateau_m4_schema_review.py
          tests/test_plateau_m5_self_test.py
          tests/test_plateau_m6_build_metadata.py
          tests/test_quantum_reaudit_plateau_r1.py
          tests/test_universal_any_file_contract_r4.py
          tests/test_universal_ingestion_r4.py
          tests/test_universal_intake_hardening_r4.py
          tests/test_universal_partial_r1.py
          tests/test_wbr2_m5_closure.py
          tests/test_wbr2_m5_closure_corrective_r2.py
          EOF
          diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${actual[@]}")
          test "$(git write-tree)" = "$EXPECTED_TREE"

      - name: Create exact local candidate commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "quantum-redteam-bot"
          git config user.email "quantum-redteam-bot@users.noreply.github.com"
          git commit -m "Implement universal intake and maximum available calculations"
          test "$(git rev-parse HEAD^)" = "$TARGET_BASE"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"

      - name: Run exact candidate validation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/upr1-validation"
          python3 --version 2>&1 | tee "$RUNNER_TEMP/upr1-validation/python-version.txt"
          PYTHONPATH=src python3 - <<'PY' > "$RUNNER_TEMP/upr1-validation/desktop-self-test.json"
          import json
          import sys
          import tempfile
          from pathlib import Path
          from quantum.application.desktop_center import self_test

          output = {"python": sys.version}
          try:
              import tkinter
              output["tkinter"] = {"available": True, "version": str(tkinter.TkVersion)}
          except Exception as exc:
              output["tkinter"] = {"available": False, "error": type(exc).__name__, "detail": str(exc)}
          for status in ("READY", "REQUIRES_USER_VALUES"):
              with tempfile.TemporaryDirectory() as directory:
                  root = Path(directory)
                  config = root / "config.json"
                  config.write_text(json.dumps({
                      "configuration_status": status,
                      "tenant_id": "tenant-test",
                      "execution_mode": "ADMISSION_ONLY",
                  }), encoding="utf-8")
                  output[status] = self_test(root, config)
          print(json.dumps(output, ensure_ascii=False, indent=2))
          PY
          python3 -m compileall -q src tests 2>&1 | tee "$RUNNER_TEMP/upr1-validation/compile.log"
          PYTHONPATH=src python3 -m unittest tests.test_universal_partial_r1 -v 2>&1 | tee "$RUNNER_TEMP/upr1-validation/focused.log"
          PYTHONPATH=src python3 -m quantum.scripts.ci 2>&1 | tee "$RUNNER_TEMP/upr1-validation/full-ci.log"
          test "$(git rev-parse HEAD^)" = "$TARGET_BASE"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          git diff --exit-code
          git diff --cached --exit-code
          git status --porcelain=v1 --untracked-files=all | tee "$RUNNER_TEMP/upr1-validation/status.txt"

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: UPR1-Materializer-Validation-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/upr1-validation
          if-no-files-found: warn
          retention-days: 2

      - name: Publish validated one-child commit
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:refs/heads/$TARGET_BRANCH" \
            --force-with-lease="refs/heads/$TARGET_BRANCH:$TARGET_BASE"
          git rev-parse HEAD | tee "$RUNNER_TEMP/upr1-final-sha.txt"

      - name: Upload materialization evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: UPR1-Materialization-Evidence
          path: ${{ runner.temp }}/upr1-final-sha.txt
          if-no-files-found: error
          retention-days: 2
