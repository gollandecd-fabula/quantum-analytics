name: M2 Corrected Validation Full Log

on:
  pull_request:
    types: [reopened]

permissions:
  contents: read

jobs:
  validate:
    if: github.event.pull_request.head.ref == 'tmp/quantum-m2-corrected-stage'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.14'
      - name: Validate exact payload with full diagnostics
        shell: bash
        run: |
          set -uo pipefail
          {
            echo "HEAD=$(git rev-parse HEAD)"
            cat tools/m2_final_part_00.txt tools/m2_final_part_01.txt tools/m2_final_part_02.txt tools/m2_final_part_03.txt > /tmp/m2-final.b64
            echo "BASE64_SIZE=$(wc -c < /tmp/m2-final.b64)"
            echo "BASE64_SHA256=$(sha256sum /tmp/m2-final.b64 | awk '{print $1}')"
            base64 -d /tmp/m2-final.b64 > /tmp/m2-final.tar.gz || exit 31
            echo "TAR_SIZE=$(wc -c < /tmp/m2-final.tar.gz)"
            echo "TAR_SHA256=$(sha256sum /tmp/m2-final.tar.gz | awk '{print $1}')"
            tar -xzf /tmp/m2-final.tar.gz
            rm -f tools/m2_final_part_*.txt
            git add -A
            export PYTHONPATH="$PWD/src"
            export PYTHONDONTWRITEBYTECODE=1
            export PYTHONPYCACHEPREFIX=/tmp/quantum-m2-validation-pycache
            echo '=== COMPILEALL ==='
            python -m compileall -q src || exit 32
            echo '=== FOCUSED M2 ==='
            python -m unittest tests.test_m2_runtime_dependency_modernization -v || exit 33
            echo '=== POWERSHELL PARSE ==='
            pwsh -NoProfile -Command '$ErrorActionPreference="Stop"; Get-ChildItem scripts -Recurse -Filter *.ps1 | ForEach-Object { $tokens=$null; $localErrors=$null; [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$localErrors) | Out-Null; if ($localErrors.Count -gt 0) { Write-Host "FILE=$($_.FullName)"; $localErrors | Format-List * | Out-String | Write-Host; exit 19 } }' || exit 34
            echo '=== FULL SOURCE CI ==='
            python -m quantum.scripts.ci || exit 35
            echo 'M2_DIAGNOSTIC_VALIDATION=PASS'
          } 2>&1 | tee m2-corrected-validation.log
          exit ${PIPESTATUS[0]}
      - name: Upload full validation log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m2-corrected-validation-log
          path: m2-corrected-validation.log
          if-no-files-found: error
          retention-days: 2
