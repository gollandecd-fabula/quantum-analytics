name: SINDEL CP034 T3 decode entry
on:
  push:
    branches: [sindel-cp034-buildfactory]
    paths:
      - '.github/workflows/sindel-cp034-t3-decode-entry.yml'
      - 'sindel_cp034/t3_decode_factory.py'
      - 'sindel_cp034/export_t3_decode_stage.py'
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python sindel_cp034/t3_decode_factory.py
      - uses: actions/upload-artifact@v4
        with:
          name: cp034-t3-decode-report
          path: |
            work/CP034_T3_DECODE_SPLIT_MANIFEST.json
            work/t3_decode.report.json
          compression-level: 6
          retention-days: 2
      - uses: actions/upload-artifact@v4
        with:
          name: cp034-t3-decode-part-00
          path: work/chunks/t3_decode.pte.part_00
          compression-level: 0
          retention-days: 2
      - uses: actions/upload-artifact@v4
        with:
          name: cp034-t3-decode-part-01
          path: work/chunks/t3_decode.pte.part_01
          compression-level: 0
          retention-days: 2
      - uses: actions/upload-artifact@v4
        with:
          name: cp034-t3-decode-part-02
          path: work/chunks/t3_decode.pte.part_02
          compression-level: 0
          retention-days: 2
      - uses: actions/upload-artifact@v4
        with:
          name: cp034-t3-decode-part-03
          path: work/chunks/t3_decode.pte.part_03
          compression-level: 0
          retention-days: 2
