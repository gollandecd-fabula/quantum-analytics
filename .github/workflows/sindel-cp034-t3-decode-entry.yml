name: SINDEL CP034 T3 decode entry
on:
  push:
    branches: [sindel-cp034-buildfactory]
    paths: ['.github/workflows/sindel-cp034-t3-decode-entry.yml']
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python sindel_cp034/t3_decode_factory.py
# retry: exact import shim + flatc
