name: Temporary SLR1 Materialize V2

on:
  pull_request:
    paths:
      - ".github/workflows/temp-slr1-materialize-v2.yml"
      - "tools/slr1-materialize-transform.py"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_BRANCH: fix/quantum-shortcut-launch-repair-r1
      TARGET_RTM_SHA: 626fc0f37621fe6b54c459e774ebad0be0e2d859
      ARCHIVE_SHA256: 4b765bb92b837e22fa03bf55382ba64fad3154d76ff0d8d4980c41d87c492d1a
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Reconstruct exact seed archive
        shell: bash
        run: |
          set -euo pipefail
          cp tools/slr1-materialize-transform.py "$RUNNER_TEMP/transform.py"
          cat \
            tools/slr1-materializer-v2/part-01.b64 \
            tools/slr1-materializer-v2/part-02.b64 \
            tools/slr1-materializer/part-02.b64 \
            tools/slr1-materializer/part-03.b64 \
            | base64 --decode > "$RUNNER_TEMP/slr1.tar.xz"
          test "$(sha256sum "$RUNNER_TEMP/slr1.tar.xz" | cut -d' ' -f1)" = "$ARCHIVE_SHA256"

      - name: Checkout RTM-first target and apply implementation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$TARGET_RTM_SHA"
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          tar -xJf "$RUNNER_TEMP/slr1.tar.xz" -C .
          python3 "$RUNNER_TEMP/transform.py"
          cat > "$RUNNER_TEMP/expected.txt" <<'PATHS'
          .github/workflows/shortcut-launch-repair-r1.yml
          docs/evidence/ARTIFACT_MANIFEST_OVERLAY_SHORTCUT_LAUNCH_REPAIR_R1.json
          docs/evidence/SHORTCUT_LAUNCH_REPAIR_R1_DEFECT_REGISTER.json
          scripts/windows/install_home_local.ps1
          scripts/windows/one_click_home_local.ps1
          tests/integration_manifest_support_m8.py
          tests/test_plateau_m7_release_integration.py
          tests/test_shortcut_launch_repair_r1.py
          tests/test_windows_first_run_finance_center_r74.py
          tests/test_windows_one_click_installer_r1.py
          tests/test_wbr2_m5_closure.py
          tests/test_wbr2_m5_closure_corrective_r2.py
          PATHS
          sort -o "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/expected.txt"
          git add -- $(cat "$RUNNER_TEMP/expected.txt")
          git diff --cached --name-only | sort > "$RUNNER_TEMP/actual.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt"
          test "$(git diff --cached --name-only | wc -l)" = 12
          git config user.name quantum-redteam-bot
          git config user.email quantum-redteam-bot@users.noreply.github.com
          git commit -m "Repair installed shortcut and launcher paths"
          test "$(git rev-parse HEAD^)" = "$TARGET_RTM_SHA"
          mkdir -p "$RUNNER_TEMP/evidence"
          git rev-parse HEAD | tee "$RUNNER_TEMP/evidence/candidate-sha.txt"
          git rev-parse HEAD^{tree} | tee "$RUNNER_TEMP/evidence/tree-sha.txt"
          git diff-tree --no-commit-id --name-only -r HEAD | sort > "$RUNNER_TEMP/evidence/paths.txt"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.14"

      - name: Validate complete source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: setuptools==80.9.0
          python -m compileall -q src/quantum tests
          PYTHONPATH=src python -m unittest -v \
            tests.test_shortcut_launch_repair_r1 \
            tests.test_windows_one_click_installer_r1 \
            tests.test_tz_correction_and_exe_installer \
            tests.test_windows_first_run_finance_center_r74 \
            tests.test_plateau_m7_release_integration \
            2>&1 | tee "$RUNNER_TEMP/evidence/focused.log"
          PYTHONPATH=src python -m quantum.scripts.ci \
            2>&1 | tee "$RUNNER_TEMP/evidence/full-ci.log"
          git diff --exit-code
          git diff --cached --exit-code

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: SLR1-V2-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: warn
          retention-days: 3

      - name: Publish validated implementation
        shell: bash
        run: |
          git push origin "HEAD:refs/heads/$TARGET_BRANCH" \
            --force-with-lease="refs/heads/$TARGET_BRANCH:$TARGET_RTM_SHA"
