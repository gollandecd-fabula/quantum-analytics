name: WBR2 M5 Closure

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/wbr2-m5-closure.yml"
      - "docs/evidence/ARTIFACT_MANIFEST_OVERLAY_WBR2_M5_CLOSURE_R1.json"
      - "docs/evidence/WBR2_M5_CLOSURE_RTM.json"
      - "docs/evidence/WB_RELEASE_R2_EXECUTION_STATE.yaml"
      - "docs/governance/CURRENT_STATE.md"
      - "tests/integration_manifest_support_m8.py"
      - "tests/test_wbr2_m5_closure.py"

permissions:
  contents: read

concurrency:
  group: wbr2-m5-closure-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: 5e0e52c0141c5860ea108ba515a073094037ad72
  RTM_SHA: 23eeca02a4ccba8639760a7bb68f9acd43ae5846
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"

jobs:
  scope:
    name: Closure ancestry and scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 3
      - name: Assert exact head, ancestry and allow-list
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^)" = "$RTM_SHA"
          test "$(git rev-parse HEAD^^)" = "$BASE_SHA"
          test "$(git rev-list --count "$BASE_SHA"..HEAD)" = "2"
          mapfile -t actual < <(git diff --name-only "$BASE_SHA"..HEAD | sort)
          mapfile -t expected <<'EOF'
          .github/workflows/wbr2-m5-closure.yml
          docs/evidence/ARTIFACT_MANIFEST_OVERLAY_WBR2_M5_CLOSURE_R1.json
          docs/evidence/WBR2_M5_CLOSURE_RTM.json
          docs/evidence/WB_RELEASE_R2_EXECUTION_STATE.yaml
          docs/governance/CURRENT_STATE.md
          tests/integration_manifest_support_m8.py
          tests/test_wbr2_m5_closure.py
          EOF
          diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${actual[@]}")
          if printf '%s\n' "${actual[@]}" | grep -q '^src/'; then
            echo "Product runtime path changed during M5 closure" >&2
            exit 1
          fi

  linux:
    name: Closure Linux source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
      - name: Run focused closure contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          PYTHONPATH=src python3 -m unittest tests.test_wbr2_m5_closure -v
      - name: Run complete source CI
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 -m quantum.scripts.ci

  windows:
    name: Closure Windows source
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Disable Git CRLF conversion
        shell: pwsh
        run: git config --global core.autocrlf false
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
      - name: Set up Python 3.13.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.14"
      - name: Run focused closure contracts
        shell: pwsh
        run: |
          if ((& git rev-parse HEAD).Trim() -ne $env:TARGET_SHA) {
            throw "Exact-head mismatch."
          }
          $env:PYTHONPATH = (Resolve-Path "src").Path
          python -m unittest tests.test_wbr2_m5_closure -v
          if ($LASTEXITCODE -ne 0) {
            throw "WBR2 M5 closure Windows contracts failed."
          }
