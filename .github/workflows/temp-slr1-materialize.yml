name: Temporary SLR1 Materialize

on:
  pull_request:
    paths:
      - ".github/workflows/temp-slr1-materialize.yml"
      - "tools/slr1-materializer/**"
      - "tools/slr1-materializer-v2/**"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_BRANCH: fix/quantum-shortcut-launch-repair-r1
      TARGET_RTM_SHA: 626fc0f37621fe6b54c459e774ebad0be0e2d859
      ARCHIVE_SHA256: 4b765bb92b837e22fa03bf55382ba64fad3154d76ff0d8d4980c41d87c492d1a
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - name: Checkout exact materializer head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Reconstruct and verify implementation archive
        shell: bash
        run: |
          set -euo pipefail
          cat \
            tools/slr1-materializer-v2/part-01.b64 \
            tools/slr1-materializer-v2/part-02.b64 \
            tools/slr1-materializer/part-02.b64 \
            tools/slr1-materializer/part-03.b64 \
            | base64 --decode > "$RUNNER_TEMP/slr1.tar.xz"
          test "$(sha256sum "$RUNNER_TEMP/slr1.tar.xz" | cut -d' ' -f1)" = "$ARCHIVE_SHA256"
          tar -tJf "$RUNNER_TEMP/slr1.tar.xz" | sort > "$RUNNER_TEMP/archive-paths.txt"
          cat > "$RUNNER_TEMP/expected-paths.txt" <<'PATHS'
          .github/workflows/shortcut-launch-repair-r1.yml
          docs/evidence/ARTIFACT_MANIFEST_OVERLAY_SHORTCUT_LAUNCH_REPAIR_R1.json
          docs/evidence/SHORTCUT_LAUNCH_REPAIR_R1_DEFECT_REGISTER.json
          scripts/windows/install_home_local.ps1
          scripts/windows/one_click_home_local.ps1
          tests/integration_manifest_support_m8.py
          tests/test_shortcut_launch_repair_r1.py
          tests/test_wbr2_m5_closure.py
          tests/test_wbr2_m5_closure_corrective_r2.py
          tests/test_windows_one_click_installer_r1.py
          PATHS
          sort -o "$RUNNER_TEMP/expected-paths.txt" "$RUNNER_TEMP/expected-paths.txt"
          diff -u "$RUNNER_TEMP/expected-paths.txt" "$RUNNER_TEMP/archive-paths.txt"

      - name: Checkout exact RTM-first target
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$TARGET_RTM_SHA"
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$TARGET_RTM_SHA"

      - name: Apply implementation and prove exact scope
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf "$RUNNER_TEMP/slr1.tar.xz" -C .
          git add -- \
            .github/workflows/shortcut-launch-repair-r1.yml \
            docs/evidence/ARTIFACT_MANIFEST_OVERLAY_SHORTCUT_LAUNCH_REPAIR_R1.json \
            docs/evidence/SHORTCUT_LAUNCH_REPAIR_R1_DEFECT_REGISTER.json \
            scripts/windows/install_home_local.ps1 \
            scripts/windows/one_click_home_local.ps1 \
            tests/integration_manifest_support_m8.py \
            tests/test_shortcut_launch_repair_r1.py \
            tests/test_wbr2_m5_closure.py \
            tests/test_wbr2_m5_closure_corrective_r2.py \
            tests/test_windows_one_click_installer_r1.py
          git diff --cached --name-only | sort > "$RUNNER_TEMP/actual-paths.txt"
          diff -u "$RUNNER_TEMP/expected-paths.txt" "$RUNNER_TEMP/actual-paths.txt"
          test "$(git diff --cached --name-only | wc -l)" = 10

      - name: Create exact local implementation object
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "quantum-redteam-bot"
          git config user.email "quantum-redteam-bot@users.noreply.github.com"
          git commit -m "Repair installed shortcut and launcher paths"
          test "$(git rev-parse HEAD^)" = "$TARGET_RTM_SHA"
          mkdir -p "$RUNNER_TEMP/slr1-evidence"
          git rev-parse HEAD | tee "$RUNNER_TEMP/slr1-evidence/local-candidate-sha.txt"
          git rev-parse HEAD^{tree} | tee "$RUNNER_TEMP/slr1-evidence/tree-sha.txt"
          git diff-tree --no-commit-id --name-only -r HEAD | sort | tee "$RUNNER_TEMP/slr1-evidence/implementation-paths.txt"

      - name: Set up Python 3.13.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.14"

      - name: Validate focused contracts and complete source
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src/quantum tests 2>&1 | tee "$RUNNER_TEMP/slr1-evidence/compile.log"
          PYTHONPATH=src python -m unittest \
            tests.test_shortcut_launch_repair_r1 \
            tests.test_windows_one_click_installer_r1 \
            tests.test_tz_correction_and_exe_installer -v \
            2>&1 | tee "$RUNNER_TEMP/slr1-evidence/focused.log"
          PYTHONPATH=src python -m quantum.scripts.ci \
            2>&1 | tee "$RUNNER_TEMP/slr1-evidence/full-ci.log"
          test "$(git rev-parse HEAD^)" = "$TARGET_RTM_SHA"
          git diff --exit-code
          git diff --cached --exit-code

      - name: Upload validated evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: SLR1-Materialization-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/slr1-evidence
          if-no-files-found: warn
          retention-days: 3

      - name: Publish validated implementation commit
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:refs/heads/$TARGET_BRANCH" \
            --force-with-lease="refs/heads/$TARGET_BRANCH:$TARGET_RTM_SHA"
