name: Temporary SLR1 Materialize

on:
  pull_request:
    paths:
      - ".github/workflows/temp-slr1-materialize.yml"
      - "tools/slr1-materializer/**"
      - "tools/slr1-materializer-v2/**"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_BRANCH: fix/quantum-shortcut-launch-repair-r1
      TARGET_RTM_SHA: 626fc0f37621fe6b54c459e774ebad0be0e2d859
      ARCHIVE_SHA256: 4b765bb92b837e22fa03bf55382ba64fad3154d76ff0d8d4980c41d87c492d1a
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - name: Checkout exact materializer head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Reconstruct and verify seed implementation archive
        shell: bash
        run: |
          set -euo pipefail
          cat \
            tools/slr1-materializer-v2/part-01.b64 \
            tools/slr1-materializer-v2/part-02.b64 \
            tools/slr1-materializer/part-02.b64 \
            tools/slr1-materializer/part-03.b64 \
            | base64 --decode > "$RUNNER_TEMP/slr1.tar.xz"
          test "$(sha256sum "$RUNNER_TEMP/slr1.tar.xz" | cut -d' ' -f1)" = "$ARCHIVE_SHA256"
          tar -tJf "$RUNNER_TEMP/slr1.tar.xz" | sort > "$RUNNER_TEMP/archive-paths.txt"
          cat > "$RUNNER_TEMP/seed-paths.txt" <<'PATHS'
          .github/workflows/shortcut-launch-repair-r1.yml
          docs/evidence/ARTIFACT_MANIFEST_OVERLAY_SHORTCUT_LAUNCH_REPAIR_R1.json
          docs/evidence/SHORTCUT_LAUNCH_REPAIR_R1_DEFECT_REGISTER.json
          scripts/windows/install_home_local.ps1
          scripts/windows/one_click_home_local.ps1
          tests/integration_manifest_support_m8.py
          tests/test_shortcut_launch_repair_r1.py
          tests/test_wbr2_m5_closure.py
          tests/test_wbr2_m5_closure_corrective_r2.py
          tests/test_windows_one_click_installer_r1.py
          PATHS
          sort -o "$RUNNER_TEMP/seed-paths.txt" "$RUNNER_TEMP/seed-paths.txt"
          diff -u "$RUNNER_TEMP/seed-paths.txt" "$RUNNER_TEMP/archive-paths.txt"

      - name: Checkout exact RTM-first target
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$TARGET_RTM_SHA"
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$TARGET_RTM_SHA"

      - name: Apply seed implementation and superseding contracts
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf "$RUNNER_TEMP/slr1.tar.xz" -C .
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import re

          root = Path.cwd()
          r74 = root / "tests/test_windows_first_run_finance_center_r74.py"
          text = r74.read_text(encoding="utf-8")
          text = re.sub(
              r"    def test_installed_script_self_recovers_if_launcher_loses_skip_install\(self\) -> None:\n.*?(?=    def test_installed_launcher_always_uses_skip_install)",
              '''    def test_installed_script_self_recovers_if_launcher_loses_skip_install(self) -> None:\n        script = self.script\n        recovery = script.index('$selfRoot =')\n        branch = script.index('if ($SkipInstall) {', recovery)\n        recovery_block = script[recovery:branch]\n        self.assertLess(recovery, branch)\n        self.assertIn('Test-InstallationPackageLayout -Root $selfRoot', recovery_block)\n        self.assertIn('Get-InstalledRuntimeMissingComponents -Root $selfRoot', recovery_block)\n        self.assertIn('$SkipInstall = $true', recovery_block)\n        self.assertIn('$InstalledRoot = $selfRoot', recovery_block)\n        self.assertIn('Assert-InstalledRuntimeLayout -Root $selfRoot', recovery_block)\n        self.assertNotIn('$hasInstalledMarker', recovery_block)\n\n''',
              text,
              flags=re.S,
          )
          text = re.sub(
              r"    def test_installed_launcher_always_uses_skip_install\(self\) -> None:\n.*?(?=    def test_explicit_file_and_noninteractive_import_paths_remain_available)",
              '''    def test_installed_launcher_always_uses_skip_install(self) -> None:\n        installer = self.installer\n        self.assertIn(\n            'for %%I in ("%~dp0.") do set "QUANTUM_ROOT=%%~fI"',\n            installer,\n        )\n        self.assertIn(\n            'one_click_home_local.ps1" -InstalledRoot "%QUANTUM_ROOT%" -SkipInstall %*',\n            installer,\n        )\n        self.assertNotIn('-InstalledRoot "%~dp0" -SkipInstall', installer)\n\n''',
              text,
              flags=re.S,
          )
          if "$installedCandidate" in text or '$installedMarkers = @(' in text:
              raise SystemExit("R74_OLD_MARKER_CONTRACT_REMAINS")
          r74.write_text(text, encoding="utf-8")

          m7 = root / "tests/test_plateau_m7_release_integration.py"
          text = m7.read_text(encoding="utf-8")
          text = re.sub(
              r"    def test_installed_copy_detection_is_resilient\(self\) -> None:\n.*?(?=    def test_release_gate_targets_desktop_not_legacy_http)",
              '''    def test_installed_copy_detection_is_resilient(self) -> None:\n        text = (\n            ROOT / "scripts/windows/one_click_home_local.ps1"\n        ).read_text(encoding="ascii")\n        self.assertIn("function Test-InstallationPackageLayout", text)\n        self.assertIn("function Get-InstalledRuntimeMissingComponents", text)\n        self.assertIn("function Assert-InstalledRuntimeLayout", text)\n        self.assertIn("Test-InstallationPackageLayout -Root $selfRoot", text)\n        self.assertIn("Get-InstalledRuntimeMissingComponents -Root $selfRoot", text)\n        self.assertIn("$SkipInstall = $true", text)\n        self.assertIn("$InstalledRoot = $selfRoot", text)\n        self.assertNotIn("$hasInstalledMarker", text)\n\n''',
              text,
              flags=re.S,
          )
          if '$installedMarkers = @(' in text:
              raise SystemExit("M7_OLD_MARKER_CONTRACT_REMAINS")
          m7.write_text(text, encoding="utf-8")

          workflow = root / ".github/workflows/shortcut-launch-repair-r1.yml"
          text = workflow.read_text(encoding="utf-8")
          for marker in (
              '      - "tests/test_windows_first_run_finance_center_r74.py"\n',
              '      - "tests/test_plateau_m7_release_integration.py"\n',
          ):
              if marker not in text:
                  text = text.replace(
                      '      - "tests/test_shortcut_launch_repair_r1.py"\n',
                      '      - "tests/test_shortcut_launch_repair_r1.py"\n' + marker,
                  )
          for marker in (
              '          tests/test_windows_first_run_finance_center_r74.py\n',
              '          tests/test_plateau_m7_release_integration.py\n',
          ):
              if marker not in text:
                  text = text.replace(
                      '          tests/test_shortcut_launch_repair_r1.py\n',
                      '          tests/test_shortcut_launch_repair_r1.py\n' + marker,
                  )
          if 'tests.test_windows_first_run_finance_center_r74' not in text:
              text = text.replace(
                  '            tests.test_shortcut_launch_repair_r1 \\\n',
                  '            tests.test_shortcut_launch_repair_r1 \\\n'
                  '            tests.test_windows_first_run_finance_center_r74 \\\n'
                  '            tests.test_plateau_m7_release_integration \\\n',
              )
              text = text.replace(
                  '            tests.test_shortcut_launch_repair_r1 `\n',
                  '            tests.test_shortcut_launch_repair_r1 `\n'
                  '            tests.test_windows_first_run_finance_center_r74 `\n'
                  '            tests.test_plateau_m7_release_integration `\n',
              )
          workflow.write_text(text, encoding="utf-8")

          overlay_path = root / "docs/evidence/ARTIFACT_MANIFEST_OVERLAY_SHORTCUT_LAUNCH_REPAIR_R1.json"
          overlay = json.loads(overlay_path.read_text(encoding="utf-8"))
          manifest_paths = [
              ".github/workflows/shortcut-launch-repair-r1.yml",
              "docs/evidence/SHORTCUT_LAUNCH_REPAIR_R1_DEFECT_REGISTER.json",
              "docs/evidence/SHORTCUT_LAUNCH_REPAIR_R1_RTM.json",
              "scripts/windows/install_home_local.ps1",
              "scripts/windows/one_click_home_local.ps1",
              "tests/integration_manifest_support_m8.py",
              "tests/test_plateau_m7_release_integration.py",
              "tests/test_shortcut_launch_repair_r1.py",
              "tests/test_windows_first_run_finance_center_r74.py",
              "tests/test_windows_one_click_installer_r1.py",
              "tests/test_wbr2_m5_closure.py",
              "tests/test_wbr2_m5_closure_corrective_r2.py",
          ]
          overlay["entries"] = []
          for relative in manifest_paths:
              payload = (root / relative).read_bytes()
              overlay["entries"].append(
                  [relative, hashlib.sha256(payload).hexdigest(), len(payload)]
              )
          overlay_path.write_text(
              json.dumps(overlay, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Prove final implementation scope
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/expected-paths.txt" <<'PATHS'
          .github/workflows/shortcut-launch-repair-r1.yml
          docs/evidence/ARTIFACT_MANIFEST_OVERLAY_SHORTCUT_LAUNCH_REPAIR_R1.json
          docs/evidence/SHORTCUT_LAUNCH_REPAIR_R1_DEFECT_REGISTER.json
          scripts/windows/install_home_local.ps1
          scripts/windows/one_click_home_local.ps1
          tests/integration_manifest_support_m8.py
          tests/test_plateau_m7_release_integration.py
          tests/test_shortcut_launch_repair_r1.py
          tests/test_windows_first_run_finance_center_r74.py
          tests/test_windows_one_click_installer_r1.py
          tests/test_wbr2_m5_closure.py
          tests/test_wbr2_m5_closure_corrective_r2.py
          PATHS
          sort -o "$RUNNER_TEMP/expected-paths.txt" "$RUNNER_TEMP/expected-paths.txt"
          git add -- $(cat "$RUNNER_TEMP/expected-paths.txt")
          git diff --cached --name-only | sort > "$RUNNER_TEMP/actual-paths.txt"
          diff -u "$RUNNER_TEMP/expected-paths.txt" "$RUNNER_TEMP/actual-paths.txt"
          test "$(git diff --cached --name-only | wc -l)" = 12

      - name: Create exact local implementation object
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "quantum-redteam-bot"
          git config user.email "quantum-redteam-bot@users.noreply.github.com"
          git commit -m "Repair installed shortcut and launcher paths"
          test "$(git rev-parse HEAD^)" = "$TARGET_RTM_SHA"
          mkdir -p "$RUNNER_TEMP/slr1-evidence"
          git rev-parse HEAD | tee "$RUNNER_TEMP/slr1-evidence/local-candidate-sha.txt"
          git rev-parse HEAD^{tree} | tee "$RUNNER_TEMP/slr1-evidence/tree-sha.txt"
          git diff-tree --no-commit-id --name-only -r HEAD | sort | tee "$RUNNER_TEMP/slr1-evidence/implementation-paths.txt"

      - name: Set up Python 3.13.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.14"

      - name: Install pinned build backend
        shell: bash
        run: python -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: setuptools==80.9.0

      - name: Validate focused contracts and complete source
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src/quantum tests 2>&1 | tee "$RUNNER_TEMP/slr1-evidence/compile.log"
          PYTHONPATH=src python -m unittest \
            tests.test_shortcut_launch_repair_r1 \
            tests.test_windows_one_click_installer_r1 \
            tests.test_tz_correction_and_exe_installer \
            tests.test_windows_first_run_finance_center_r74 \
            tests.test_plateau_m7_release_integration -v \
            2>&1 | tee "$RUNNER_TEMP/slr1-evidence/focused.log"
          PYTHONPATH=src python -m quantum.scripts.ci \
            2>&1 | tee "$RUNNER_TEMP/slr1-evidence/full-ci.log"
          test "$(git rev-parse HEAD^)" = "$TARGET_RTM_SHA"
          git diff --exit-code
          git diff --cached --exit-code

      - name: Upload validated evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: SLR1-Materialization-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/slr1-evidence
          if-no-files-found: warn
          retention-days: 3

      - name: Publish validated implementation commit
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:refs/heads/$TARGET_BRANCH" \
            --force-with-lease="refs/heads/$TARGET_BRANCH:$TARGET_RTM_SHA"
