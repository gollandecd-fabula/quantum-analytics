name: XLSX Namespace Fallback R1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/xlsx-namespace-fallback-r1.yml"
      - "docs/evidence/ARTIFACT_MANIFEST_OVERLAY_XLSX_NAMESPACE_FALLBACK_R1.json"
      - "docs/evidence/XLSX_NAMESPACE_FALLBACK_R1_DEFECT_REGISTER.json"
      - "docs/evidence/XLSX_NAMESPACE_FALLBACK_R1_RTM.json"
      - "docs/evidence/WB_RELEASE_R2_EXECUTION_STATE.yaml"
      - "docs/governance/CURRENT_STATE.md"
      - "src/quantum/application/_finance_center_pages.py"
      - "src/quantum/application/_finance_center_queue_runtime.py"
      - "src/quantum/application/_finance_schema_review.py"
      - "src/quantum/pilot/universal_intake.py"
      - "src/quantum/pilot/universal_tables.py"
      - "tests/integration_manifest_support_m8.py"
      - "tests/test_xlsx_namespace_fallback_r1.py"
      - "tests/test_wbr2_m5_closure.py"
      - "tests/test_wbr2_m5_closure_corrective_r2.py"

permissions:
  contents: read

env:
  TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: a4e7957c661f46f87c408da7f347fcbbcdc49414
  RTM_SHA: ccc07dcb0a016768b3a287d61fb854760e30891c
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"

jobs:
  scope:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {ref: "${{ env.TARGET_SHA }}", fetch-depth: 3}
      - name: Assert RTM-first scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$RTM_SHA"
          test "$(git rev-parse HEAD^^)" = "$BASE_SHA"
          test "$(git rev-list --count "$BASE_SHA"..HEAD)" = 2
          test "$(git diff --name-only HEAD^^..HEAD^)" = "docs/evidence/XLSX_NAMESPACE_FALLBACK_R1_RTM.json"
          mapfile -t actual < <(git diff --name-only "$BASE_SHA"..HEAD | sort)
          mapfile -t expected <<'EOF'
          .github/workflows/xlsx-namespace-fallback-r1.yml
          docs/evidence/ARTIFACT_MANIFEST_OVERLAY_XLSX_NAMESPACE_FALLBACK_R1.json
          docs/evidence/XLSX_NAMESPACE_FALLBACK_R1_DEFECT_REGISTER.json
          docs/evidence/XLSX_NAMESPACE_FALLBACK_R1_RTM.json
          docs/evidence/WB_RELEASE_R2_EXECUTION_STATE.yaml
          docs/governance/CURRENT_STATE.md
          src/quantum/application/_finance_center_pages.py
          src/quantum/application/_finance_center_queue_runtime.py
          src/quantum/application/_finance_schema_review.py
          src/quantum/pilot/universal_intake.py
          src/quantum/pilot/universal_tables.py
          tests/integration_manifest_support_m8.py
          tests/test_wbr2_m5_closure.py
          tests/test_wbr2_m5_closure_corrective_r2.py
          tests/test_xlsx_namespace_fallback_r1.py
          EOF
          diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${actual[@]}")
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {ref: "${{ env.TARGET_SHA }}", fetch-depth: 1}
      - run: python3 -m compileall -q src/quantum
      - run: PYTHONPATH=src python3 -m unittest -v tests.test_xlsx_namespace_fallback_r1 tests.test_plateau_m4_schema_review tests.test_xlsx_real_office_compat tests.test_universal_partial_r1 tests.test_universal_any_file_contract_r4 tests.test_universal_ingestion_r4 tests.test_universal_intake_hardening_r4
      - run: PYTHONPATH=src python3 -m quantum.scripts.ci
      - run: |
          grep -q 'marketplace_writes: DISABLED' docs/evidence/WB_RELEASE_R2_EXECUTION_STATE.yaml
          grep -q 'ozon: DEFERRED' docs/evidence/WB_RELEASE_R2_EXECUTION_STATE.yaml
          grep -q 'gatekeeper: DISCONNECTED' docs/evidence/WB_RELEASE_R2_EXECUTION_STATE.yaml
  windows:
    runs-on: windows-2025
    steps:
      - shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {ref: "${{ env.TARGET_SHA }}", fetch-depth: 1}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.13.14"}
      - shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: setuptools==80.9.0
          python -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r requirements/windows-home-local.txt
      - shell: pwsh
        run: |
          $env:PYTHONPATH = (Resolve-Path "src").Path
          python -m unittest -v tests.test_xlsx_namespace_fallback_r1 tests.test_plateau_m4_schema_review tests.test_finance_center_queue_hotfix tests.test_xlsx_real_office_compat tests.test_universal_partial_r1
          if ($LASTEXITCODE -ne 0) { throw "XNF1 focused failed" }
          python -m quantum.scripts.ci
          if ($LASTEXITCODE -ne 0) { throw "XNF1 full CI failed" }
