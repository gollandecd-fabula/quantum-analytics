name: Apply M2 R96 V2 Exact Delta

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'tmp/quantum-m2-r96-stage'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact staging head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python 3.13.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.14'
      - name: Verify, apply and test exact delta
        shell: bash
        env:
          STAGE_BRANCH: tmp/quantum-m2-r96-stage
        run: |
          set -euo pipefail
          test "$(find tools -maxdepth 1 -type f -name 'm2_r96_v2_part_*.txt' | wc -l)" -eq 3
          cat tools/m2_r96_v2_part_00.txt tools/m2_r96_v2_part_01.txt tools/m2_r96_v2_part_02.txt > "$RUNNER_TEMP/r96v2.b64"
          test "$(wc -c < "$RUNNER_TEMP/r96v2.b64")" -eq 15216
          test "$(sha256sum "$RUNNER_TEMP/r96v2.b64" | awk '{print $1}')" = 'ca5564de11037cb98437483b09730738202f1b447e9cfcbb78e03dce06425755'
          base64 -d "$RUNNER_TEMP/r96v2.b64" > "$RUNNER_TEMP/r96v2.tar.gz"
          test "$(wc -c < "$RUNNER_TEMP/r96v2.tar.gz")" -eq 11411
          test "$(sha256sum "$RUNNER_TEMP/r96v2.tar.gz" | awk '{print $1}')" = 'ada18a702212c57997fad0d0bfb6dc24fdb8a50071e2cfb93df4c1d20785c51d'
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, tarfile
          expected = {
            'src/quantum/application/_finance_center_calculation.py': (25208, '868baf9a874c7381618fdea6e195e38f05d814f1d5255dd2eba6d4ef797f164e'),
            'tests/test_m2_runtime_dependency_modernization.py': (7152, '103d6e00c14db3cbfd2e63cb6e9aacacdd6e48691946027a2b758b086d7f2685'),
            'docs/evidence/M2_RUNTIME_DEPENDENCY_MODERNIZATION_RTM.json': (2207, 'd7468ee8efc428c1b72b455989ea379a86d2f413c1cf0ab6dcb8971a794ce303'),
            'docs/evidence/M2_RUNTIME_DEPENDENCY_MODERNIZATION_CORRECTION_R96.json': (1713, 'e56a2dd43bd3c5a0866e7ec86f2b224368ce81509b2a523d822493f1e4c9b142'),
            'docs/evidence/ARTIFACT_MANIFEST_OVERLAY_PILOT_INTEGRATION_R96.json': (1947, '9e009ff6801eb840574460f6a8225110243d5f913e1fb7e8b6312a9f1596b73b'),
          }
          archive_path = Path(__import__('os').environ['RUNNER_TEMP']) / 'r96v2.tar.gz'
          with tarfile.open(archive_path, 'r:gz') as archive:
              names=[]
              for member in archive.getmembers():
                  pure=PurePosixPath(member.name)
                  if pure.is_absolute() or '..' in pure.parts or member.issym() or member.islnk() or member.isdev():
                      raise SystemExit(f'UNSAFE_MEMBER:{member.name}')
                  if member.isfile(): names.append(member.name)
              if set(names) != set(expected): raise SystemExit(f'MEMBER_SET_MISMATCH:{names}')
              archive.extractall(Path.cwd(), filter='data')
          for rel,(size,digest) in expected.items():
              data=Path(rel).read_bytes()
              if len(data)!=size or hashlib.sha256(data).hexdigest()!=digest:
                  raise SystemExit(f'FILE_MISMATCH:{rel}')
          PY
          git rm -f tools/m2_r96_v2_part_*.txt
          export PYTHONPATH="$PWD/src"
          export PYTHONDONTWRITEBYTECODE=1
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/m2-r96-v2-pycache"
          python -m compileall -q src
          python -m unittest tests.test_m2_runtime_dependency_modernization -v
          python -m unittest \
            tests.test_quantum_reaudit_plateau_r1.QuantumReauditPlateauR1Tests.test_output_bundle_is_transactional_unique_and_governed \
            tests.test_quantum_reaudit_plateau_r1.QuantumReauditPlateauR1Tests.test_recommendations_are_human_readable_and_keep_code \
            tests.test_quantum_reaudit_plateau_r1.QuantumReauditPlateauR1Tests.test_concurrent_output_names_do_not_collide -v
          python -m quantum.scripts.ci
          git add -A
          git config user.name quantum-m2-r96-v2-bot
          git config user.email quantum-m2-r96-v2-bot@users.noreply.github.com
          git commit -m 'fix(m2): use write-capable handle for Windows durability fsync'
          git push origin "HEAD:$STAGE_BRANCH"
