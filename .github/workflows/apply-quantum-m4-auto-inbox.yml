name: Apply Quantum M4 Auto Inbox

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'tmp/quantum-m4-stage'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact M4 staging head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.13.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.14'

      - name: Verify, apply and test exact M4 payload
        shell: bash
        env:
          M3_HEAD: f6df81ee62f7ee419c0303886362d917b6d82103
          STAGE_BRANCH: tmp/quantum-m4-stage
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/m4-apply.log") 2>&1
          test "$(git merge-base HEAD "$M3_HEAD")" = "$M3_HEAD"
          python - <<'PYCODE'
          from __future__ import annotations
          import base64
          import hashlib
          import io
          import subprocess
          import tarfile
          from pathlib import Path, PurePosixPath

          root = Path.cwd()
          parts = [root / "tools" / f"m4_payload_part_{index:02d}.txt" for index in range(3)]
          actual = sorted((root / "tools").glob("m4_payload_part_*.txt"))
          if actual != parts:
              raise SystemExit(f"M4_PART_SET_MISMATCH:{[path.name for path in actual]}")
          expected_parts = (
              (16000, "e036b17246c7c24b9a1caf1de2006c71be1f88fcda2faeb1e974ed78cf57c35a"),
              (16000, "02826a878e436c3c5105d1109e27bb526e3cf751a51e053162f62a2a2fdcc131"),
              (4660, "6ff080f6536d31eb01b4d98caff4ca960da7f5b80be81d96c6723ffe305a923d"),
          )
          for path, (size, digest) in zip(parts, expected_parts, strict=True):
              data = path.read_bytes()
              if len(data) != size or hashlib.sha256(data).hexdigest() != digest:
                  raise SystemExit(f"M4_PART_MISMATCH:{path.name}")
          encoded = b"".join(path.read_bytes() for path in parts)
          if len(encoded) != 36660:
              raise SystemExit(f"M4_BASE64_SIZE_MISMATCH:{len(encoded)}")
          if hashlib.sha256(encoded).hexdigest() != "31c3a942bbd334f144b8476365aaf4545472b2fcf190ea85da00d6c0dcceed48":
              raise SystemExit("M4_BASE64_SHA256_MISMATCH")
          payload = base64.b64decode(encoded, validate=True)
          if len(payload) != 27494:
              raise SystemExit(f"M4_TAR_SIZE_MISMATCH:{len(payload)}")
          if hashlib.sha256(payload).hexdigest() != "f24b2e31246d36ac78db92dbbbd2e77e6eab27d2bf195d72b7b60d2e4a375b18":
              raise SystemExit("M4_TAR_SHA256_MISMATCH")
          expected = {
              ".github/workflows/m4-auto-inbox.yml",
              "src/quantum/application/_finance_center_auto_inbox.py",
              "src/quantum/application/finance_center.py",
              "src/quantum/application/_finance_center_shell.py",
              "src/quantum/application/_finance_center_queue_runtime.py",
              "src/quantum/application/_finance_center_pages.py",
              "tests/test_m4_auto_inbox.py",
              "tests/integration_manifest_support_m8.py",
              "docs/evidence/M4_AUTO_INBOX_RTM.json",
              "docs/evidence/ARTIFACT_MANIFEST_OVERLAY_PILOT_INTEGRATION_R98.json",
          }
          with tarfile.open(fileobj=io.BytesIO(payload), mode="r:gz") as archive:
              names: set[str] = set()
              for member in archive.getmembers():
                  pure = PurePosixPath(member.name)
                  if (
                      pure.is_absolute()
                      or ".." in pure.parts
                      or member.issym()
                      or member.islnk()
                      or member.isdev()
                  ):
                      raise SystemExit(f"M4_UNSAFE_MEMBER:{member.name}")
                  if member.isfile():
                      names.add(member.name)
              if names != expected:
                  raise SystemExit(f"M4_MEMBER_SET_MISMATCH:{sorted(names)}")
              archive.extractall(root, filter="data")
          for part in parts:
              subprocess.run(
                  ["git", "rm", "-f", "--", str(part.relative_to(root))],
                  check=True,
              )
          PYCODE

          git add -A
          python - <<'PYCODE'
          import subprocess
          expected = {
              ".github/workflows/m4-auto-inbox.yml",
              "src/quantum/application/_finance_center_auto_inbox.py",
              "src/quantum/application/finance_center.py",
              "src/quantum/application/_finance_center_shell.py",
              "src/quantum/application/_finance_center_queue_runtime.py",
              "src/quantum/application/_finance_center_pages.py",
              "tests/test_m4_auto_inbox.py",
              "tests/integration_manifest_support_m8.py",
              "docs/evidence/M4_AUTO_INBOX_RTM.json",
              "docs/evidence/ARTIFACT_MANIFEST_OVERLAY_PILOT_INTEGRATION_R98.json",
          }
          actual = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", "f6df81ee62f7ee419c0303886362d917b6d82103"],
                  text=True,
              ).splitlines()
          )
          if actual != expected:
              raise SystemExit(
                  f"M4_ALLOWLIST_MISMATCH:missing={sorted(expected-actual)};extra={sorted(actual-expected)}"
              )
          PYCODE

          export PYTHONPATH="$PWD/src"
          export PYTHONDONTWRITEBYTECODE=1
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/m4-apply-pycache"
          python -m compileall -q src tests/test_m4_auto_inbox.py
          python -m unittest tests.test_m4_auto_inbox -v
          python -m quantum.scripts.ci
          git config user.name quantum-m4-auto-inbox-bot
          git config user.email quantum-m4-auto-inbox-bot@users.noreply.github.com
          git commit -m 'feat(quantum): add governed M4 automatic incoming folder R98'
          {
            echo "M3_HEAD=$M3_HEAD"
            echo "M4_CONSTRUCTION_COMMIT=$(git rev-parse HEAD)"
            echo "M4_CONSTRUCTION_TREE=$(git rev-parse 'HEAD^{tree}')"
            echo "M4_CHANGED_COUNT=$(git diff --name-only "$M3_HEAD" HEAD | wc -l)"
          } | tee m4-commit-metadata.txt
          git push origin "HEAD:$STAGE_BRANCH" || echo "M4_ACTIONS_PUSH=FAILED" | tee -a m4-commit-metadata.txt

      - name: Copy apply log
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/m4-apply.log" ]; then
            cp "$RUNNER_TEMP/m4-apply.log" "$GITHUB_WORKSPACE/m4-apply.log"
          fi

      - name: Upload M4 applicator evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: M4-Applicator-Evidence
          path: |
            m4-apply.log
            m4-commit-metadata.txt
          if-no-files-found: warn
          retention-days: 2
