name: M4 Corrective R99

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/m4-corrective-r99.yml"
      - "src/quantum/application/_finance_center_auto_inbox_corrective.py"
      - "src/quantum/application/finance_center.py"
      - "tests/test_m4_auto_inbox_corrective.py"
      - "tests/integration_manifest_support_m8.py"
      - "docs/evidence/M4_CORRECTIVE_EXECUTION_REGISTER_R99.json"
      - "docs/evidence/ARTIFACT_MANIFEST_OVERLAY_PILOT_INTEGRATION_R99.json"

permissions:
  contents: read

concurrency:
  group: m4-corrective-r99-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"

jobs:
  linux:
    name: M4 corrective Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
      - name: Assert exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Run corrective and original M4 contracts
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 -m unittest             tests.test_m4_auto_inbox_corrective             tests.test_m4_auto_inbox -v
      - name: Run complete source CI
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 -m quantum.scripts.ci

  windows:
    name: M4 corrective Windows
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Disable Git CRLF conversion
        shell: pwsh
        run: git config --global core.autocrlf false
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
      - name: Set up Python 3.13.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.14"
      - name: Install pinned dependencies
        shell: pwsh
        run: |
          if ((& git rev-parse HEAD).Trim() -ne $env:TARGET_SHA) {
            throw "Exact-head mismatch."
          }
          python -m pip install `
            --disable-pip-version-check `
            --no-input `
            --no-deps `
            --only-binary=:all: `
            --require-hashes `
            -r requirements/windows-home-local.txt
          if ($LASTEXITCODE -ne 0) {
            throw "Pinned dependency installation failed."
          }
      - name: Run corrective and original M4 contracts
        shell: pwsh
        run: |
          $env:PYTHONPATH = (Resolve-Path "src").Path
          python -m unittest `
            tests.test_m4_auto_inbox_corrective `
            tests.test_m4_auto_inbox -v
          if ($LASTEXITCODE -ne 0) {
            throw "M4 corrective contracts failed."
          }
