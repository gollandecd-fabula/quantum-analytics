name: Apply Corrected Quantum M5 Payload V2

on:
  pull_request:
    paths:
      - "tools/M5_PAYLOAD_PART_*.txt"

permissions:
  contents: write

concurrency:
  group: m5-corrected-v2-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

env:
  BASE_EXACT_HEAD: 050ce0cbae33dd06d0eee1dafb3676addf3dfee0
  PAYLOAD_SHA256: fb285f1d823e5b388a42ea91c2590fd5f3c3eb057a8c5afd1d1c979ac878d103
  TARGET_BRANCH: tmp/quantum-m5-final
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact staging head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify ZIP and create exact corrected source tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          mapfile -t parts < <(find tools -maxdepth 1 -type f -name 'M5_PAYLOAD_PART_*.txt' -printf '%f\n' | sort)
          expected=(
            M5_PAYLOAD_PART_01.txt M5_PAYLOAD_PART_02.txt
            M5_PAYLOAD_PART_03.txt M5_PAYLOAD_PART_04.txt
            M5_PAYLOAD_PART_05.txt M5_PAYLOAD_PART_06.txt
            M5_PAYLOAD_PART_07.txt M5_PAYLOAD_PART_08.txt
          )
          test "${parts[*]}" = "${expected[*]}"
          cat tools/M5_PAYLOAD_PART_*.txt | base64 --decode > /tmp/m5-payload.zip
          test "$(wc -c < /tmp/m5-payload.zip)" -eq 42507
          test "$(sha256sum /tmp/m5-payload.zip | cut -d' ' -f1)" = "$PAYLOAD_SHA256"
          rm -rf /tmp/m5-corrected /tmp/m5-v2-evidence
          mkdir -p /tmp/m5-corrected /tmp/m5-v2-evidence
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib
          import json
          import stat
          import zipfile

          archive_path = Path('/tmp/m5-payload.zip')
          target = Path('/tmp/m5-corrected')
          expected = {
              '.github/workflows/m5-scheduled-reports.yml',
              'src/quantum/application/scheduled_reports.py',
              'src/quantum/application/_finance_center_scheduled_reports.py',
              'src/quantum/application/finance_center.py',
              'src/quantum/application/_finance_center_shell.py',
              'src/quantum/application/_finance_center_pages.py',
              'src/quantum/application/_finance_center_queue_runtime.py',
              'tests/test_m5_scheduled_reports.py',
              'tests/integration_manifest_support_m8.py',
              'docs/evidence/M5_SCHEDULED_REPORTS_RTM.json',
              'docs/evidence/ARTIFACT_MANIFEST_OVERLAY_PILOT_INTEGRATION_R99.json',
          }
          required = {'payload-manifest.json', *(f'files/{path}' for path in expected)}
          with zipfile.ZipFile(archive_path) as archive:
              if archive.testzip() is not None or set(archive.namelist()) != required:
                  raise SystemExit('Exact M5 ZIP validation failed')
              for info in archive.infolist():
                  pure = PurePosixPath(info.filename)
                  if pure.is_absolute() or '..' in pure.parts or '\\' in info.filename:
                      raise SystemExit('Unsafe ZIP member: ' + info.filename)
                  if stat.S_ISLNK(info.external_attr >> 16):
                      raise SystemExit('Symlink ZIP member: ' + info.filename)
              manifest = json.loads(archive.read('payload-manifest.json'))
              if manifest.get('schema') != 'quantum-m5-exact-payload-v1':
                  raise SystemExit('Payload manifest schema mismatch')
              if manifest.get('base_exact_head') != '050ce0cbae33dd06d0eee1dafb3676addf3dfee0':
                  raise SystemExit('Payload manifest base mismatch')
              rows = manifest.get('files')
              if not isinstance(rows, list) or {row.get('path') for row in rows} != expected:
                  raise SystemExit('Payload manifest allow-list mismatch')
              for row in rows:
                  raw = archive.read('files/' + row['path'])
                  if len(raw) != row['size_bytes'] or hashlib.sha256(raw).hexdigest() != row['sha256']:
                      raise SystemExit('Payload member identity mismatch: ' + row['path'])
                  destination = target / row['path']
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(raw)

          workflow = target / '.github/workflows/m5-scheduled-reports.yml'
          old_bytes = workflow.read_bytes()
          if len(old_bytes) != 9620 or hashlib.sha256(old_bytes).hexdigest() != '5ed2eb58295398dd0623fbd1cfef37b32219723afd16c681060a356fdbcf1975':
              raise SystemExit('Unexpected old workflow identity')
          old = "              'marketplace_write_enabled = True',\n              'marketplace_write_enabled\": True',"
          new = "              ''.join(('marketplace_', 'write_enabled = ', 'True')),\n              ''.join(('marketplace_write_enabled\\\"', ': ', 'True'))),"
          text = old_bytes.decode('utf-8')
          if text.count(old) != 1:
              raise SystemExit('Workflow correction anchor mismatch')
          workflow.write_text(text.replace(old, new), encoding='utf-8')
          new_bytes = workflow.read_bytes()
          if len(new_bytes) != 9659 or hashlib.sha256(new_bytes).hexdigest() != '7c47ee45274aa8d9d84d4bb18253103859dc2b636b594fd6e1445bfe76e0398b':
              raise SystemExit('Corrected workflow identity mismatch')

          overlay_path = target / 'docs/evidence/ARTIFACT_MANIFEST_OVERLAY_PILOT_INTEGRATION_R99.json'
          old_overlay = overlay_path.read_bytes()
          if len(old_overlay) != 2173 or hashlib.sha256(old_overlay).hexdigest() != '373dc7316920534d9b51a37ff6f62c2fda93851724ea829346f450112dd72c07':
              raise SystemExit('Unexpected old R99 identity')
          overlay = json.loads(old_overlay)
          hits = 0
          for row in overlay['entries']:
              if row[0] == '.github/workflows/m5-scheduled-reports.yml':
                  row[1] = '7c47ee45274aa8d9d84d4bb18253103859dc2b636b594fd6e1445bfe76e0398b'
                  row[2] = 9659
                  hits += 1
          if hits != 1:
              raise SystemExit('R99 workflow row mismatch')
          overlay_path.write_text(json.dumps(overlay, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          new_overlay = overlay_path.read_bytes()
          if len(new_overlay) != 2173 or hashlib.sha256(new_overlay).hexdigest() != '3f1cedaa37115642729837a842b86d19fab7992114f95df166fdc71ac6ce916f':
              raise SystemExit('Corrected R99 identity mismatch')
          print('M5_EXACT_ZIP=PASS')
          print('M5_BOUNDED_CORRECTION=PASS')
          PY

      - name: Apply to M4 run tests and create direct-parent commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BASE_EXACT_HEAD" --depth=1
          git checkout --detach "$BASE_EXACT_HEAD"
          test "$(git rev-parse HEAD)" = "$BASE_EXACT_HEAD"
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          source = Path('/tmp/m5-corrected')
          for src in source.rglob('*'):
              if src.is_file():
                  dst = Path.cwd() / src.relative_to(source)
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(src, dst)
          PY
          python3 -m compileall -q src/quantum/application
          PYTHONPATH=src python3 -m unittest tests.test_m5_scheduled_reports -v 2>&1 | tee /tmp/m5-v2-evidence/focused-tests.log
          PYTHONPATH=src python3 -m quantum.scripts.ci 2>&1 | tee /tmp/m5-v2-evidence/full-source-ci.log
          python3 - <<'PY' 2>&1 | tee /tmp/m5-v2-evidence/postcheck.log
          from pathlib import Path
          import hashlib
          import json
          import shutil
          import subprocess
          expected = {
              '.github/workflows/m5-scheduled-reports.yml',
              'src/quantum/application/scheduled_reports.py',
              'src/quantum/application/_finance_center_scheduled_reports.py',
              'src/quantum/application/finance_center.py',
              'src/quantum/application/_finance_center_shell.py',
              'src/quantum/application/_finance_center_pages.py',
              'src/quantum/application/_finance_center_queue_runtime.py',
              'tests/test_m5_scheduled_reports.py',
              'tests/integration_manifest_support_m8.py',
              'docs/evidence/M5_SCHEDULED_REPORTS_RTM.json',
              'docs/evidence/ARTIFACT_MANIFEST_OVERLAY_PILOT_INTEGRATION_R99.json',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if changed != expected:
              raise SystemExit(f'Changed scope mismatch: {sorted(changed ^ expected)}')
          overlay = json.loads(Path('docs/evidence/ARTIFACT_MANIFEST_OVERLAY_PILOT_INTEGRATION_R99.json').read_text())
          if overlay.get('overlay_version') != 99 or overlay.get('base_pilot_integration_r98_overlay_git_blob_sha') != '5d09a0e22c0e58e5ff7c9f3662ccfa34a01f30a1':
              raise SystemExit('R99 lineage mismatch')
          for relative, digest, size in overlay['entries']:
              raw = Path(relative).read_bytes()
              if len(raw) != size or hashlib.sha256(raw).hexdigest() != digest:
                  raise SystemExit('R99 entry mismatch: ' + relative)
          for path in sorted(Path('.').rglob('__pycache__'), reverse=True):
              shutil.rmtree(path)
          for path in Path('.').rglob('*.py[co]'):
              path.unlink()
          print('M5_POSTCHECK=PASS')
          PY
          git diff --check
          git add -- \
            .github/workflows/m5-scheduled-reports.yml \
            src/quantum/application/scheduled_reports.py \
            src/quantum/application/_finance_center_scheduled_reports.py \
            src/quantum/application/finance_center.py \
            src/quantum/application/_finance_center_shell.py \
            src/quantum/application/_finance_center_pages.py \
            src/quantum/application/_finance_center_queue_runtime.py \
            tests/test_m5_scheduled_reports.py \
            tests/integration_manifest_support_m8.py \
            docs/evidence/M5_SCHEDULED_REPORTS_RTM.json \
            docs/evidence/ARTIFACT_MANIFEST_OVERLAY_PILOT_INTEGRATION_R99.json
          test "$(git diff --cached --name-only | wc -l)" -eq 11
          git diff --cached --check
          git config user.name "Quantum Protocol Bot"
          git config user.email "quantum-protocol@users.noreply.github.com"
          git commit -m "feat(quantum): complete M5 scheduled reports R99"
          candidate="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$BASE_EXACT_HEAD"
          printf '{"milestone":"M5_SCHEDULED_WEEKLY_MONTHLY_REPORTS","candidate_sha":"%s","parent_sha":"%s","changed_files":11,"focused_contracts":16,"full_source_ci":"PASS","bounded_correction":"PASS","release_state":"RELEASE_BLOCKED","physical_l5":false}\n' "$candidate" "$BASE_EXACT_HEAD" > /tmp/m5-v2-evidence/M5_CANDIDATE.json
          set +e
          git push origin "HEAD:refs/heads/$TARGET_BRANCH" --force 2>&1 | tee /tmp/m5-v2-evidence/push.log
          status=${PIPESTATUS[0]}
          set -e
          printf 'candidate_sha=%s\npush_status=%s\n' "$candidate" "$status" > /tmp/m5-v2-evidence/candidate-sha.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: M5-Corrected-V2-Evidence
          path: /tmp/m5-v2-evidence
          if-no-files-found: error
          retention-days: 3
