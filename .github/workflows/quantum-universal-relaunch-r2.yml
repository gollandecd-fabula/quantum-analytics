name: Quantum Universal Intake and Relaunch R2

on:
  pull_request:
    paths:
      - .github/workflows/quantum-universal-relaunch-r2.yml
      - .github/workflows/shortcut-launch-repair-r1.yml
      - docs/evidence/QUANTUM_UNIVERSAL_RELAUNCH_R2_RTM.json
      - requirements/windows-home-local.txt
      - scripts/windows/**
      - src/quantum/application/_finance_center_auto_inbox.py
      - src/quantum/pilot/**
      - tests/integration_manifest_support_m8.py
      - tests/test_quantum_universal_relaunch_r2.py
      - tests/test_universal_intake_hardening_r4.py
      - tests/test_windows_one_click_installer_r1.py
      - tests/test_windows_source_package_launchers_r1.py
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: 3.13.14

jobs:
  source-and-metrics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Run focused exact-head source contracts
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/src"
          python -m compileall -q src/quantum
          python -m unittest -v \
            tests.test_quantum_universal_relaunch_r2 \
            tests.test_universal_intake_hardening_r4 \
            tests.test_universal_partial_r1 \
            tests.test_windows_one_click_installer_r1 \
            tests.test_windows_source_package_launchers_r1 \
            tests.test_shortcut_launch_repair_r1
      - name: Record exact implementation file metrics
        shell: python
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path

          paths = [
              ".github/workflows/quantum-universal-relaunch-r2.yml",
              ".github/workflows/shortcut-launch-repair-r1.yml",
              "docs/evidence/QUANTUM_UNIVERSAL_RELAUNCH_R2_RTM.json",
              "requirements/windows-home-local.txt",
              "scripts/windows/build_local_production.ps1",
              "scripts/windows/import_source.ps1",
              "scripts/windows/install_home_local.ps1",
              "src/quantum/application/_finance_center_auto_inbox.py",
              "src/quantum/pilot/import_xlsx_source.ps1",
              "src/quantum/pilot/universal_intake.py",
              "src/quantum/pilot/universal_tables.py",
              "tests/test_quantum_universal_relaunch_r2.py",
              "tests/test_universal_intake_hardening_r4.py",
              "tests/test_windows_one_click_installer_r1.py",
              "tests/test_windows_source_package_launchers_r1.py",
          ]
          entries = []
          for raw in paths:
              payload = Path(raw).read_bytes()
              entries.append(
                  [raw, hashlib.sha256(payload).hexdigest(), len(payload)]
              )
          output = {
              "exact_head": os.environ.get("GITHUB_SHA"),
              "entries": entries,
          }
          path = Path(os.environ["RUNNER_TEMP"]) / "qur2-file-metrics.json"
          path.write_text(
              json.dumps(output, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: QUR2-File-Metrics
          path: ${{ runner.temp }}/qur2-file-metrics.json
          if-no-files-found: error
          retention-days: 14

  windows-installed-runtime:
    runs-on: windows-2025
    steps:
      - name: Disable Git CRLF conversion before checkout
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install hash-pinned runtime and XLS fixture dependency
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --disable-pip-version-check --no-deps `
            --only-binary=:all: --require-hashes `
            -r requirements/windows-home-local.txt
          @'
          xlwt==1.3.0 \
              --hash=sha256:a082260524678ba48a297d922cc385f58278b8aa68741596a87de01a9c628b2e
          '@ | Set-Content "$env:RUNNER_TEMP\xlwt-test-lock.txt" -Encoding ASCII
          python -m pip install --disable-pip-version-check --no-deps `
            --only-binary=:all: --require-hashes `
            -r "$env:RUNNER_TEMP\xlwt-test-lock.txt"
      - name: Parse Windows entry scripts and run focused contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($path in @(
            "scripts/windows/build_local_production.ps1",
            "scripts/windows/import_source.ps1",
            "scripts/windows/install_home_local.ps1",
            "scripts/windows/one_click_home_local.ps1",
            "src/quantum/pilot/import_xlsx_source.ps1"
          )) {
            $tokens = $null
            $errors = $null
            [Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              throw "PowerShell parse failed: $path"
            }
          }
          $env:PYTHONPATH = (Resolve-Path "src").Path
          python -m unittest -v `
            tests.test_quantum_universal_relaunch_r2 `
            tests.test_universal_intake_hardening_r4 `
            tests.test_windows_one_click_installer_r1 `
            tests.test_shortcut_launch_repair_r1
          if ($LASTEXITCODE -ne 0) { throw "Focused Windows contracts failed." }
      - name: Verify real binary XLS content-first import
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $xls = Join-Path $env:RUNNER_TEMP "реальный отчёт без расширения.dat"
          $report = Join-Path $env:RUNNER_TEMP "real-xls-report.json"
          $storage = Join-Path $env:RUNNER_TEMP "real-xls-storage"
          @'
          from pathlib import Path
          import xlwt

          path = Path(r"__XLS_PATH__")
          book = xlwt.Workbook()
          sheet = book.add_sheet("Продажи")
          for column, value in enumerate(("Артикул", "Продажи", "Комиссия")):
              sheet.write(0, column, value)
          for row, values in enumerate(
              (("IZ001", 12, 150.5), ("IZ002", 7, 83.25)), start=1
          ):
              for column, value in enumerate(values):
                  sheet.write(row, column, value)
          empty = book.add_sheet("Пустой лист")
          empty.write(0, 0, "single")
          book.save(str(path))
          '@.Replace("__XLS_PATH__", $xls.Replace("\", "\\")) |
            Set-Content "$env:RUNNER_TEMP\make-real-xls.py" -Encoding UTF8
          python "$env:RUNNER_TEMP\make-real-xls.py"
          $env:PYTHONPATH = (Resolve-Path "src").Path
          python -c "from quantum.pilot.universal_import import main; raise SystemExit(main())" `
            --file $xls --storage-root $storage --output $report `
            --authority-attested
          if ($LASTEXITCODE -ne 0) { throw "Real XLS import returned nonzero." }
          $value = Get-Content $report -Raw -Encoding UTF8 | ConvertFrom-Json
          if ([string]$value.status -ne "ACCEPTED_PARTIAL") {
            throw "Real XLS status mismatch: $($value.status)"
          }
          if ([string]$value.detected_format -ne "XLS") {
            throw "Real XLS format mismatch: $($value.detected_format)"
          }
          if ([int]$value.universal_extraction.table_count -ne 1) {
            throw "Real XLS table count mismatch."
          }
          if ([int]$value.universal_extraction.tables[0].row_count -ne 2) {
            throw "Real XLS row count mismatch."
          }
      - name: Build package, install and verify shortcut
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $trace = Join-Path $env:RUNNER_TEMP "qur2-windows-trace.log"
          try {
            "STEP=BUILD_INSTALL_SHORTCUT START" | Add-Content $trace
            $localAppData = Join-Path $env:RUNNER_TEMP "QUR2 локально"
            $dist = Join-Path $env:RUNNER_TEMP "QUR2 dist"
            $packageRoot = Join-Path $env:RUNNER_TEMP "QUR2 package"
            $target = Join-Path $localAppData "QuantumLocalProduction"
            Remove-Item $dist,$packageRoot,$target -Recurse -Force `
              -ErrorAction SilentlyContinue

            powershell.exe -NoProfile -ExecutionPolicy Bypass `
              -File .\scripts\windows\build_local_production.ps1 `
              -OutputDirectory $dist
            if ($LASTEXITCODE -ne 0) { throw "Package build failed." }
            Expand-Archive `
              -LiteralPath (Join-Path $dist "QuantumLocalProduction_HOME_LOCAL.zip") `
              -DestinationPath $packageRoot -Force

            powershell.exe -NoProfile -ExecutionPolicy Bypass `
              -File (Join-Path $packageRoot "scripts\install_home_local.ps1") `
              -SourceRoot $packageRoot -TargetRoot $target
            if ($LASTEXITCODE -ne 0) { throw "PowerShell 5.1 install failed." }

            $desktop = [Environment]::GetFolderPath(
              [Environment+SpecialFolder]::DesktopDirectory
            )
            $shortcutPaths = @(
              (Join-Path $desktop "Центр решений Quantum.lnk"),
              (Join-Path $desktop "Quantum Decision Center.lnk")
            )
            $shortcutPath = @(
              $shortcutPaths | Where-Object { Test-Path $_ -PathType Leaf }
            ) | Select-Object -First 1
            if ([string]::IsNullOrWhiteSpace([string]$shortcutPath)) {
              throw "No verified user shortcut exists."
            }
            $shell = New-Object -ComObject Shell.Application
            $folder = $shell.Namespace((Split-Path -Parent $shortcutPath))
            if ($null -eq $folder) { throw "Shortcut folder namespace unavailable." }
            $item = $folder.ParseName((Split-Path -Leaf $shortcutPath))
            if ($null -eq $item) { throw "Shortcut shell item unavailable." }
            $shortcut = $item.GetLink
            if ($null -eq $shortcut) { throw "Shortcut shell link unavailable." }
            $expectedTarget = [IO.Path]::GetFullPath(
              (Join-Path $target "START_QUANTUM.cmd")
            )
            $actualTarget = [IO.Path]::GetFullPath([string]$shortcut.Path)
            if (
              -not $actualTarget.Equals(
                $expectedTarget, [StringComparison]::OrdinalIgnoreCase
              ) -or
              -not [string]::IsNullOrWhiteSpace([string]$shortcut.Arguments)
            ) { throw "Shortcut verification failed." }

            "QUR2_LOCALAPPDATA=$localAppData" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            "QUR2_DIST=$dist" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            "QUR2_PACKAGE_ROOT=$packageRoot" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            "QUR2_TARGET=$target" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            "STEP=BUILD_INSTALL_SHORTCUT PASS" | Add-Content $trace
          }
          catch {
            "STEP=BUILD_INSTALL_SHORTCUT FAIL: $($_.Exception.Message)" | Add-Content $trace
            throw
          }

      - name: Launch installed command twice without reinstalling
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $trace = Join-Path $env:RUNNER_TEMP "qur2-windows-trace.log"
          try {
            "STEP=REPEAT_LAUNCH START" | Add-Content $trace
            $launcher = Join-Path $env:QUR2_TARGET "START_QUANTUM.cmd"
            foreach ($number in 1..2) {
              $stdout = Join-Path $env:RUNNER_TEMP "qur2-launch-$number.stdout.txt"
              $stderr = Join-Path $env:RUNNER_TEMP "qur2-launch-$number.stderr.txt"
              $commandLine = '""{0}" -InstallOnly -NoOpenResult"' -f $launcher
              $process = Start-Process -FilePath "cmd.exe" `
                -ArgumentList @(
                  "/d", "/s", "/c", $commandLine
                ) `
                -RedirectStandardOutput $stdout `
                -RedirectStandardError $stderr `
                -Wait -PassThru
              "LAUNCH=$number EXIT=$($process.ExitCode)" | Add-Content $trace
              if ($process.ExitCode -ne 0) {
                throw "Installed START_QUANTUM.cmd relaunch $number failed."
              }
            }
            "STEP=REPEAT_LAUNCH PASS" | Add-Content $trace
          }
          catch {
            "STEP=REPEAT_LAUNCH FAIL: $($_.Exception.Message)" | Add-Content $trace
            throw
          }

      - name: Repair installation and preserve user data
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $trace = Join-Path $env:RUNNER_TEMP "qur2-windows-trace.log"
          try {
            "STEP=REPAIR_PRESERVE START" | Add-Content $trace
            foreach ($folder in @("config", "data", "output")) {
              $path = Join-Path $env:QUR2_TARGET "$folder\qur2-sentinel.txt"
              [IO.File]::WriteAllText($path, "preserve-$folder", [Text.Encoding]::UTF8)
            }
            $before = @{}
            foreach ($folder in @("config", "data", "output")) {
              $path = Join-Path $env:QUR2_TARGET "$folder\qur2-sentinel.txt"
              $before[$folder] = (Get-FileHash $path -Algorithm SHA256).Hash
            }

            & (Join-Path $env:QUR2_PACKAGE_ROOT "scripts\install_home_local.ps1") `
              -SourceRoot $env:QUR2_PACKAGE_ROOT -TargetRoot $env:QUR2_TARGET
            if ($LASTEXITCODE -ne 0) { throw "PowerShell 7 repair failed." }
            foreach ($folder in @("config", "data", "output")) {
              $path = Join-Path $env:QUR2_TARGET "$folder\qur2-sentinel.txt"
              if ((Get-FileHash $path -Algorithm SHA256).Hash -ne $before[$folder]) {
                throw "User data changed during repair: $folder"
              }
            }
            "STEP=REPAIR_PRESERVE PASS" | Add-Content $trace
          }
          catch {
            "STEP=REPAIR_PRESERVE FAIL: $($_.Exception.Message)" | Add-Content $trace
            throw
          }

      - name: Create twenty collision-free rapid import results
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $trace = Join-Path $env:RUNNER_TEMP "qur2-windows-trace.log"
          try {
            "STEP=RAPID_IMPORTS START" | Add-Content $trace
            $csv = Join-Path $env:RUNNER_TEMP "sales.csv"
            @("Артикул;Продажи", "IZ001;12") |
              Set-Content $csv -Encoding UTF8
            $outputDirectory = [IO.Path]::GetFullPath(
              (Join-Path $env:LOCALAPPDATA "QuantumLocalProduction\output")
            )
            $createdOutputPaths = @()
            foreach ($number in 1..20) {
              $stdout = Join-Path $env:RUNNER_TEMP "qur2-import-$number.stdout.txt"
              $stderr = Join-Path $env:RUNNER_TEMP "qur2-import-$number.stderr.txt"
              $importScript = Join-Path $env:QUR2_TARGET "scripts\import_source.ps1"
              $storageRoot = Join-Path $env:QUR2_TARGET "data"
              & powershell.exe -NoProfile -ExecutionPolicy Bypass `
                -File $importScript `
                -File $csv `
                -StorageRoot $storageRoot `
                -NonInteractive -AuthorityAttested -SchemaReviewed `
                -SkipDefenderScan `
                1> $stdout 2> $stderr
              $importExitCode = $LASTEXITCODE
              "IMPORT=$number EXIT=$importExitCode" | Add-Content $trace
              if ($importExitCode -ne 0) { throw "Rapid import $number failed." }
              $stdoutText = Get-Content $stdout -Raw -Encoding UTF8
              $reportLine = @(
                $stdoutText -split "`r?`n" |
                  Where-Object { $_ -match '^Отчёт:\s*' }
              ) | Select-Object -Last 1
              if ([string]::IsNullOrWhiteSpace([string]$reportLine)) {
                throw "Rapid import $number omitted its report path."
              }
              $reportPath = [IO.Path]::GetFullPath(
                ([string]$reportLine -replace '^Отчёт:\s*', '').Trim()
              )
              if (-not (Test-Path -LiteralPath $reportPath -PathType Leaf)) {
                throw "Rapid import $number report does not exist: $reportPath"
              }
              if (-not ([IO.Path]::GetDirectoryName($reportPath)).Equals(
                $outputDirectory, [StringComparison]::OrdinalIgnoreCase
              )) {
                throw "Rapid import $number wrote outside the installed output directory."
              }
              $createdOutputPaths += $reportPath
            }
            $created = $createdOutputPaths.Count
            "RAPID_OUTPUTS_CREATED=$created" | Add-Content $trace
            if ($created -ne 20) {
              throw "Rapid imports did not create twenty distinct results."
            }
            if (@($createdOutputPaths | Sort-Object -Unique).Count -ne 20) {
              throw "Output filename collision detected."
            }
            "STEP=RAPID_IMPORTS PASS" | Add-Content $trace
          }
          catch {
            "STEP=RAPID_IMPORTS FAIL: $($_.Exception.Message)" | Add-Content $trace
            throw
          }

      - name: Fail closed for an incomplete installed tree
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $trace = Join-Path $env:RUNNER_TEMP "qur2-windows-trace.log"
          try {
            "STEP=INCOMPLETE_INSTALL START" | Add-Content $trace
            $partial = Join-Path $env:RUNNER_TEMP "QUR2 incomplete"
            Remove-Item $partial -Recurse -Force -ErrorAction SilentlyContinue
            New-Item (Join-Path $partial "scripts") -ItemType Directory -Force |
              Out-Null
            Copy-Item (Join-Path $env:QUR2_TARGET "START_QUANTUM.cmd") $partial -Force
            Copy-Item `
              (Join-Path $env:QUR2_TARGET "scripts\one_click_home_local.ps1") `
              (Join-Path $partial "scripts\one_click_home_local.ps1") -Force
            $partialLog = Join-Path $env:RUNNER_TEMP "qur2-partial.log"
            $process = Start-Process -FilePath "cmd.exe" `
              -ArgumentList @(
                "/d", "/s", "/c",
                "`"$(Join-Path $partial 'START_QUANTUM.cmd')`" -InstallOnly -NoOpenResult < NUL"
              ) `
              -RedirectStandardOutput $partialLog `
              -RedirectStandardError (Join-Path $env:RUNNER_TEMP "qur2-partial.stderr.log") `
              -Wait -PassThru
            "INCOMPLETE_EXIT=$($process.ExitCode)" | Add-Content $trace
            if ($process.ExitCode -eq 0) { throw "Incomplete installation was accepted." }
            $partialText = Get-Content $partialLog -Raw -ErrorAction SilentlyContinue
            if ($partialText -notmatch "HOME_LOCAL_INSTALLATION_INCOMPLETE") {
              throw "Incomplete installation omitted repair diagnostic."
            }
            "STEP=INCOMPLETE_INSTALL PASS" | Add-Content $trace
          }
          catch {
            "STEP=INCOMPLETE_INSTALL FAIL: $($_.Exception.Message)" | Add-Content $trace
            throw
          }

      - name: Write QUR2 Windows evidence
        shell: pwsh
        run: |
          $evidence = [ordered]@{
            exact_head = "${{ github.event.pull_request.head.sha || github.sha }}"
            real_xls = "PASS"
            powershell_51_install = "PASS"
            powershell_7_repair = "PASS"
            shortcut = "PASS"
            repeat_launches = 2
            rapid_unique_outputs = 20
            user_data_preserved = "PASS"
            incomplete_install_fail_closed = "PASS"
            release_scope = "WB_ONLY"
            marketplace_write_enabled = $false
          }
          $evidence | ConvertTo-Json -Depth 6 |
            Set-Content (Join-Path $env:RUNNER_TEMP "qur2-windows-evidence.json") `
              -Encoding UTF8

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: QUR2-Windows-Installed-Runtime
          path: |
            ${{ runner.temp }}/real-xls-report.json
            ${{ runner.temp }}/qur2-windows-evidence.json
            ${{ runner.temp }}/qur2-windows-trace.log
            ${{ runner.temp }}/qur2-launch-*.stdout.txt
            ${{ runner.temp }}/qur2-launch-*.stderr.txt
            ${{ runner.temp }}/qur2-import-*.stdout.txt
            ${{ runner.temp }}/qur2-import-*.stderr.txt
            ${{ runner.temp }}/qur2-partial.log
            ${{ runner.temp }}/qur2-partial.stderr.log
          if-no-files-found: warn
          retention-days: 14
