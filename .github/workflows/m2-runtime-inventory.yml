name: Apply M2 Runtime Dependency Modernization

on:
  pull_request:
    types: [reopened, synchronize]

permissions:
  contents: write

jobs:
  apply-m2-runtime:
    if: >-
      github.event.pull_request.head.ref == 'fix/quantum-runtime-dependency-r1'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact M2 staging head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up exact Python target
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.14'

      - name: Reassemble, verify, apply and squash M2
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          M1_HEAD: ad5229bbaca3cf8ae692ecb09f54220cde1db16b
          TARGET_BRANCH: fix/quantum-runtime-dependency-r1
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"
          test "$(find tools -maxdepth 1 -type f -name 'm2_apply_part_*.txt' | wc -l)" -eq 6
          test "$(find tools -maxdepth 1 -type f -name 'm2_apply_fix_*.txt' | wc -l)" -eq 4
          cat tools/m2_apply_part_00.txt \
              tools/m2_apply_part_01.txt \
              tools/m2_apply_fix_02.txt \
              tools/m2_apply_fix_03.txt \
              tools/m2_apply_fix_04.txt \
              tools/m2_apply_fix_05.txt > /tmp/m2-applicator.b64
          test "$(wc -c < /tmp/m2-applicator.b64)" -eq 25072
          test "$(sha256sum /tmp/m2-applicator.b64 | awk '{print $1}')" = \
            "39ba26d34061a29d99c6af6f5323326de0a4f0264c557312a6b5bbe87bb91d21"
          base64 --decode /tmp/m2-applicator.b64 > tools/apply_m2_runtime_dependency.py
          test "$(wc -c < tools/apply_m2_runtime_dependency.py)" -eq 18802
          test "$(sha256sum tools/apply_m2_runtime_dependency.py | awk '{print $1}')" = \
            "9171d3b4172304f23567a3101c269ad51b5b46fc03df7c06882c065f4c8ce99f"
          python -m py_compile tools/apply_m2_runtime_dependency.py
          git rm -f tools/m2_apply_part_00.txt \
                    tools/m2_apply_part_01.txt \
                    tools/m2_apply_part_02.txt \
                    tools/m2_apply_part_03.txt \
                    tools/m2_apply_part_04.txt \
                    tools/m2_apply_part_05.txt \
                    tools/m2_apply_fix_02.txt \
                    tools/m2_apply_fix_03.txt \
                    tools/m2_apply_fix_04.txt \
                    tools/m2_apply_fix_05.txt
          set +e
          GITHUB_HEAD_REF="${TARGET_BRANCH}" \
            python tools/apply_m2_runtime_dependency.py 2>&1 | tee /tmp/m2-apply.log
          code=${PIPESTATUS[0]}
          set -e
          test "${code}" -eq 0
          script_head="$(git rev-parse HEAD)"
          test "$(git merge-base "${M1_HEAD}" "${script_head}")" = "${M1_HEAD}"
          git reset --soft "${M1_HEAD}"
          git config user.name quantum-m2-bot
          git config user.email quantum-m2-bot@users.noreply.github.com
          git commit -m "fix(quantum): modernize Python and tzdata baseline"
          final_head="$(git rev-parse HEAD)"
          test "$(git rev-list --count "${M1_HEAD}..${final_head}")" -eq 1
          git push \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${script_head}" \
            origin "HEAD:${TARGET_BRANCH}"
          echo "M2_FINAL_HEAD=${final_head}" | tee -a /tmp/m2-apply.log
          echo "M2_RESULT=PASS" | tee -a /tmp/m2-apply.log

      - name: Upload M2 apply evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quantum-m2-runtime-apply-log
          path: /tmp/m2-apply.log
          if-no-files-found: warn
          retention-days: 3
